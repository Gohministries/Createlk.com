"use strict";


/* =================================
   PREMIUM WORKER
================================= */

const WORKER =
"https://premium-worker.gateofheavensl1.workers.dev";

const LIMIT = 100;


/* =================================
   VARIABLES
================================= */

let email = "";
let premium = false;
let usage = 0;
let timer = null;


/* =================================
   ELEMENTS
================================= */

const $ =
id => document.getElementById(id);

const membership =
$("membership");

const generateButton =
$("generate");

const loading =
$("loading");

const status =
$("status");

const questionCard =
$("questionCard");

const question =
$("question");

const options =
$("options");

const answer =
$("answer");

const next =
$("next");

const logoutButton =
$("logout");


/* =================================
   GET EMAIL
================================= */

function getEmail(){

const keys = [

"createlk_student_email",
"studentEmail",
"email"

];


for(
const key of keys
){

const value =
localStorage.getItem(key);

if(
value &&
value.trim()
){

return value
.trim()
.toLowerCase();

}

}


for(
const key of [
"createlk_user",
"createlk_student"
]
){

try{

const user =
JSON.parse(
localStorage.getItem(key)
);

if(
user &&
user.email
){

return user.email
.trim()
.toLowerCase();

}

}catch(e){}

}


return "";

}


/* =================================
   UPDATE LOGIN UI
================================= */

function updateLoginUI(){

email =
getEmail();

if(email){

logoutButton.style.display =
"block";

}else{

logoutButton.style.display =
"none";

}

}


/* =================================
   STATUS
================================= */

function msg(
text,
type
){

status.textContent =
text;

status.className =
"status " + type;

status.style.display =
"block";

}


/* =================================
   ACTIVE CHECK
================================= */

function isActive(data){

if(!data){
return false;
}


/* Worker direct response */

if(
data.active === true
){

return true;

}


/* status */

if(
String(
data.status || ""
).toLowerCase()
===
"active"
){

return true;

}


/* membership */

if(
data.membership &&
String(
data.membership.status || ""
).toLowerCase()
===
"active"
){

return true;

}


/* subscription */

if(
data.subscription &&
String(
data.subscription.status || ""
).toLowerCase()
===
"active"
){

return true;

}


return false;

}


/* =================================
   EXPIRY
================================= */

function getExpiry(data){

if(!data){
return null;
}

return (

data.expires_at ||

data.expiresAt ||

data.expiry ||

data.expiry_date ||

(
data.membership &&
(
data.membership.expires_at ||
data.membership.expiresAt
)
) ||

(
data.subscription &&
(
data.subscription.expires_at ||
data.subscription.expiresAt
)
) ||

null

);

}


/* =================================
   USAGE
================================= */

function getUsage(data){

if(!data){
return 0;
}

return Number(

data.usage ??

data.today_usage ??

data.daily_usage ??

(
data.membership &&
(
data.membership.usage ??
data.membership.today_usage
)
) ??

0

);

}


/* =================================
   UPDATE USAGE
================================= */

function updateUsage(){

const remaining =
Math.max(
LIMIT - usage,
0
);

const used =
membership.querySelector(
".usage"
);

const left =
membership.querySelector(
".remaining"
);

const bar =
membership.querySelector(
".progress-bar"
);


if(used){

used.textContent =
`📊 Today's AI Usage: ${usage} / ${LIMIT}`;

}


if(left){

left.textContent =
`✨ Remaining today: ${remaining}`;

}


if(bar){

bar.style.width =
Math.min(
usage / LIMIT * 100,
100
) + "%";

}

}


/* =================================
   COUNTDOWN
================================= */

function startCountdown(expiry){

clearInterval(timer);

const end =
new Date(
String(expiry)
.replace(" ","T")
).getTime();


function run(){

let seconds =
Math.floor(
(end - Date.now()) / 1000
);


if(
seconds <= 0
){

clearInterval(timer);

premium = false;

generateButton.disabled =
true;

generateButton.textContent =
"🔒 Premium Expired";

membership.className =
"membership locked";

membership.innerHTML =
"🔒 <b>Premium membership expired.</b>";

return;

}


const days =
Math.floor(
seconds / 86400
);

seconds %= 86400;


const hours =
Math.floor(
seconds / 3600
);

seconds %= 3600;


const minutes =
Math.floor(
seconds / 60
);

seconds %= 60;


const box =
membership.querySelector(
".countdown"
);


if(box){

box.textContent =
`⏳ Expires in: ${days}d ${hours}h ${minutes}m ${seconds}s`;

}

}


run();

timer =
setInterval(
run,
1000
);

}


/* =================================
   VERIFY PREMIUM
================================= */

async function verify(){

updateLoginUI();

email =
getEmail();


if(!email){

premium = false;

membership.className =
"membership locked";

membership.innerHTML =
"🔐 <b>Please login to access Premium.</b>";

generateButton.disabled =
true;

generateButton.textContent =
"🔐 Login Required";

msg(
"Please login before using Premium AI.",
"error"
);

return;

}


try{

const response =
await fetch(

WORKER +
"/status?email=" +
encodeURIComponent(email) +
"&t=" +
Date.now(),

{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}

}

);


const text =
await response.text();


console.log(
"PREMIUM STATUS:",
text
);


let data;

try{

data =
JSON.parse(text);

}catch(e){

throw new Error(
"Premium worker returned invalid JSON."
);

}


if(
!response.ok
){

throw new Error(
"Premium server error: " +
response.status
);

}


if(
!isActive(data)
){

premium = false;

membership.className =
"membership locked";

membership.innerHTML =
"🔒 <b>Premium membership not found.</b>";

generateButton.disabled =
true;

generateButton.textContent =
"🔒 Premium Required";

msg(
"Premium membership not found.",
"error"
);

return;

}


/* =================================
   ACTIVE
================================= */

premium = true;

usage =
getUsage(data);

const expiry =
getExpiry(data);


membership.className =
"membership active";


membership.innerHTML =

"<b>⭐ Premium Active</b>" +

`<div class="email">
${email}
</div>` +

(
expiry
?
`<div>
📅 Expires:
${
new Date(
String(expiry)
.replace(" ","T")
).toLocaleDateString()
}
</div>`
:
""
) +

`<div class="countdown">
⏳ Checking...
</div>` +

`<div class="usage">
📊 Today's AI Usage: ${usage} / ${LIMIT}
</div>` +

`<div class="remaining">
✨ Remaining today: ${Math.max(
LIMIT - usage,
0
)}
</div>` +

`<div class="progress">
<div class="progress-bar"></div>
</div>`;


updateUsage();


if(expiry){

startCountdown(
expiry
);

}


if(
usage >= LIMIT
){

generateButton.disabled =
true;

generateButton.textContent =
"🔒 Daily Limit Reached";

msg(
"You have reached today's 100 Premium MCQ limit.",
"error"
);

}else{

generateButton.disabled =
false;

generateButton.textContent =
"✨ Generate Premium MCQ";

msg(
"✅ Premium access verified.",
"success"
);

}


}catch(error){

console.error(
"VERIFY ERROR:",
error
);

premium = false;

generateButton.disabled =
true;

generateButton.textContent =
"⏳ Try Again";

membership.className =
"membership locked";

membership.innerHTML =
"⚠️ <b>Unable to verify Premium membership.</b>";

msg(
"❌ " + error.message,
"error"
);

}

}


/* =================================
   GENERATE
================================= */

async function generate(){

if(!premium){

await verify();

return;

}


if(
usage >= LIMIT
){

msg(
"🔒 Today's 100 MCQ limit has been reached.",
"error"
);

return;

}


generateButton.disabled =
true;

loading.style.display =
"block";

status.style.display =
"none";

questionCard.style.display =
"none";


const category =
$("category").value;

const level =
$("level").value;


try{

const response =
await fetch(

WORKER +
"/api/ai-mcq",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:email,

category:category,

topic:category,

level:level,

type:"premium"

})

}

);


const text =
await response.text();


let data;

try{

data =
JSON.parse(text);

}catch(e){

throw new Error(
"AI worker returned invalid JSON."
);

}


console.log(
"AI RESPONSE:",
data
);


if(
!response.ok ||
data.success !== true
){

throw new Error(

data.error ||
data.message ||
"Premium AI generation failed."

);

}


let mcq =

data.mcq ||
data.data ||
data.result ||
data;


if(
typeof mcq === "string"
){

mcq =
JSON.parse(mcq);

}


if(
!mcq.question ||
!mcq.options
){

throw new Error(
"Invalid MCQ response."
);

}


if(
typeof mcq.options === "string"
){

mcq.options =
JSON.parse(
mcq.options
);

}


usage =
Number(

data.usage ??
data.today_usage ??
data.daily_usage ??
(
usage + 1
)

);


updateUsage();

showMCQ(
mcq
);


if(
usage >= LIMIT
){

generateButton.disabled =
true;

generateButton.textContent =
"🔒 Daily Limit Reached";

}else{

generateButton.disabled =
false;

generateButton.textContent =
"✨ Generate Premium MCQ";

}


msg(
"✅ MCQ generated successfully.",
"success"
);


}catch(error){

console.error(
"GENERATION ERROR:",
error
);

generateButton.disabled =
false;

generateButton.textContent =
"✨ Generate Premium MCQ";

msg(
"❌ " + error.message,
"error"
);

}finally{

loading.style.display =
"none";

}

}


/* =================================
   SHOW MCQ
================================= */

function showMCQ(mcq){

questionCard.style.display =
"block";

question.textContent =
mcq.question;

options.innerHTML =
"";

answer.innerHTML =
"";

next.style.display =
"none";


const correct =
String(

mcq.answer ||
mcq.correct_answer ||
mcq.correctAnswer ||
""

)
.trim()
.toUpperCase();


["A","B","C","D"].forEach(
letter=>{

const button =
document.createElement(
"button"
);

button.className =
"option";

button.type =
"button";

button.textContent =
letter +
". " +
(
mcq.options[letter] ||
""
);


button.onclick =
function(){

document
.querySelectorAll(
".option"
)
.forEach(
x=>{
x.disabled = true;
}
);


if(
letter === correct
){

button.classList.add(
"correct"
);

answer.innerHTML =
"🎉 <b>Correct!</b><br><br>" +
(
mcq.explanation ||
"Excellent work!"
);

}else{

button.classList.add(
"wrong"
);

document
.querySelectorAll(
".option"
)
.forEach(
x=>{

if(
x.textContent.startsWith(
correct + "."
)
){

x.classList.add(
"correct"
);

}

}
);

answer.innerHTML =
"❌ <b>Incorrect.</b><br><br>" +
"Correct answer: <b>" +
correct +
"</b><br><br>" +
(
mcq.explanation ||
"Review the explanation."
);

}


if(
premium &&
usage < LIMIT
){

next.style.display =
"block";

}

};


options.appendChild(
button
);

});


questionCard.scrollIntoView({
behavior:"smooth",
block:"start"
});

}


/* =================================
   BUTTONS
================================= */

generateButton.onclick =
generate;

next.onclick =
generate;


/* =================================
   LOGOUT
================================= */

logoutButton.onclick =
function(){

localStorage.removeItem(
"createlk_student_email"
);

localStorage.removeItem(
"studentEmail"
);

localStorage.removeItem(
"email"
);

localStorage.removeItem(
"createlk_user"
);

localStorage.removeItem(
"createlk_student"
);

sessionStorage.clear();

email = "";
premium = false;

clearInterval(timer);

/* Immediately hide logout */

logoutButton.style.display =
"none";

/* Go home */

window.location.href =
"index.html";

};


/* =================================
   START
================================= */

updateLoginUI();

verify();


/* =================================
   RETURN TO PAGE
================================= */

document.addEventListener(
"visibilitychange",
function(){

if(
document.visibilityState ===
"visible"
){

verify();

}

});

</script></body>
