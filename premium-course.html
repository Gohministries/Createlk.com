<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Premium AI English</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#174ea6;color:white;padding:14px}
.nav{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}
.nav-right{display:flex;gap:8px;align-items:center}
.home,.logout{color:white;font-weight:700}
.home{text-decoration:none}
.logout{background:#ffffff18;border:1px solid #ffffff55;padding:8px 10px;border-radius:8px}
main{max-width:760px;margin:auto;padding:25px 15px}
.hero{text-align:center;margin-bottom:20px}
.icon{font-size:50px}
h1{color:#174ea6;margin:8px 0}
.hero p{color:#667085;line-height:1.6}
.card{background:white;padding:20px;border-radius:18px;margin-bottom:16px;box-shadow:0 5px 24px #0001}
.membership{padding:15px;border-radius:12px;background:#eef4ff;color:#174ea6;margin-bottom:18px;line-height:1.6}
.membership.active{background:#dcfce7;color:#166534}
.membership.expired{background:#fee2e2;color:#991b1b}
.email{font-size:13px;word-break:break-word}
.countdown{font-weight:800;margin-top:6px}
.usage{font-weight:800;margin-top:10px}
.remaining{font-size:13px}
.progress{height:9px;background:#e5e7eb;border-radius:10px;margin-top:7px;overflow:hidden}
.progress-bar{height:100%;width:0;background:#20a464}
label{display:block;font-weight:800;margin:12px 0 6px}
select{width:100%;padding:13px;border:1px solid #d5dbe5;border-radius:10px;font-size:16px}
button{font-size:16px;font-weight:800;cursor:pointer}
.generate,.next{width:100%;padding:14px;border:0;border-radius:10px;background:#174ea6;color:white}
.generate{margin-top:16px}
.generate:disabled{opacity:.5;cursor:not-allowed}
.loading{text-align:center;padding:15px;display:none}
.status{padding:13px;border-radius:10px;margin-top:14px;font-weight:700;display:none}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.question-card{display:none}
.question{font-size:20px;font-weight:800;line-height:1.5;margin-bottom:18px}
.option{width:100%;padding:14px;margin-bottom:10px;border:2px solid #ddd;border-radius:10px;background:white;text-align:left}
.option:disabled{cursor:default}
.correct{background:#dcfce7!important;border-color:#16a34a!important;color:#166534}
.wrong{background:#fee2e2!important;border-color:#dc2626!important;color:#991b1b}
.answer{margin-top:15px;line-height:1.6}
.next{display:none;margin-top:15px}
footer{text-align:center;padding:25px;color:#667085;font-size:13px;line-height:1.8}
</style></head><body><header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<div class="nav-right">
<a class="home" href="index.html">🏠 Home</a>
<button id="logout" class="logout" type="button">🚪 Logout</button>
</div>
</div>
</header><main><section class="hero">
<div class="icon">⭐</div>
<h1>Premium AI English MCQs</h1>
<p>Practise English with up to <b>100 AI-generated MCQs every day.</b></p>
</section><section class="card"><div id="membership" class="membership">
⏳ Checking Premium membership...
</div><label>📚 Subject</label>
<select id="category">

<option>English Vocabulary</option>
<option>English Grammar</option>
<option>English Tenses</option>
<option>Parts of Speech</option>
<option>Prepositions</option>
<option>Articles</option>
<option>Sentence Structure</option>
<option>Spelling</option>
<option>Punctuation</option>
<option>Conversation English</option>
<option>Reading Comprehension</option>
<option>Mixed English</option>
</select><label>🎓 Difficulty</label>
<select id="level">

<option>Beginner</option>
<option selected>Intermediate</option>
<option>Advanced</option>
</select><button id="generate" class="generate" type="button" disabled>
⏳ Checking Premium...
</button><div id="loading" class="loading">
🤖 Premium AI is generating...
</div><div id="status" class="status"></div></section><section id="questionCard" class="card question-card"><div id="question" class="question"></div><div id="options"></div><div id="answer" class="answer"></div><button id="next" class="next" type="button">
➡️ Next MCQ
</button></section></main><footer>
📚 <b>CreateLK Academy</b><br>
Learn English. Build Your Future.<br><br>
© 2026 CreateLK Academy.
</footer><script>

"use strict";

const WORKER="https://premium-worker.gateofheavensl1.workers.dev";
const LIMIT=100;

let email="";
let premium=false;
let usage=0;
let timer=null;

const $=id=>document.getElementById(id);

const membership=$("membership");
const generateButton=$("generate");
const loading=$("loading");
const status=$("status");
const questionCard=$("questionCard");
const question=$("question");
const options=$("options");
const answer=$("answer");
const next=$("next");


/* EMAIL */

function getEmail(){

for(const key of [
"createlk_student_email",
"studentEmail",
"email"
]){

const v=localStorage.getItem(key);

if(v)return v.trim().toLowerCase();

}

for(const key of [
"createlk_user",
"createlk_student"
]){

try{

const v=JSON.parse(localStorage.getItem(key));

if(v?.email)return v.email.trim().toLowerCase();

}catch(e){}

}

return "";

}


/* STATUS */

function msg(text,type){

status.textContent=text;
status.className="status "+type;
status.style.display="block";

}


/* USAGE */

function updateUsage(){

const remain=Math.max(LIMIT-usage,0);

const bar=membership.querySelector(".progress-bar");

const used=membership.querySelector(".usage");

const left=membership.querySelector(".remaining");

if(used)
used.textContent=`📊 Today's AI Usage: ${usage} / ${LIMIT}`;

if(left)
left.textContent=`✨ Remaining today: ${remain}`;

if(bar)
bar.style.width=Math.min(usage/LIMIT*100,100)+"%";

}


/* COUNTDOWN */

function countdown(expiry){

clearInterval(timer);

const end=new Date(
String(expiry).replace(" ","T")
).getTime();

function run(){

let s=Math.floor((end-Date.now())/1000);

if(s<=0){

clearInterval(timer);

premium=false;

generateButton.disabled=true;

generateButton.textContent="🔒 Premium Expired";

membership.className="membership expired";

membership.innerHTML="🔒 <b>Premium membership expired.</b>";

return;

}

const d=Math.floor(s/86400);

s%=86400;

const h=Math.floor(s/3600);

s%=3600;

const m=Math.floor(s/60);

s%=60;

const box=membership.querySelector(".countdown");

if(box)
box.textContent=`⏳ Expires in: ${d}d ${h}h ${m}m ${s}s`;

}

run();

timer=setInterval(run,1000);

}


/* VERIFY */

async function verify(){

email=getEmail();

if(!email){

membership.className="membership expired";
membership.innerHTML="🔐 <b>Please login to access Premium.</b>";

generateButton.disabled=true;
generateButton.textContent="🔐 Login Required";

msg("Please login before using Premium AI.","error");

return;

}

try{

const r=await fetch(
WORKER+
"/api/verify-premium?email="+
encodeURIComponent(email)+
"&t="+Date.now(),
{cache:"no-store"}
);

const data=await r.json();

if(!r.ok||data.active!==true){

premium=false;

membership.className="membership expired";
membership.innerHTML="🔒 <b>Premium membership required.</b>";

generateButton.disabled=true;
generateButton.textContent="🔒 Premium Required";

msg(data.message||"Premium membership is not active.","error");

return;

}

premium=true;
usage=Number(data.usage||0);

membership.className="membership active";

membership.innerHTML=
"<b>⭐ Premium Active</b>"+
`<div class="email">${email}</div>`+
`<div>📅 Expires: ${new Date(String(data.expires_at).replace(" ","T")).toLocaleDateString()}</div>`+
`<div class="countdown">⏳ Checking...</div>`+
`<div class="usage">📊 Today's AI Usage: ${usage} / ${LIMIT}</div>`+
`<div class="remaining">✨ Remaining today: ${LIMIT-usage}</div>`+
'<div class="progress"><div class="progress-bar"></div></div>';

updateUsage();

countdown(data.expires_at);

if(usage>=LIMIT){

generateButton.disabled=true;
generateButton.textContent="🔒 Daily Limit Reached";

msg("You have reached today's 100 Premium MCQ limit.","error");

}else{

generateButton.disabled=false;
generateButton.textContent="✨ Generate Premium MCQ";

msg("✅ Premium access verified.","success");

}

}catch(e){

console.error(e);

generateButton.disabled=true;
generateButton.textContent="⏳ Try Again";

msg("❌ Unable to verify Premium membership.","error");

}

}


/* GENERATE */

async function generate(){

if(!premium)return;

if(usage>=LIMIT){

msg("🔒 Today's 100 MCQ limit has been reached.","error");
return;

}

generateButton.disabled=true;
loading.style.display="block";
status.style.display="none";
questionCard.style.display="none";

const category=$("category").value;
const level=$("level").value;

try{

const r=await fetch(
WORKER+"/api/ai-mcq",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email,
category,
topic:category,
level,
type:"premium"
})
}
);

const data=await r.json();

console.log("AI RESPONSE:",data);

if(!r.ok||data.success!==true)
throw new Error(data.error||data.message||"Generation failed");

let mcq=data.mcq||data.data||data.result||data;

if(typeof mcq==="string")
mcq=JSON.parse(mcq);

if(!mcq.question||!mcq.options)
throw new Error("Invalid MCQ response");

if(typeof mcq.options==="string")
mcq.options=JSON.parse(mcq.options);

usage=Number(data.usage??usage+1);

updateUsage();
showMCQ(mcq);

if(usage>=LIMIT){

generateButton.disabled=true;
generateButton.textContent="🔒 Daily Limit Reached";

}else{

generateButton.disabled=false;
generateButton.textContent="✨ Generate Premium MCQ";

}

msg("✅ MCQ generated successfully.","success");

}catch(e){

console.error("AI ERROR:",e);

generateButton.disabled=false;
generateButton.textContent="✨ Generate Premium MCQ";

msg("❌ "+e.message,"error");

}finally{

loading.style.display="none";

}

}


/* SHOW MCQ */

function showMCQ(mcq){

questionCard.style.display="block";

question.textContent=mcq.question;

options.innerHTML="";

answer.innerHTML="";

next.style.display="none";

const correct=String(
mcq.answer||mcq.correct_answer||""
).trim().toUpperCase();

["A","B","C","D"].forEach(letter=>{

const b=document.createElement("button");

b.className="option";
b.type="button";

b.textContent=
letter+". "+mcq.options[letter];

b.onclick=()=>{

document
.querySelectorAll(".option")
.forEach(x=>x.disabled=true);

if(letter===correct){

b.classList.add("correct");

answer.innerHTML=
"🎉 <b>Correct!</b><br><br>"+
(mcq.explanation||"Excellent work!");

}else{

b.classList.add("wrong");

document
.querySelectorAll(".option")
.forEach(x=>{

if(x.textContent.startsWith(correct+"."))
x.classList.add("correct");

});

answer.innerHTML=
"❌ <b>Incorrect.</b><br><br>"+
"Correct answer: <b>"+correct+"</b><br><br>"+
(mcq.explanation||"Review the explanation.");

}

if(premium&&usage<LIMIT)
next.style.display="block";

};

options.appendChild(b);

});

questionCard.scrollIntoView({
behavior:"smooth",
block:"start"
});

}


/* BUTTON FIX */

generateButton.onclick=generate;

next.onclick=generate;


/* LOGOUT */

$("logout").onclick=()=>{

if(!confirm("Are you sure you want to logout?"))
return;

[
"createlk_student_email",
"studentEmail",
"email",
"createlk_user",
"createlk_student"
].forEach(k=>localStorage.removeItem(k));

sessionStorage.clear();

clearInterval(timer);

location.href="login.html";

};


/* START */

verify();


document.addEventListener(
"visibilitychange",
()=>{

if(document.visibilityState==="visible")
verify();

});

</script></body>
</html>
