<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Premium AI MCQs</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
header{background:#172554;color:white;padding:14px;display:flex;justify-content:space-between}
button,select{padding:12px;border:0;border-radius:8px;font-size:15px}
button{cursor:pointer}
nav button{padding:8px;background:white;color:#172554}
main{max-width:800px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #ddd;margin-bottom:18px}
select{width:100%;border:1px solid #ccd;margin-top:8px}
.generate{width:100%;margin-top:15px;background:#2563eb;color:white;font-weight:bold}
.q{background:#f8fafc;padding:15px;margin:12px 0;border-radius:10px}
.opt{display:block;background:white;padding:10px;margin:7px 0;border-radius:7px;border:1px solid #ddd}
.status{padding:12px;margin-top:12px;border-radius:8px}
.err{background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}
#questions{margin-top:15px}
.submit{width:100%;background:#16a34a;color:white;font-weight:bold}
#result{text-align:center;font-size:20px;font-weight:bold;margin-top:15px}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>

<body>

<header>
<b>📚 CreateLK Academy</b>
<nav>
<button onclick="location.href='index.html'">🏠 Home</button>
<button onclick="logout()">🚪 Logout</button>
</nav>
</header>

<main>

<div class="card">

<h2>⭐ Premium AI English MCQs</h2>
<p>Practise English with AI-generated MCQs.</p>

<div id="member" class="status ok">
⭐ Premium Membership Active<br>
⏳ Expires in: <b id="time">Checking...</b>
</div>

<br>

<label><b>📚 Choose Subject</b></label>

<select id="subject">

<option>🟢 General English</option>
<option>📖 Grammar</option>
<option>🧩 Vocabulary</option>
<option>✍️ Sentence Formation</option>
<option>🔤 Parts of Speech</option>
<option>⏰ Tenses</option>
<option>🗣️ Speaking English</option>
<option>👂 Listening English</option>
<option>📚 Reading Comprehension</option>
<option>📝 Writing Skills</option>
<option>🔄 Active & Passive Voice</option>
<option>💬 Direct & Indirect Speech</option>
<option>🔗 Prepositions</option>
<option>🔢 Articles</option>
<option>🔀 Conjunctions</option>
<option>🧠 Synonyms</option>
<option>↔️ Antonyms</option>
<option>🎯 Phrasal Verbs</option>
<option>💡 Idioms</option>
<option>📰 Daily English</option>
<option>💼 Business English</option>
<option>🎓 Academic English</option>
<option>✈️ Travel English</option>
<option>👔 Job Interview English</option>
<option>🏆 Advanced English</option>

</select>

<br><br>

<label><b>🔢 Number of Questions</b></label>

<select id="count">
<option value="5">5 Questions</option>
<option value="10">10 Questions</option>
<option value="20">20 Questions</option>
<option value="30">30 Questions</option>
</select>

<button id="gen" class="generate" onclick="generate()">
🤖 Generate AI MCQs
</button>

<div id="msg"></div>

</div>

<div id="box" class="card" style="display:none">

<div id="questions"></div>

<button class="submit" onclick="check()">
✅ Submit Answers
</button>

<div id="result"></div>

</div>

</main>

<footer>
📚 CreateLK Academy<br>
Learn English. Build Your Future.<br><br>
© 2026 CreateLK Academy. All Rights Reserved.
</footer>

<script>

const WORKER="https://gateofheavensl1.workers.dev/api/ai-mcq";

let qs=[];

const email=
localStorage.getItem("studentEmail")||
localStorage.getItem("email")||
localStorage.getItem("userEmail")||"";

if(!email) location.href="login.html";


/* Generate */

async function generate(){

let btn=document.getElementById("gen");
let msg=document.getElementById("msg");

let subject=document.getElementById("subject").value;
let count=Number(document.getElementById("count").value);

btn.disabled=true;
btn.textContent="⏳ Generating...";
msg.innerHTML="";

try{

let r=await fetch(WORKER,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

email:email,
student_email:email,

subject:subject,

question_count:count,
count:count

})
});

let text=await r.text();

let d;

try{
d=JSON.parse(text);
}catch(e){
throw Error("AI Worker returned invalid JSON.");
}

if(!r.ok||!d.success)
throw Error(d.error||d.message||"Generation failed.");

qs=d.questions||d.mcqs||[];

if(!Array.isArray(qs)||!qs.length)
throw Error("No MCQs returned.");

show();

}catch(e){

msg.innerHTML=
`<div class="status err">❌ ${e.message}</div>`;

}

btn.disabled=false;
btn.textContent="🤖 Generate AI MCQs";

}


/* Show questions */

function show(){

let html="";

qs.forEach((q,i)=>{

let options=q.options||q.choices||[];

html+=`

<div class="q">

<b>Question ${i+1}</b>

<p>${q.question}</p>

${options.map((o,j)=>`

<label class="opt">

<input type="radio"
name="q${i}"
value="${j}">

${o}

</label>

`).join("")}

</div>

`;

});

document.getElementById("questions").innerHTML=html;

document.getElementById("box").style.display="block";

window.scrollTo({
top:500,
behavior:"smooth"
});

}


/* Check */

function check(){

let score=0;

qs.forEach((q,i)=>{

let a=document.querySelector(
`input[name="q${i}"]:checked`
);

if(!a)return;

let correct=
q.correctAnswer??
q.correct_answer??
q.answer;

let options=q.options||q.choices||[];

if(
String(a.value)==String(correct)||
options[a.value]===correct
)score++;

});

document.getElementById("result").textContent=
`🎯 Score: ${score} / ${qs.length}`;

}


/* Countdown */

let expiry=
localStorage.getItem("premiumExpiresAt");

function countdown(){

if(!expiry)return;

let d=new Date(expiry)-Date.now();

if(d<=0){

document.getElementById("time").textContent="Expired";

return;

}

let days=Math.floor(d/86400000);
let hrs=Math.floor(d/3600000)%24;
let min=Math.floor(d/60000)%60;
let sec=Math.floor(d/1000)%60;

document.getElementById("time").textContent=
`${days}d ${hrs}h ${min}m ${sec}s`;

}

countdown();

setInterval(countdown,1000);


/* Logout */

function logout(){

localStorage.removeItem("studentEmail");
localStorage.removeItem("email");
localStorage.removeItem("userEmail");

location.href="login.html";

}

</script>

</body>
</html>
