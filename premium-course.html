<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Premium AI MCQs</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#174ea6;color:white;padding:15px;display:flex;justify-content:space-between}
header a{color:white;text-decoration:none}
main{max-width:700px;margin:auto;padding:25px 15px}
.hero{text-align:center;margin-bottom:20px}
.icon{font-size:50px}
h1{color:#174ea6;margin:8px 0}
.hero p{color:#667085;line-height:1.5}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:15px;box-shadow:0 4px 20px #0001}
.info,.status{padding:12px;border-radius:10px;margin:12px 0;line-height:1.5}
.info{background:#f0f6ff}
.status{display:none}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
select,button{width:100%;padding:14px;margin-top:10px;border-radius:10px;font-size:16px}
select{border:1px solid #ddd;background:white}
button{border:0;background:#174ea6;color:white;font-weight:bold}
button:disabled{opacity:.5}
#questionCard{display:none}
.question{font-size:19px;font-weight:bold;margin-bottom:15px;line-height:1.5}
.option{background:white;color:#172033;border:2px solid #ddd;text-align:left}
.correct{background:#dcfce7!important;border-color:#16a34a!important}
.wrong{background:#fee2e2!important;border-color:#dc2626!important}
.loading{text-align:center;padding:15px;display:none}
</style>
</head>

<body>

<header>
<b>📚 CreateLK Academy</b>
<a href="index.html">🏠 Home</a>
</header>

<main>

<div class="hero">
<div class="icon">⭐</div>
<h1>Premium AI English MCQs</h1>
<p>Practise English with AI-generated MCQs.</p>
</div>

<div class="card">

<div id="membership" class="info">
⏳ Checking Premium membership...
</div>

<label>📚 Category</label>

<select id="category">
<option>Grammar</option>
<option>Tenses</option>
<option>Vocabulary</option>
<option>Spelling</option>
<option>Parts of Speech</option>
<option>Conversation</option>
<option>Reading Comprehension</option>
<option>Sentence Structure</option>
<option>Prepositions</option>
<option>Articles</option>
<option>Modal Verbs</option>
<option>Mixed English</option>
</select>

<label>🎓 Difficulty</label>

<select id="level">
<option>Beginner</option>
<option selected>Intermediate</option>
<option>Advanced</option>
</select>

<button id="generate" disabled>
⏳ Checking Premium...
</button>

<div id="loading" class="loading">
🤖 Premium AI is generating...
</div>

<div id="status" class="status"></div>

</div>


<div id="questionCard" class="card">

<div id="question" class="question"></div>

<div id="options"></div>

<div id="answer"></div>

<button id="next" style="display:none">
➡️ Next MCQ
</button>

</div>

</main>

<script>

const WORKER =
"https://premium-worker.gateofheavensl1.workers.dev";

let email = "";
let premium = false;


/* EMAIL */

function getEmail(){

return (
localStorage.getItem("createlk_student_email") ||
localStorage.getItem("studentEmail") ||
localStorage.getItem("email") ||
""
).trim().toLowerCase();

}


/* STATUS */

function status(text,type){

const box =
document.getElementById("status");

box.textContent = text;
box.className = "status " + type;

}


/* VERIFY */

async function verify(){

email = getEmail();

if(!email){

document.getElementById("membership").textContent =
"🔐 Please login first.";

status(
"Please login to use Premium.",
"error"
);

return;

}

try{

const r = await fetch(
WORKER +
"/api/verify-premium?email=" +
encodeURIComponent(email),
{cache:"no-store"}
);

const d = await r.json();

console.log(d);

if(
!r.ok ||
d.active !== true
){

document.getElementById("membership").textContent =
"🔒 Premium membership required.";

status(
d.message || "Premium is not active.",
"error"
);

return;

}

premium = true;

document.getElementById("membership").innerHTML =
"⭐ Premium Active<br>" +
email;

document.getElementById("generate").disabled =
false;

document.getElementById("generate").textContent =
"✨ Generate Premium MCQ";

status(
"✅ Premium access verified.",
"success"
);

}catch(e){

console.error(e);

status(
"❌ Could not connect to Premium Worker.",
"error"
);

}

}


/* GENERATE */

async function generate(){

if(!premium)return;

const button =
document.getElementById("generate");

button.disabled = true;

document.getElementById("loading").style.display =
"block";

document.getElementById("questionCard").style.display =
"none";

try{

const category =
document.getElementById("category").value;

const level =
document.getElementById("level").value;


const r = await fetch(
WORKER + "/api/ai-mcq",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

email:email,
category:category,
topic:category,
level:level,
type:"premium"

})
}
);


const d = await r.json();

console.log(d);


if(!r.ok || d.success === false){

throw new Error(
d.message ||
d.error ||
"AI generation failed."
);

}


let q =
d.mcq ||
d.question;


if(typeof q === "string"){

q = JSON.parse(
q.replace(/```json|```/g,"").trim()
);

}


show(q);

}catch(e){

console.error(e);

status(
"❌ " + e.message,
"error"
);

}finally{

document.getElementById("loading").style.display =
"none";

button.disabled = false;

}

}


/* SHOW */

function show(q){

document.getElementById("questionCard").style.display =
"block";

document.getElementById("question").textContent =
q.question;

const options =
document.getElementById("options");

options.innerHTML = "";

const answer =
String(
q.answer ||
q.correct_answer ||
q.correctAnswer ||
""
).trim().toUpperCase();


let opts = q.options;


if(Array.isArray(opts)){

const x = {};

opts.forEach(
(v,i)=>{
x[
String.fromCharCode(65+i)
] = v;
}
);

opts = x;

}


["A","B","C","D"].forEach(
letter=>{

const b =
document.createElement("button");

b.className = "option";

b.textContent =
letter + ". " +
opts[letter];

b.onclick = ()=>{

document
.querySelectorAll(".option")
.forEach(x=>{
x.disabled=true;
});

if(letter === answer){

b.classList.add("correct");

}else{

b.classList.add("wrong");

document
.querySelectorAll(".option")
.forEach(x=>{

if(
x.textContent.startsWith(answer+".")
){

x.classList.add("correct");

}

});

}

document.getElementById("answer").innerHTML =
"<br><b>Answer: " +
answer +
"</b><br>" +
(q.explanation || "");

document.getElementById("next").style.display =
"block";

};

options.appendChild(b);

});

}


/* BUTTONS */

document.getElementById("generate")
.addEventListener(
"click",
generate
);

document.getElementById("next")
.addEventListener(
"click",
generate
);


/* START */

verify();

</script>

</body>
</html>
