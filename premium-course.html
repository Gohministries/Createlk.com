<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Premium AI English MCQs</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f4f7fb;color:#172033;line-height:1.6}
header{background:#174ea6;color:white;padding:14px}
.nav{max-width:760px;margin:auto;display:flex;justify-content:space-between}
.logo{font-weight:800}.nav a,.logout{color:white;font-weight:700}
.logout{display:none;background:#ffffff18;border:1px solid #ffffff55;padding:7px 10px;border-radius:8px}
main{max-width:760px;margin:auto;padding:25px 15px}
.hero{text-align:center;margin-bottom:20px}.icon{font-size:50px}
h1{color:#174ea6}.hero p{color:#667085}
.card{background:white;padding:20px;border-radius:18px;margin-bottom:16px;box-shadow:0 5px 24px #0001}
.membership{padding:15px;border-radius:12px;margin-bottom:18px}
.active{background:#dcfce7;color:#166534}.locked{background:#fee2e2;color:#991b1b}
.email{font-size:13px;word-break:break-word}.countdown,.usage{font-weight:800}
.remaining{font-size:13px}.progress{height:9px;background:#e5e7eb;border-radius:10px;margin-top:7px}
.progress-bar{height:100%;width:0;background:#20a464}
label{display:block;font-weight:800;margin:12px 0 6px}
select{width:100%;padding:13px;border:1px solid #d5dbe5;border-radius:10px;font-size:16px}
button{font-size:16px;font-weight:800;cursor:pointer}
.generate,.next{width:100%;padding:14px;border:0;border-radius:10px;background:#174ea6;color:white}
.generate{margin-top:16px}.generate:disabled{opacity:.5}
.loading{text-align:center;padding:15px;display:none}
.status{padding:13px;border-radius:10px;margin-top:14px;font-weight:700}
.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}
.question-card{display:none}.question{font-size:20px;font-weight:800;margin-bottom:18px}
.option{width:100%;padding:14px;margin-bottom:10px;border:2px solid #ddd;border-radius:10px;background:white;text-align:left}
.correct{background:#dcfce7!important;border-color:#16a34a!important}
.wrong{background:#fee2e2!important;border-color:#dc2626!important}
.answer{margin-top:15px}.next{display:none;margin-top:15px}
footer{text-align:center;padding:25px;color:#667085;font-size:13px}
</style></head><body><header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<div>
<a href="index.html">🏠 Home</a>
<button id="logout" class="logout">🚪 Logout</button>
</div>
</div>
</header><main><section class="hero">
<div class="icon">⭐</div>
<h1>Premium AI English MCQs</h1>
<p>Practise English with up to <b>100 AI-generated MCQs every day.</b></p>
</section><section class="card"><div id="membership" class="membership">
⏳ Checking Premium membership...
</div><label>📚 Subject</label>
<select id="category">

<option>English Vocabulary</option>
<option>English Grammar</option>
<option>English Tenses</option>
<option>Parts of Speech</option>
<option>Prepositions</option>
<option>Articles</option>
<option>Sentence Structure</option>
<option>Spelling</option>
<option>Punctuation</option>
<option>Conversation English</option>
<option>Reading Comprehension</option>
<option>Mixed English</option>
</select><label>🎓 Difficulty</label>
<select id="level">

<option>Beginner</option>
<option selected>Intermediate</option>
<option>Advanced</option>
</select><button id="generate" class="generate" disabled>
⏳ Checking Premium...
</button><div id="loading" class="loading">🤖 Premium AI is generating...</div>
<div id="status"></div></section><section id="questionCard" class="card question-card">
<div id="question" class="question"></div>
<div id="options"></div>
<div id="answer" class="answer"></div>
<button id="next" class="next">➡️ Next MCQ</button>
</section></main><footer>
📚 <b>CreateLK Academy</b><br>
Learn English. Build Your Future.<br><br>
© 2026 CreateLK Academy.
</footer><script>
"use strict";

const AI="https://premium-worker.gateofheavensl1.workers.dev";
const MW="https://createlk-membership.gateofheavensl1.workers.dev";
const LIMIT=100;

const $=id=>document.getElementById(id);
const membership=$("membership");
const generateButton=$("generate");
const status=$("status");
const loading=$("loading");
const logout=$("logout");
const questionCard=$("questionCard");
const question=$("question");
const options=$("options");
const answer=$("answer");
const next=$("next");

let email="",premium=false,usage=0,timer;


/* EMAIL */

function getEmail(){
return (
localStorage.getItem("createlk_student_email") ||
localStorage.getItem("studentEmail") ||
localStorage.getItem("email") ||
""
).trim().toLowerCase();
}


/* MESSAGE */

function msg(t,c){
status.textContent=t;
status.className="status "+c;
}


/* LOGOUT */

logout.onclick=()=>{
[
"createlk_student_email",
"studentEmail",
"email",
"createlk_user",
"createlk_student"
].forEach(k=>localStorage.removeItem(k));
sessionStorage.clear();
location.href="index.html";
};


/* FIND DATA */

function find(d,keys){
if(!d||typeof d!="object")return null;

for(const k of keys)
if(d[k]!==undefined&&d[k]!==null&&d[k]!=="")return d[k];

for(const k in d)
if(typeof d[k]=="object"){
let x=find(d[k],keys);
if(x!==null)return x;
}
return null;
}


/* VERIFY */

async function verify(){

email=getEmail();
logout.style.display=email?"inline-block":"none";

if(!email){
locked("🔐 Please login to access Premium.");
return;
}

try{

let r=await fetch(
MW+"/status?email="+encodeURIComponent(email)+"&t="+Date.now(),
{cache:"no-store"}
);

let d=await r.json();

let st=String(find(d,[
"status",
"membership_status",
"subscription_status",
"payment_status",
"approval_status"
])||"").toLowerCase();

let active=
d.active===true ||
["active","approved","paid","confirmed","verified","premium"].includes(st) ||
find(d,["is_active","premium_active","payment_approved"])===true;

if(!active){
locked("🔒 Premium membership not found.");
return;
}

premium=true;
usage=Number(find(d,[
"usage","today_usage","daily_usage","usage_count"
])||0);

let expiry=find(d,[
"expires_at","expiresAt","expiry","expiry_date",
"expiryDate","valid_until","validUntil","end_date","endDate"
]);

let date=expiry?new Date(String(expiry).replace(" ","T")):null;

if(date&&!isNaN(date)&&date<=new Date()){
locked("🔒 Premium membership expired.");
return;
}

membership.className="membership active";
membership.innerHTML=
"<b>⭐ Premium Active</b>"+
`<div class="email">${email}</div>`+
(expiry?`<div>📅 Expires: ${date.toLocaleDateString()}</div>`:"")+
`<div class="countdown"></div>`+
`<div class="usage">📊 Today's AI Usage: ${usage} / ${LIMIT}</div>`+
`<div class="remaining">✨ Remaining today: ${Math.max(0,LIMIT-usage)}</div>`+
`<div class="progress"><div class="progress-bar"></div></div>`;

if(expiry)countdown(date);

if(usage>=LIMIT){
generateButton.disabled=true;
generateButton.textContent="🔒 Daily Limit Reached";
}else{
generateButton.disabled=false;
generateButton.textContent="✨ Generate Premium MCQ";
}

msg("✅ Premium access verified.","success");

}catch(e){
locked("⚠️ Unable to verify Premium membership.");
msg("❌ "+e.message,"error");
}
}


/* LOCKED */

function locked(t){
premium=false;
clearInterval(timer);
membership.className="membership locked";
membership.innerHTML="<b>"+t+"</b>";
generateButton.disabled=true;
generateButton.textContent="🔒 Premium Required";
}


/* COUNTDOWN */

function countdown(date){

function run(){

let s=Math.floor((date-Date.now())/1000);

if(s<=0){
locked("🔒 Premium membership expired.");
return;
}

let d=Math.floor(s/86400);s%=86400;
let h=Math.floor(s/3600);s%=3600;
let m=Math.floor(s/60);s%=60;

let box=membership.querySelector(".countdown");

if(box)
box.textContent=`⏳ Expires in: ${d}d ${h}h ${m}m ${s}s`;
}

run();
timer=setInterval(run,1000);
}


/* GENERATE */

generateButton.onclick=async()=>{

if(!premium){
await verify();
return;
}

if(usage>=LIMIT){
msg("🔒 Today's 100 MCQ limit has been reached.","error");
return;
}

generateButton.disabled=true;
loading.style.display="block";
questionCard.style.display="none";

try{

let r=await fetch(AI+"/api/ai-mcq",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email,
category:$("category").value,
topic:$("category").value,
level:$("level").value,
type:"premium"
})
});

let d=await r.json();

if(!r.ok||d.success!==true)
throw Error(d.error||d.message||"MCQ generation failed.");

let q=d.mcq||d.data||d.result||d;

if(typeof q==="string")q=JSON.parse(q);
if(typeof q.options==="string")q.options=JSON.parse(q.options);

usage=Number(
d.usage??d.today_usage??d.daily_usage??usage+1
);

show(q);

membership.querySelector(".usage").textContent=
`📊 Today's AI Usage: ${usage} / ${LIMIT}`;

membership.querySelector(".remaining").textContent=
`✨ Remaining today: ${Math.max(0,LIMIT-usage)}`;

generateButton.disabled=usage>=LIMIT;
generateButton.textContent=usage>=LIMIT?
"🔒 Daily Limit Reached":"✨ Generate Premium MCQ";

msg("✅ MCQ generated successfully.","success");

}catch(e){
generateButton.disabled=false;
generateButton.textContent="✨ Generate Premium MCQ";
msg("❌ "+e.message,"error");
}

loading.style.display="none";
};


/* SHOW MCQ */

function show(q){

questionCard.style.display="block";
question.textContent=q.question;
options.innerHTML="";
answer.innerHTML="";
next.style.display="none";

let correct=String(
q.answer||q.correct_answer||q.correctAnswer||""
).trim().toUpperCase();

["A","B","C","D"].forEach(letter=>{

let b=document.createElement("button");
b.className="option";
b.textContent=letter+". "+(q.options[letter]||"");

b.onclick=()=>{

document.querySelectorAll(".option")
.forEach(x=>x.disabled=true);

if(letter===correct){
b.classList.add("correct");
answer.innerHTML="🎉 <b>Correct!</b><br><br>"+(q.explanation||"Excellent work!");
}else{
b.classList.add("wrong");
document.querySelectorAll(".option").forEach(x=>{
if(x.textContent.startsWith(correct+"."))x.classList.add("correct");
});
answer.innerHTML="❌ <b>Incorrect.</b><br><br>Correct answer: <b>"+correct+"</b><br><br>"+(q.explanation||"Review the explanation.");
}

if(premium&&usage<LIMIT)next.style.display="block";
};

options.appendChild(b);
});

questionCard.scrollIntoView({behavior:"smooth"});
}

next.onclick=()=>generateButton.click();

verify();

document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible")verify();
});
</script></body>
</html>
