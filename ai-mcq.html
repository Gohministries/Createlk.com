<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI MCQ Generator | CreateLK Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,"Segoe UI",sans-serif}
body{background:#f5f8ff;color:#172033;min-height:100vh}
header{background:#174ea6;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5}
.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:19px;font-weight:800}
.home{color:#fff;text-decoration:none;font-weight:700;font-size:14px}
main{max-width:900px;margin:auto;padding:25px 15px 50px}
.hero{text-align:center;margin:10px 0 22px}
.hero h1{color:#174ea6;font-size:29px;margin-bottom:7px}
.hero p{color:#667085;font-size:14px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 6px 25px #0001}
.usage{background:#eef4ff;color:#174ea6;padding:13px;border-radius:12px;text-align:center;font-weight:700;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr 100px;gap:10px}
select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-size:14px}
label{display:block;font-size:12px;font-weight:700;color:#667085;margin-bottom:5px}
button{border:0;border-radius:11px;background:#174ea6;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}
.generate{width:100%;margin-top:15px;font-size:15px}
button:disabled{opacity:.55}
#results{margin-top:20px}
.q{background:#f8faff;border:1px solid #e4e7ec;border-radius:15px;padding:17px;margin-bottom:14px}
.q h3{font-size:16px;line-height:1.5;margin-bottom:12px}
.option{display:block;width:100%;text-align:left;background:#fff;color:#172033;border:1px solid #d0d5dd;margin:7px 0}
.option:hover{background:#eef4ff}
.correct{background:#e8f7ed!important;border-color:#20a464!important;color:#176b35!important}
.wrong{background:#fef3f2!important;border-color:#f04438!important;color:#b42318!important}
.answer{margin-top:10px;padding:11px;border-radius:9px;background:#eef4ff;font-size:13px;line-height:1.5}
.message{text-align:center;margin-top:15px;color:#667085;font-size:14px}
footer{text-align:center;color:#667085;font-size:13px;padding:20px;line-height:1.6}
@media(max-width:600px){.row{grid-template-columns:1fr 1fr}.row div:last-child{grid-column:1/-1}.hero h1{font-size:25px}}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">📚 CreateLK Academy</div>
<a class="home" href="index.html">🏠 Home</a>
</div>
</header>

<main>

<section class="hero">
<h1>🤖 AI MCQ Generator</h1>
<p>Generate personalised English practice questions with AI.</p>
</section>

<div class="card">

<div class="usage" id="usage">
⏳ Checking today's AI usage...
</div>

<div class="row">

<div>
<label>Category</label>
<select id="category">
<option>Grammar</option>
<option>Vocabulary</option>
<option>Conversation</option>
<option>Pronunciation</option>
<option>Writing</option>
<option>Business English</option>
<option>Advanced English</option>
</select>
</div>

<div>
<label>Difficulty</label>
<select id="difficulty">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
</select>
</div>

<div>
<label>Questions</label>
<select id="count">
<option value="1">1</option>
<option value="3">3</option>
<option value="5" selected>5</option>
<option value="10">10</option>
</select>
</div>

</div>

<button class="generate" id="generate">
🤖 Generate MCQs
</button>

<div id="message" class="message"></div>
<div id="results"></div>

</div>
</main>

<footer>
📚 CreateLK Academy<br>
Learn English. Build Your Future.<br><br>
© 2026 CreateLK Academy. All Rights Reserved.
</footer>

<script>
"use strict";

const API="https://ai-mcq.gateofheavensl1.workers.dev";

const usage=document.getElementById("usage");
const generate=document.getElementById("generate");
const results=document.getElementById("results");
const message=document.getElementById("message");

let student=null;

try{
 student=JSON.parse(
  localStorage.getItem("createlk_student")||"null"
 );
}catch(e){}

let userKey;

if(student&&student.email){
 userKey="student:"+student.email.toLowerCase();
}else{
 let id=localStorage.getItem("createlk_ai_mcq_device");
 if(!id){
  id=crypto.randomUUID?
   crypto.randomUUID():
   "mcq-"+Date.now()+"-"+Math.random().toString(36).slice(2);
  localStorage.setItem("createlk_ai_mcq_device",id);
 }
 userKey="device:"+id;
}

async function loadUsage(){

 try{

  const r=await fetch(
   API+"/usage?user_key="+
   encodeURIComponent(userKey)
  );

  const d=await r.json();

  const used=Number(d.used)||0;
  const max=Number(d.limit)||10;

  usage.textContent=
   "🌱 AI MCQs today: "+
   used+" / "+max+
   " used • "+
   Math.max(0,max-used)+
   " remaining";

  if(used>=max){
   generate.disabled=true;
   usage.textContent=
    "⏳ Today's AI MCQ limit has been reached.";
  }

 }catch(e){
  usage.textContent="🌱 AI MCQ Generator";
 }
}

function showQuestion(q,index){

 const box=document.createElement("div");
 box.className="q";

 const title=document.createElement("h3");
 title.textContent=
  (index+1)+". "+q.question;

 box.appendChild(title);

 ["A","B","C","D"].forEach(letter=>{

  const key="option_"+letter.toLowerCase();

  const btn=document.createElement("button");
  btn.className="option";
  btn.textContent=
   letter+") "+(q[key]||"");

  btn.onclick=()=>{

   if(box.dataset.done)return;

   box.dataset.done="1";

   const correct=
    String(q.correct_answer||"")
    .toUpperCase();

   if(letter===correct){
    btn.classList.add("correct");
   }else{
    btn.classList.add("wrong");

    [...box.querySelectorAll(".option")]
    .forEach(b=>{
     if(b.textContent.startsWith(correct+")"))
      b.classList.add("correct");
    });
   }

   const answer=document.createElement("div");
   answer.className="answer";
   answer.textContent=
    "✅ Correct answer: "+correct+
    "\n\n"+(q.explanation||"");

   box.appendChild(answer);
  };

  box.appendChild(btn);
 });

 results.appendChild(box);
}

async function generateMCQs(){

 results.innerHTML="";
 message.textContent="";

 const category=
  document.getElementById("category").value;

 const difficulty=
  document.getElementById("difficulty").value;

 const count=
  Number(document.getElementById("count").value);

 generate.disabled=true;
 generate.textContent="⏳ Generating...";

 try{

  const r=await fetch(API+"/generate",{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    user_key:userKey,
    category,
    difficulty,
    count
   })
  });

  const d=await r.json();

  if(!r.ok||d.success===false){

   throw new Error(
    d.message||"MCQ generation failed."
   );
  }

  if(!Array.isArray(d.questions)){
   throw new Error("No questions received.");
  }

  d.questions.forEach(showQuestion);

  usage.textContent=
   "🌱 AI MCQs today: "+
   d.used+" / "+d.limit+
   " used • "+
   d.remaining+" remaining";

  if(d.remaining<=0){
   generate.disabled=true;
  }else{
   generate.disabled=false;
  }

 }catch(e){

  message.textContent="❌ "+e.message;
  generate.disabled=false;

 }finally{

  generate.textContent="🤖 Generate MCQs";
 }
}

generate.onclick=generateMCQs;

loadUsage();
</script>

</body>
</html>
