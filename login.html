<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Login | CreateLK Academy</title><meta name="description"
content="Sign in to your CreateLK Academy student account.">

<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


/* ================================
   PAGE
================================ */

body{
    min-height:100vh;
    background:#f4f7fc;
    color:#263238;
    display:flex;
    flex-direction:column;
}


/* ================================
   NAVIGATION
================================ */

nav{
    background:#fff;
    padding:16px 6%;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#1565c0;
}


/* ================================
   MAIN
================================ */

.container{
    width:100%;
    max-width:500px;
    margin:0 auto;
    padding:40px 20px;
    flex:1;
    display:flex;
    align-items:center;
}


/* ================================
   CARD
================================ */

.card{
    width:100%;
    background:#fff;
    padding:32px;
    border-radius:20px;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
    border:1px solid #edf0f5;
}


/* ================================
   HEADINGS
================================ */

h1{
    text-align:center;
    color:#1565c0;
    margin-bottom:8px;
    font-size:30px;
    line-height:1.25;
}

.subtitle{
    text-align:center;
    color:#68757c;
    margin-bottom:28px;
    line-height:1.6;
}


/* ================================
   FORM
================================ */

form{
    width:100%;
}

label{
    display:block;
    font-weight:600;
    margin:18px 0 7px;
    line-height:1.4;
}


/* ================================
   INPUTS
================================ */

input{
    display:block;
    width:100%;
    height:48px;
    padding:12px 14px;
    border:1px solid #ccd5dc;
    border-radius:10px;
    font-size:15px;
    outline:none;
    background:#fff;
    color:#263238;
}

input:focus{
    border-color:#1565c0;
    box-shadow:0 0 0 3px rgba(21,101,192,.08);
}


/* ================================
   PASSWORD
================================ */

.password-wrap{
    position:relative;
    width:100%;
}

.password-wrap input{
    padding-right:82px;
}

.show-password{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    height:34px;
    min-width:52px;
    padding:5px 8px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#1565c0;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    z-index:2;
}

.show-password:hover{
    background:#e3f2fd;
    color:#0d47a1;
}


/* ================================
   LOGIN BUTTON
================================ */

.login-button{
    display:block;
    width:100%;
    height:48px;
    margin-top:24px;
    padding:12px 16px;
    border:0;
    border-radius:28px;
    background:#1565c0;
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.login-button:hover{
    background:#0d47a1;
}

.login-button:disabled{
    background:#9eabb3;
    cursor:not-allowed;
}


/* ================================
   MESSAGE
================================ */

.message{
    width:100%;
    min-height:22px;
    margin-top:16px;
    text-align:center;
    font-weight:600;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}


/* ================================
   ACCOUNT BOX
================================ */

.account-box{
    width:100%;
    margin-top:16px;
    padding:15px;
    background:#e3f2fd;
    border-radius:12px;
    display:none;
    line-height:1.6;
    font-size:14px;
    word-break:break-word;
}

.account-box strong{
    color:#1565c0;
}


/* ================================
   LINKS
================================ */

.links{
    width:100%;
    text-align:center;
    margin-top:26px;
}

.links a{
    display:block;
    margin-top:12px;
    color:#1565c0;
    text-decoration:none;
    font-weight:600;
    line-height:1.5;
}

.links a:hover{
    text-decoration:underline;
}


/* ================================
   SECURITY
================================ */

.security{
    width:100%;
    margin-top:26px;
    padding:16px;
    background:#f8fafc;
    border-radius:12px;
    text-align:center;
    font-size:13px;
    color:#68757c;
    line-height:1.6;
}


/* ================================
   FOOTER
================================ */

footer{
    background:#111827;
    color:#9ca3af;
    text-align:center;
    padding:25px 20px;
}

footer strong{
    color:#fff;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    nav{
        padding:15px 20px;
    }

    .logo{
        font-size:20px;
    }

    .container{
        padding:25px 15px;
        align-items:flex-start;
    }

    .card{
        padding:25px 20px;
        border-radius:16px;
    }

    h1{
        font-size:27px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:24px;
    }

    label{
        margin-top:16px;
    }

    input{
        height:48px;
        font-size:16px;
    }

    .login-button{
        height:50px;
    }
}


/* ================================
   VERY SMALL SCREENS
================================ */

@media(max-width:360px){

    .card{
        padding:22px 16px;
    }

    .logo{
        font-size:18px;
    }

    h1{
        font-size:24px;
    }

    .show-password{
        right:6px;
    }
}

</style></head><body><nav>
    <div class="logo">
        📚 CreateLK Academy
    </div>
</nav><main class="container"><div class="card">

    <h1>
        Student Login
    </h1>

    <p class="subtitle">
        Sign in to access your CreateLK Academy account.
    </p>


    <form id="loginForm">

        <!-- EMAIL -->

        <label for="email">
            Email Address
        </label>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <div class="password-wrap">

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-password"
                id="showPassword"
                aria-label="Show or hide password"
            >
                Show
            </button>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            id="loginButton"
            class="login-button"
            type="submit"
        >
            Login
        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
            aria-live="polite"
        ></div>


        <!-- ACCOUNT INFORMATION -->

        <div
            id="accountBox"
            class="account-box"
        ></div>

    </form>


    <!-- LINKS -->

    <div class="links">

        <a href="register.html">
            Create an account
        </a>

        <a href="forgot-password.html">
            Forgot your password?
        </a>

        <a href="index.html">
            ← Back to Academy
        </a>

    </div>


    <!-- SECURITY -->

    <div class="security">
        🔐 Your login will be securely verified by
        the CreateLK Academy server.
    </div>

</div>

</main><footer><p>
    <strong>
        📚 CreateLK Academy
    </strong>
</p>

<p style="margin-top:8px;">
    © 2026 CreateLK Academy. All Rights Reserved.
</p>

</footer><script>

/*
==================================================
CREATE LK ACADEMY — STUDENT LOGIN
==================================================
*/

const API =
"https://flat-queen-4e0b.gateofheavensl1.workers.dev";


const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const password =
document.getElementById("password");

const showPassword =
document.getElementById("showPassword");

const accountBox =
document.getElementById("accountBox");


/*
==================================================
SHOW / HIDE PASSWORD
==================================================
*/

showPassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";
            showPassword.textContent = "Hide";

        }else{

            password.type = "password";
            showPassword.textContent = "Show";

        }

    }
);


/*
==================================================
LOGIN
==================================================
*/

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


        const passwordValue =
        password.value;


        if(!email || !passwordValue){

            message.textContent =
            "Please enter your email and password.";

            message.style.color =
            "#c62828";

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
        "Signing in...";

        message.textContent =
        "Verifying your account...";

        message.style.color =
        "#1565c0";

        accountBox.style.display =
        "none";


        try{

            const response =
            await fetch(
                API + "/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        email:email,

                        password:passwordValue

                    })
                }
            );


            let data;


            try{

                data =
                await response.json();

            }catch{

                throw new Error(
                    "Invalid response from the server."
                );

            }


            /*
            ==========================================
            LOGIN ERROR
            ==========================================
            */

            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Invalid email or password."
                );

            }


            /*
            ==========================================
            SAVE LOGIN INFORMATION
            ==========================================
            */

            const student =
            data.student;

            const premium =
            data.premium;


            /*
            Never store the password.
            */

            sessionStorage.setItem(
                "createLK_student",
                JSON.stringify(student)
            );


            sessionStorage.setItem(
                "createLK_premium",
                JSON.stringify(premium)
            );


            /*
            ==========================================
            SUCCESS
            ==========================================
            */

            message.textContent =
            "Login successful!";

            message.style.color =
            "#00897b";


            if(student){

                accountBox.innerHTML =
                `
                    <strong>
                        Welcome,
                        ${escapeHtml(student.first_name)}!
                    </strong>

                    <br>

                    Your account has been verified.
                `;

                accountBox.style.display =
                "block";

            }


            /*
            ==========================================
            REDIRECT
            ==========================================
            */

            setTimeout(
                function(){

                    window.location.href =
                    "index.html";

                },
                1000
            );

        }
        catch(error){

            console.error(
                "Login error:",
                error
            );


            message.textContent =
            error.message ||
            "Unable to login.";

            message.style.color =
            "#c62828";


            loginButton.disabled =
            false;

            loginButton.textContent =
            "Login";

        }

    }
);


/*
==================================================
SAFE HTML TEXT
==================================================
*/

function escapeHtml(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script></body>
</html>
