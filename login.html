<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Login | CreateLK Academy</title><meta name="description"
content="Login to your CreateLK Academy student account.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#ffffff;
    padding:35px 28px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    color:#174ea6;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:28px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:600;
    color:#333;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d5d9e0;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#174ea6;
    box-shadow:0 0 0 3px rgba(23,78,166,.10);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:70px;
}

.show-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#174ea6;
    font-weight:600;
    cursor:pointer;
}

.login-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#174ea6;
    color:#ffffff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:5px;
}

.login-button:hover{
    background:#123d82;
}

.login-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:18px;
    text-align:center;
    font-size:14px;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.error{
    background:#fdeaea;
    color:#a32121;
}

.register-link{
    text-align:center;
    margin-top:22px;
    color:#666;
}

.register-link a{
    color:#174ea6;
    font-weight:700;
    text-decoration:none;
}

.student-box{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#f3f7ff;
}

.student-box h3{
    color:#174ea6;
    margin-bottom:10px;
}

.student-box p{
    margin:6px 0;
    color:#444;
}

.logout-button{
    margin-top:14px;
    width:100%;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#555;
    color:#fff;
    cursor:pointer;
}

</style></head><body><div class="container"><div class="card"><div class="logo">
📚 CreateLK Academy
</div><div class="subtitle">
Student Login
</div><div id="message"
class="message">
</div><form id="loginForm"><div class="field"><label for="email">
Email Address
</label><input
type="email"
id="email"
placeholder="you@example.com"
autocomplete="email"
required>

</div><div class="field"><label for="password">
Password
</label><div class="password-box"><input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
class="show-btn"
onclick="togglePassword()">

Show

</button></div></div><button
type="submit"
class="login-button"
id="loginButton">

Login

</button></form><div id="studentBox"
class="student-box"><h3>
Welcome! 👋
</h3><p>
<strong>Name:</strong>
<span id="studentName"></span>
</p><p>
<strong>Email:</strong>
<span id="studentEmail"></span>
</p><p>
<strong>WhatsApp:</strong>
<span id="studentPhone"></span>
</p><p>
<strong>Student ID:</strong>
<span id="studentId"></span>
</p><button
class="logout-button"
onclick="logout()">

Logout

</button></div><div class="register-link">Don't have an account?

<a href="register.html">
Create Account
</a></div></div></div><script>

/* ==========================================
   CLOUDFLARE WORKER API
========================================== */

const API_URL =
"https://shy-fog-1588.gateofheavensl1.workers.dev";


/* ==========================================
   ELEMENTS
========================================== */

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginButton");

const studentBox =
document.getElementById("studentBox");


/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

function togglePassword(){

    const input =
        document.getElementById("password");

    const button =
        document.querySelector(".show-btn");

    if(input.type === "password"){

        input.type = "text";

        button.textContent =
            "Hide";

    }else{

        input.type = "password";

        button.textContent =
            "Show";

    }

}


/* ==========================================
   LOGIN
========================================== */

form.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    message.style.display =
        "none";


    const email =
        document.getElementById(
            "email"
        ).value.trim().toLowerCase();


    const password =
        document.getElementById(
            "password"
        ).value;


    if(!email || !password){

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Logging in...";


    try{

        const response =
            await fetch(
                API_URL + "/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        email:email,

                        password:password

                    })

                }
            );


        const data =
            await response.json();


        if(response.ok && data.success){

            showMessage(
                "Login successful!",
                "success"
            );


            /* --------------------------------
               SAVE STUDENT INFORMATION
            -------------------------------- */

            localStorage.setItem(
                "createlk_student",
                JSON.stringify(
                    data.student
                )
            );


            /* --------------------------------
               DISPLAY STUDENT
            -------------------------------- */

            document.getElementById(
                "studentName"
            ).textContent =
                data.student.first_name +
                " " +
                data.student.last_name;


            document.getElementById(
                "studentEmail"
            ).textContent =
                data.student.email;


            document.getElementById(
                "studentPhone"
            ).textContent =
                data.student.phone ||
                "Not provided";


            document.getElementById(
                "studentId"
            ).textContent =
                data.student.id;


            form.style.display =
                "none";


            studentBox.style.display =
                "block";


        }else{

            showMessage(
                data.message ||
                "Invalid email or password.",
                "error"
            );

        }


    }catch(error){

        console.error(error);

        showMessage(
            "Unable to connect to the server. Please check your internet connection.",
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "Login";

});


/* ==========================================
   CHECK EXISTING LOGIN
========================================== */

window.addEventListener(
"DOMContentLoaded",
function(){

    const saved =
        localStorage.getItem(
            "createlk_student"
        );


    if(!saved){
        return;
    }


    try{

        const student =
            JSON.parse(saved);


        document.getElementById(
            "studentName"
        ).textContent =
            student.first_name +
            " " +
            student.last_name;


        document.getElementById(
            "studentEmail"
        ).textContent =
            student.email;


        document.getElementById(
            "studentPhone"
        ).textContent =
            student.phone ||
            "Not provided";


        document.getElementById(
            "studentId"
        ).textContent =
            student.id;


        form.style.display =
            "none";


        studentBox.style.display =
            "block";


    }catch(error){

        localStorage.removeItem(
            "createlk_student"
        );

    }

});


/* ==========================================
   LOGOUT
========================================== */

function logout(){

    localStorage.removeItem(
        "createlk_student"
    );

    location.reload();

}

</script></body></html>
