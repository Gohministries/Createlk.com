<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Login | CreateLK Academy</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{background:linear-gradient(135deg,#eef4ff,#f4f7fc);min-height:100vh;color:#263238}
nav{background:#fff;padding:16px 6%;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.logo{font-size:22px;font-weight:800;color:#1565c0}
.container{max-width:450px;margin:70px auto;padding:20px}
.card{background:#fff;padding:35px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{text-align:center;color:#1565c0;margin-bottom:8px}
.subtitle{text-align:center;color:#68757c;margin-bottom:25px}
label{display:block;font-weight:600;margin:15px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccd5dc;border-radius:10px;font-size:15px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:25px;background:#1565c0;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.links{text-align:center;margin-top:20px}
.links a{color:#1565c0;text-decoration:none;font-weight:600}
.message{text-align:center;margin-top:15px;font-size:14px;font-weight:600}
</style></head><body><nav>
<div class="logo">📚 CreateLK Academy</div>
</nav><main class="container"><div class="card"><h1>Student Login</h1><p class="subtitle">
Login to access your CreateLK Academy account.
</p><form id="loginForm"><label for="email">Email Address</label>
<input id="email" type="email" placeholder="Your registered email" required>

<label for="password">Password</label>
<input id="password" type="password" placeholder="Your password" required>

<button type="submit">Login</button>

</form><div id="message" class="message"></div><div class="links">
Don't have an account?
<a href="register.html">Create Account</a>
</div><div class="links">
<a href="index.html">← Back to Academy</a>
</div></div></main><script>
document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const message=document.getElementById("message");

message.textContent=
"Login system is ready to be connected to your Cloudflare backend.";

message.style.color="#1565c0";

});
</script></body>
</html>
