<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Login | CreateLK Academy</title>

<meta name="description"
content="Sign in to your CreateLK Academy student account.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
min-height:100vh;
background:#f4f7fc;
color:#263238;
display:flex;
flex-direction:column;
}

nav{
background:#fff;
padding:16px 6%;
box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.logo{
font-size:23px;
font-weight:800;
color:#1565c0;
}

.container{
width:100%;
max-width:500px;
margin:auto;
padding:30px 20px;
}

.card{
background:#fff;
padding:32px;
border-radius:20px;
box-shadow:0 8px 28px rgba(0,0,0,.08);
border:1px solid #edf0f5;
}

h1{
text-align:center;
color:#1565c0;
margin-bottom:8px;
font-size:30px;
}

.subtitle{
text-align:center;
color:#68757c;
margin-bottom:25px;
}

label{
display:block;
font-weight:600;
margin:16px 0 6px;
}

input{
width:100%;
padding:14px;
border:1px solid #ccd5dc;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#1565c0;
}

.login-button{
width:100%;
margin-top:22px;
padding:14px;
border:0;
border-radius:28px;
background:#1565c0;
color:#fff;
font-size:16px;
font-weight:800;
cursor:pointer;
}

.login-button:hover{
background:#0d47a1;
}

.login-button:disabled{
background:#9eabb3;
cursor:not-allowed;
}

.message{
text-align:center;
margin-top:16px;
font-weight:600;
font-size:14px;
}

.links{
text-align:center;
margin-top:22px;
}

.links a{
display:block;
margin-top:10px;
color:#1565c0;
text-decoration:none;
font-weight:600;
}

.links a:hover{
text-decoration:underline;
}

.security{
margin-top:25px;
padding:16px;
background:#f8fafc;
border-radius:12px;
text-align:center;
font-size:13px;
color:#68757c;
}

footer{
margin-top:auto;
background:#111827;
color:#9ca3af;
text-align:center;
padding:25px 20px;
}

footer strong{
color:#fff;
}

@media(max-width:600px){

.card{
padding:24px 20px;
}

h1{
font-size:27px;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">
📚 CreateLK Academy
</div>

</nav>


<main class="container">

<div class="card">

<h1>
Student Login
</h1>

<p class="subtitle">
Sign in to access your CreateLK Academy account.
</p>


<form id="loginForm">


<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required
>


<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required
>


<button
id="loginButton"
class="login-button"
type="submit"
>

Login

</button>


<div
id="message"
class="message">
</div>

</form>


<div class="links">

<a href="register.html">
Create an account
</a>

<a href="forgot-password.html">
Forgot your password?
</a>

<a href="index.html">
← Back to Academy
</a>

</div>


<div class="security">

🔐 Your login will be securely verified by
the CreateLK Academy server.

</div>

</div>

</main>


<footer>

<p>
<strong>
📚 CreateLK Academy
</strong>
</p>

<p style="margin-top:8px;">
© 2026 CreateLK Academy. All Rights Reserved.
</p>

</footer>


<script>

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");


loginForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();


const password =
document
.getElementById("password")
.value;


if(
!email ||
!password
){

message.textContent =
"Please enter your email and password.";

message.style.color =
"#c62828";

return;

}


loginButton.disabled =
true;

loginButton.textContent =
"Signing in...";

message.textContent =
"Verifying your account...";

message.style.color =
"#1565c0";


try{


const response =
await fetch(
"https://snowy-flower-6197.gateofheavensl1.workers.dev/login",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:email,

password:password

})

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Login failed."
);

}


/*
========================================
SUCCESSFUL LOGIN
========================================
*/

message.textContent =
"Login successful. Opening payment...";

message.style.color =
"#00897b";


setTimeout(
function(){

window.location.href =
"payment.html";

},
700
);


}
catch(error){

console.error(error);

message.textContent =
error.message ||
"Unable to login.";

message.style.color =
"#c62828";

loginButton.disabled =
false;

loginButton.textContent =
"Login";

}

});

</script>

</body>

</html>
