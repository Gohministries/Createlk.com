</style></head><body><nav><div class="logo">
📚 CreateLK Academy
</div></nav><main class="container"><div class="card"><h1>
Student Login
</h1><p class="subtitle">
Sign in to access your CreateLK Academy account.
</p><form id="loginForm"><label for="email">
Email Address
</label><input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required

<label for="password">
Password
</label><div class="password-wrap"><input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required

«»

<button
type="button"
class="show-password"
id="showPassword"

«»

Show
</button>

</div><button
id="loginButton"
class="login-button"
type="submit"

«»

Login
</button>

<div
id="message"
class="message">
</div><div
id="accountBox"
class="account-box">
</div></form><div class="links"><a href="register.html">
Create an account
</a><a href="forgot-password.html">

</a></div><div class="security">🔐 Your login will be securely verified by

</div></div></main><footer><p>
<strong>
📚 CreateLK Academy
</strong>
</p><p style="margin-top:8px;">
© 2026 CreateLK Academy. All Rights Reserved.
</p></footer><script>

/*
==================================================
CREATE LK ACADEMY — STUDENT LOGIN
==================================================
*/

/*
NEW STUDENT API
*/

const API =
"https://flat-queen-4e0b.gateofheavensl1.workers.dev";


const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const password =
document.getElementById("password");

const showPassword =
document.getElementById("showPassword");

const accountBox =
document.getElementById("accountBox");


/*
==================================================
SHOW / HIDE PASSWORD
==================================================
*/

showPassword.addEventListener(
"click",
function(){

if(
password.type === "password"
){

password.type = "text";

showPassword.textContent =
"Hide";

}else{

password.type = "password";

showPassword.textContent =
"Show";

}

});


/*
==================================================
LOGIN
==================================================
*/

loginForm.addEventListener(
"submit",
async function(event){

event.preventDefault();

const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();

const passwordValue =
password.value;

if(
!email ||
!passwordValue
){

message.textContent =
"Please enter your email and password.";

message.style.color =
"#c62828";

return;

}

loginButton.disabled =
true;

loginButton.textContent =
"Signing in...";

message.textContent =
"Verifying your account...";

message.style.color =
"#1565c0";

accountBox.style.display =
"none";


try{

const response =
await fetch(
API + "/login",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:email,

password:passwordValue

})

}
);


let data;

try{

data =
await response.json();

}catch{

throw new Error(
"Invalid response from the server."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Invalid email or password."
);

}


/*
==================================================
SAVE LOGIN INFORMATION
==================================================
*/

const student =
data.student;

const premium =
data.premium;


/*
Never store the password.
*/

sessionStorage.setItem(
"createLK_student",
JSON.stringify(
student
)
);

sessionStorage.setItem(
"createLK_premium",
JSON.stringify(
premium
)
);


/*
==================================================
SUCCESS
==================================================
*/

message.textContent =
"Login successful!";

message.style.color =
"#00897b";


if(student){

accountBox.innerHTML =
`
<strong>
Welcome, ${escapeHtml(student.first_name)}!
</strong>
<br>
Your account has been verified.
`;

accountBox.style.display =
"block";

}


/*
==================================================
REDIRECT
==================================================
*/

setTimeout(
function(){

window.location.href =
"index.html";

},
1000
);


}
catch(error){

console.error(
"Login error:",
error
);

message.textContent =
error.message ||
"Unable to login.";

message.style.color =
"#c62828";

loginButton.disabled =
false;

loginButton.textContent =
"Login";

}

});


/*
==================================================
SAFE HTML TEXT
==================================================
*/

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script></body></html>
