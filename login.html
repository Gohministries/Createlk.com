<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Login | CreateLK Academy</title>

<meta name="description"
      content="Login to your CreateLK Academy student account.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #eef4ff,
        #ffffff
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#fff;
    padding:35px 28px;
    border-radius:20px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:800;
    color:#174ea6;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:6px 0 28px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;

    border:1px solid #d5d9e0;
    border-radius:10px;

    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#174ea6;

    box-shadow:
        0 0 0 3px
        rgba(23,78,166,.10);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show{
    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    border:0;
    background:none;

    color:#174ea6;

    font-weight:600;
    cursor:pointer;
}

.login-button{
    width:100%;

    padding:14px;

    border:0;
    border-radius:11px;

    background:#174ea6;
    color:#fff;

    font-size:16px;
    font-weight:700;

    cursor:pointer;
}

.login-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;

    padding:12px;

    border-radius:9px;

    margin-bottom:18px;

    text-align:center;

    font-size:14px;
    line-height:1.5;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.error{
    background:#fdeaea;
    color:#a32121;
}

.loading{
    display:none;

    text-align:center;

    color:#174ea6;

    font-weight:600;

    margin-top:15px;
}

.register-link{
    text-align:center;

    margin-top:22px;

    color:#666;
}

.register-link a{
    color:#174ea6;

    font-weight:700;

    text-decoration:none;
}

.home-link{
    text-align:center;

    margin-top:15px;
}

.home-link a{
    color:#68757c;

    text-decoration:none;

    font-size:14px;
}

@media(max-width:500px){

    .card{
        padding:28px 20px;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<div class="logo">
📚 CreateLK Academy
</div>


<div class="subtitle">
Student Login
</div>


<div
id="message"
class="message">
</div>


<form id="loginForm">


<div class="field">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="you@example.com"
autocomplete="email"
required>

</div>



<div class="field">

<label for="password">
Password
</label>


<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required>


<button
type="button"
class="show"
id="showPassword">

Show

</button>

</div>

</div>



<button
type="submit"
class="login-button"
id="loginButton">

Login

</button>

</form>



<div
id="loading"
class="loading">

Opening your dashboard...

</div>



<div class="register-link">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>



<div class="home-link">

<a href="index.html">
← Back to CreateLK Academy
</a>

</div>


</div>

</div>



<script>

"use strict";


/* ==========================================
   LOGIN WORKER
========================================== */

const API_URL =
"https://shy-fog-1588.gateofheavensl1.workers.dev";


/* ==========================================
   ELEMENTS
========================================== */

const form =
document.getElementById(
    "loginForm"
);

const message =
document.getElementById(
    "message"
);

const button =
document.getElementById(
    "loginButton"
);

const loading =
document.getElementById(
    "loading"
);

const password =
document.getElementById(
    "password"
);

const showPassword =
document.getElementById(
    "showPassword"
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* ==========================================
   LOADING
========================================== */

function setLoading(
    state
){

    button.disabled =
        state;

    button.textContent =
        state
        ? "Logging in..."
        : "Login";

}


/* ==========================================
   PASSWORD SHOW/HIDE
========================================== */

showPassword.addEventListener(
    "click",
    function(){

        if(
            password.type ===
            "password"
        ){

            password.type =
                "text";

            showPassword.textContent =
                "Hide";

        }
        else{

            password.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);


/* ==========================================
   CHECK EXISTING LOGIN
========================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const saved =
            localStorage.getItem(
                "createlk_student"
            );

        if(!saved){

            return;

        }


        try{

            const student =
                JSON.parse(
                    saved
                );

            if(
                student &&
                student.id
            ){

                window.location.replace(
                    "dashboard.html"
                );

            }

        }
        catch(error){

            localStorage.removeItem(
                "createlk_student"
            );

        }

    }
);


/* ==========================================
   LOGIN
========================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        message.style.display =
            "none";


        const email =
            document
            .getElementById(
                "email"
            )
            .value
            .trim()
            .toLowerCase();


        const passwordValue =
            password.value;


        if(
            !email ||
            !passwordValue
        ){

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        setLoading(true);


        try{

            const response =
                await fetch(
                    API_URL +
                    "/login",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                passwordValue

                        })
                    }
                );


            /*
            ==================================
            READ SERVER RESPONSE
            ==================================
            */

            const responseText =
                await response.text();


            let data = {};

            try{

                data =
                    JSON.parse(
                        responseText
                    );

            }
            catch(error){

                /*
                Server returned HTML/plain text
                instead of JSON.
                */

                if(
                    responseText
                ){

                    data = {
                        success:false,
                        message:
                            responseText
                    };

                }

            }


            /*
            ==================================
            SERVER ERROR
            ==================================
            */

            if(
                !response.ok
            ){

                showMessage(
                    data.message ||
                    (
                        "Login server returned HTTP " +
                        response.status
                    ),
                    "error"
                );

                setLoading(false);

                return;

            }


            /*
            ==================================
            LOGIN FAILED
            ==================================
            */

            if(
                !data.success
            ){

                showMessage(
                    data.message ||
                    "Invalid email or password.",
                    "error"
                );

                setLoading(false);

                return;

            }


            /*
            ==================================
            STUDENT DATA CHECK
            ==================================
            */

            if(
                !data.student ||
                !data.student.id
            ){

                showMessage(
                    "Login server did not return valid student information.",
                    "error"
                );

                setLoading(false);

                return;

            }


            /*
            ==================================
            SAVE STUDENT
            ==================================
            */

            localStorage.setItem(
                "createlk_student",
                JSON.stringify(
                    data.student
                )
            );


            /*
            ==================================
            SUCCESS
            ==================================
            */

            showMessage(
                "Login successful!",
                "success"
            );


            loading.style.display =
                "block";

            form.style.display =
                "none";


            setTimeout(
                function(){

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                700
            );


        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            /*
            ==================================
            CONNECTION ERROR
            ==================================
            */

            showMessage(
                "Could not connect to the login server. Please check your internet connection or try again.",
                "error"
            );


            setLoading(false);

        }

    }
);

</script>


</body>

</html>
