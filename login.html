</footer><script>

const API =
"https://login.gateofheavensl1.workers.dev";


const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");

const statusBox =
document.getElementById("status");


function showStatus(message,type){

statusBox.className =
"status " + type;

statusBox.textContent =
message;

statusBox.style.display =
"block";

}


form.addEventListener(
"submit",
async function(event){

event.preventDefault();


const email =
document.getElementById("email")
.value
.trim()
.toLowerCase();


const password =
document.getElementById("password")
.value;


button.disabled = true;

button.textContent =
"⏳ Logging in...";


try{

const response =
await fetch(
API + "/api/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:email,
password:password

})
});


let data;

try{

data =
await response.json();

}
catch(jsonError){

throw new Error(
"Invalid response from login server."
);

}


if(
!response.ok ||
!data.success
){

showStatus(
data.message ||
"Login failed. Please check your email and password.",
"error"
);

button.disabled = false;

button.textContent =
"🔐 Login";

return;

}


/*
====================================
LOGIN SUCCESS
====================================
*/

showStatus(
"✅ Login successful! Redirecting to payment...",
"success"
);


/*
====================================
SAVE STUDENT INFORMATION
====================================
*/

if(data.user){

localStorage.setItem(
"createlk_user",
JSON.stringify(data.user)
);

}


/*
Save email separately so payment.html
can automatically identify the student.
*/

localStorage.setItem(
"createlk_student_email",
email
);


/*
====================================
REDIRECT TO PAYMENT PAGE
====================================
*/

setTimeout(function(){

window.location.replace(
"payment.html"
);

},800);


}
catch(error){

console.error(
"Login error:",
error
);

showStatus(
"❌ Unable to connect to CreateLK Academy. Please try again.",
"error"
);

button.disabled = false;

button.textContent =
"🔐 Login";

}

});

</script></body>
</html>
