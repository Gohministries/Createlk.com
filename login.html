<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student Login | CreateLK Academy</title>

<meta name="description"
content="Login to your CreateLK Academy student account.">

<meta name="theme-color" content="#174ea6">

<style>

*{
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#f5f8ff;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#172033;
}

.card{
width:100%;
max-width:420px;
background:#fff;
padding:28px;
border-radius:20px;
box-shadow:0 8px 30px #00000012;
}

.logo{
text-align:center;
font-size:23px;
font-weight:800;
color:#174ea6;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#667085;
font-size:14px;
margin-bottom:25px;
}

label{
display:block;
font-size:14px;
font-weight:700;
margin:14px 0 6px;
}

input{
width:100%;
padding:13px;
border:1px solid #d0d5dd;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#174ea6;
box-shadow:0 0 0 3px #174ea61a;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:10px;
background:#174ea6;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:10px;
font-size:14px;
text-align:center;
}

.error{
display:block;
background:#fef3f2;
color:#b42318;
}

.success{
display:block;
background:#e8f7ed;
color:#176b35;
}

.links{
text-align:center;
margin-top:20px;
font-size:14px;
line-height:1.7;
}

.links a{
color:#174ea6;
font-weight:700;
text-decoration:none;
}

.links a:hover{
text-decoration:underline;
}

.security{
margin-top:22px;
padding:12px;
background:#f5f8ff;
border-radius:10px;
text-align:center;
font-size:12px;
color:#667085;
line-height:1.5;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">
📚 CreateLK Academy
</div>

<div class="subtitle">
🔐 Student Login
</div>


<form id="loginForm">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
autocomplete="email"
required
>


<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required
>


<button
id="loginBtn"
type="submit"
>
🔐 Login
</button>

</form>


<div
id="message"
class="message">
</div>


<div class="links">

Don't have an account?

<a href="register.html">
Create Account
</a>

<br>

<a href="index.html">
← Back to Home
</a>

</div>


<div class="security">
🔒 Your account information is securely processed.
<br>
📚 Continue learning with CreateLK Academy.
</div>

</div>


<script>

"use strict";


/* ===============================
   LOGIN API
=============================== */

const API =
"https://login.gateofheavensl1.workers.dev";


/* ===============================
   ELEMENTS
=============================== */

const form =
document.getElementById("loginForm");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const button =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* ===============================
   LOGIN
=============================== */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();


const emailValue =
email.value
.trim()
.toLowerCase();

const passwordValue =
password.value;


if(
!emailValue ||
!passwordValue
){

showMessage(
"Please enter your email and password.",
"error"
);

return;

}


button.disabled=true;

button.textContent=
"⏳ Logging in...";

message.className=
"message";

message.style.display=
"none";


try{


/* ===============================
   SEND LOGIN REQUEST
=============================== */

const response =
await fetch(
API + "/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:
emailValue,

password:
passwordValue

})

});


/* ===============================
   READ RESPONSE
=============================== */

const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Login failed. Please check your details."
);

}


/* ===============================
   STUDENT DATA
=============================== */

if(
!data.student
){

throw new Error(
"Student information was not returned."
);

}


/* ===============================
   SAVE SESSION
=============================== */

localStorage.setItem(
"createlk_student",
JSON.stringify(
data.student
)
);


/* ===============================
   SUCCESS
=============================== */

showMessage(
"✅ Login successful. Opening dashboard...",
"success"
);


/* ===============================
   REDIRECT
=============================== */

setTimeout(
function(){

window.location.href=
"dashboard.html";

},
700
);


}catch(error){

console.error(
"Login error:",
error
);


showMessage(
"❌ " +
(
error.message ||
"Unable to login."
),
"error"
);


button.disabled=false;

button.textContent=
"🔐 Login";

}

});


/* ===============================
   MESSAGE
=============================== */

function showMessage(
text,
type
){

message.textContent=
text;

message.className=
"message " + type;

message.style.display=
"block";

}

</script>

</body>
</html>
