<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | CreateLK Academy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#fff;
    padding:35px 28px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:800;
    color:#174ea6;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:6px 0 28px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d5d9e0;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#174ea6;
    box-shadow:0 0 0 3px rgba(23,78,166,.10);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#174ea6;
    font-weight:600;
    cursor:pointer;
}

.login-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#174ea6;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.login-button:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:18px;
    text-align:center;
    font-size:14px;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.error{
    background:#fdeaea;
    color:#a32121;
}

.loading{
    display:none;
    text-align:center;
    color:#174ea6;
    font-weight:600;
    margin-top:15px;
}

.register-link{
    text-align:center;
    margin-top:22px;
    color:#666;
}

.register-link a{
    color:#174ea6;
    font-weight:700;
    text-decoration:none;
}

@media(max-width:500px){

    .card{
        padding:28px 20px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
📚 CreateLK Academy
</div>

<div class="subtitle">
Student Login
</div>

<div id="message" class="message"></div>

<form id="loginForm">

<div class="field">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="you@example.com"
autocomplete="email"
required>

</div>

<div class="field">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
class="show"
onclick="togglePassword()">
Show
</button>

</div>

</div>

<button
type="submit"
class="login-button"
id="loginButton">

Login

</button>

</form>

<div id="loading" class="loading">
Opening your dashboard...
</div>

<div class="register-link">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>

</div>

</div>

<script>

const API_URL =
"https://shy-fog-1588.gateofheavensl1.workers.dev";

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginButton");

const loading =
document.getElementById("loading");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}


function togglePassword(){

    const input =
        document.getElementById("password");

    const btn =
        document.querySelector(".show");

    if(input.type === "password"){

        input.type = "text";
        btn.textContent = "Hide";

    }else{

        input.type = "password";
        btn.textContent = "Show";

    }
}


/* If already logged in, go to dashboard */

window.addEventListener(
"DOMContentLoaded",
function(){

    const saved =
        localStorage.getItem(
            "createlk_student"
        );

    if(saved){

        try{

            const student =
                JSON.parse(saved);

            if(student && student.id){

                window.location.href =
                    "dashboard.html";

            }

        }catch(error){

            localStorage.removeItem(
                "createlk_student"
            );

        }

    }

});


form.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    message.style.display = "none";

    const email =
        document.getElementById("email")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;


    if(!email || !password){

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Logging in...";


    try{

        const response =
            await fetch(
                API_URL + "/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        email:email,
                        password:password

                    })
                }
            );


        const data =
            await response.json();


        if(response.ok && data.success){

            localStorage.setItem(
                "createlk_student",
                JSON.stringify(data.student)
            );


            showMessage(
                "Login successful!",
                "success"
            );


            loading.style.display =
                "block";

            form.style.display =
                "none";


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );


        }else{

            showMessage(
                data.message ||
                "Invalid email or password.",
                "error"
            );

            button.disabled = false;
            button.textContent = "Login";
        }


    }catch(error){

        console.error(
            "Login Error:",
            error
        );

        showMessage(
            "Unable to connect to the server. Please check your internet connection.",
            "error"
        );

        button.disabled = false;
        button.textContent = "Login";
    }

});

</script>

</body>
</html>
