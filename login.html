<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | CreateLK Academy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#fff;
    padding:35px 28px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:800;
    color:#174ea6;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:6px 0 28px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d5d9e0;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#174ea6;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#174ea6;
    font-weight:600;
    cursor:pointer;
}

.login-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#174ea6;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.login-button:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:18px;
    text-align:center;
    font-size:14px;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.error{
    background:#fdeaea;
    color:#a32121;
}

.loading{
    display:none;
    text-align:center;
    color:#174ea6;
    font-weight:600;
    margin-top:15px;
}

.register-link{
    text-align:center;
    margin-top:22px;
    color:#666;
}

.register-link a{
    color:#174ea6;
    font-weight:700;
    text-decoration:none;
}

.home-link{
    text-align:center;
    margin-top:15px;
}

.home-link a{
    color:#68757c;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
📚 CreateLK Academy
</div>

<div class="subtitle">
Student Login
</div>

<div id="message" class="message"></div>

<form id="loginForm">

<div class="field">

<label for="email">
Email Address
</label>

<input
    type="email"
    id="email"
    placeholder="you@example.com"
    autocomplete="email"
    required>

</div>

<div class="field">

<label for="password">
Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required>

<button
    type="button"
    class="show"
    id="showPassword">

Show

</button>

</div>
</div>

<button
    type="submit"
    class="login-button"
    id="loginButton">

Login

</button>

</form>

<div id="loading" class="loading">
Opening your student dashboard...
</div>

<div class="register-link">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>

<div class="home-link">

<a href="index.html">
← Back to CreateLK Academy
</a>

</div>

</div>
</div>

<script>

"use strict";

const API_URL =
"https://cool-resonance-7780.gateofheavensl1.workers.dev";

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginButton");

const loading =
document.getElementById("loading");

const password =
document.getElementById("password");

const showPassword =
document.getElementById("showPassword");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


function setLoading(state){

    button.disabled = state;

    button.textContent =
        state
        ? "Logging in..."
        : "Login";
}


showPassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";

            showPassword.textContent =
                "Hide";

        }else{

            password.type = "password";

            showPassword.textContent =
                "Show";

        }

    }
);


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        message.style.display = "none";

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const passwordValue =
            password.value;

        if(!email || !passwordValue){

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;
        }

        setLoading(true);

        try{

            const response =
                await fetch(
                    API_URL + "/login",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            email:email,

                            password:passwordValue

                        })
                    }
                );

            const text =
                await response.text();

            let data;

            try{

                data =
                    JSON.parse(text);

            }catch(error){

                showMessage(
                    "Server returned an invalid response.",
                    "error"
                );

                setLoading(false);

                return;
            }

            if(!response.ok){

                showMessage(
                    data.message ||
                    "Login failed.",
                    "error"
                );

                setLoading(false);

                return;
            }

            if(data.success !== true){

                showMessage(
                    data.message ||
                    "Invalid email or password.",
                    "error"
                );

                setLoading(false);

                return;
            }

            if(
                !data.student ||
                !data.student.id
            ){

                showMessage(
                    "Student information was not returned.",
                    "error"
                );

                setLoading(false);

                return;
            }

            const student = {

                id:
                    data.student.id,

                first_name:
                    data.student.first_name || "",

                last_name:
                    data.student.last_name || "",

                email:
                    data.student.email || email,

                phone:
                    data.student.phone || "",

                membership_status:
                    data.student.membership_status ||
                    "inactive",

                membership_expiry:
                    data.student.membership_expiry ||
                    null

            };

            localStorage.setItem(
                "createlk_student",
                JSON.stringify(student)
            );

            showMessage(
                "Login successful!",
                "success"
            );

            loading.style.display =
                "block";

            form.style.display =
                "none";

            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);

        }catch(error){

            console.error(error);

            showMessage(
                "Could not connect to CreateLK Academy server.",
                "error"
            );

            setLoading(false);
        }

    }
);

</script>

</body>
</html>
