<form id="orderForm">

  <input type="text" id="name" placeholder="Full Name" required>

  <input type="tel" id="phone" placeholder="Phone Number" required>

  <select id="service" required>
    <option value="">Select Service</option>
    <option>Professional Photo Editing</option>
    <option>Logo Design</option>
    <option>Banner Design</option>
    <option>Photo Background Removal</option>
  </select>

  <textarea id="description" placeholder="Describe your project"></textarea>

  <button type="submit">Submit Order</button>

</form>

<script>
document.getElementById("orderForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    service: document.getElementById("service").value,
    description: document.getElementById("description").value
  };

  const res = await fetch("https://YOUR-WORKER.workers.dev/order", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    alert("Order submitted successfully!");
    document.getElementById("orderForm").reset();
  } else {
    alert("Submission failed.");
  }
});
</script>
