<form id="orderForm">
  <input type="text" id="name" placeholder="Full Name" required>
  <input type="tel" id="phone" placeholder="Phone Number" required>
  <select id="service" required>
    <option value="">Select Service</option>
    <option>Professional Photo Editing</option>
    <option>Logo Design</option>
    <option>Banner Design</option>
    <option>Photo Background Removal</option>
  </select>
  <textarea id="description" placeholder="Describe your project"></textarea>
  <button type="submit">Submit Order</button>
</form>

<!-- Make sure these <script> tags are here -->
<script>
document.getElementById("orderForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    service: document.getElementById("service").value,
    description: document.getElementById("description").value
  };

  try {
    const res = await fetch("https://proud-smoke-3af1.gateofheavensl1.workers.dev/order", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (res.ok && result.success) {
      alert("Order submitted successfully! We will contact you soon.");
      document.getElementById("orderForm").reset();
    } else {
      alert("Submission failed. Please try again.");
    }
  } catch (err) {
    console.error("Error submitting order:", err);
    alert("An error occurred. Please contact us via WhatsApp.");
  }
});
</script>
