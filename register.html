<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account | CreateLK Academy</title>

<meta name="description"
content="Create your CreateLK Academy student account.">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


/* =========================
   PAGE
========================= */

body{
    min-height:100vh;
    background:#f4f7fc;
    color:#263238;
    display:flex;
    flex-direction:column;
}


/* =========================
   NAVIGATION
========================= */

nav{
    background:#ffffff;
    padding:16px 6%;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#1565c0;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:35px 20px;
}


/* =========================
   CARD
========================= */

.card{
    width:100%;
    background:#ffffff;
    padding:32px;
    border-radius:20px;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
    border:1px solid #edf0f5;
}


/* =========================
   TITLE
========================= */

h1{
    text-align:center;
    color:#1565c0;
    margin-bottom:8px;
    font-size:30px;
    line-height:1.3;
}

.subtitle{
    text-align:center;
    color:#68757c;
    margin-bottom:28px;
    line-height:1.6;
}


/* =========================
   FORM
========================= */

.form-group{
    width:100%;
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:7px;
    line-height:1.4;
}


/* =========================
   INPUTS
========================= */

input{
    display:block;
    width:100%;
    height:50px;
    padding:12px 14px;

    border:1px solid #ccd5dc;
    border-radius:10px;

    background:#ffffff;
    color:#263238;

    font-size:15px;
    outline:none;

    transition:
        border-color .2s,
        box-shadow .2s;
}

input:focus{
    border-color:#1565c0;

    box-shadow:
        0 0 0 3px
        rgba(21,101,192,.10);
}

input::placeholder{
    color:#89949b;
}


/* =========================
   PASSWORD WRAPPER
========================= */

.password-wrap{
    position:relative;
    width:100%;
}

.password-wrap input{
    padding-right:78px;
}


/* =========================
   SHOW PASSWORD BUTTON
========================= */

.show-password{
    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    height:34px;
    min-width:52px;

    padding:5px 8px;

    border:0;
    border-radius:7px;

    background:transparent;

    color:#1565c0;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    z-index:2;
}

.show-password:hover{
    background:#e3f2fd;
}


/* =========================
   PASSWORD STRENGTH
========================= */

.password-strength{
    min-height:20px;

    margin-top:7px;

    font-size:13px;
    font-weight:700;

    line-height:1.4;
}


/* =========================
   CREATE BUTTON
========================= */

.register-button{
    display:block;

    width:100%;
    height:50px;

    margin-top:8px;

    padding:12px 16px;

    border:0;
    border-radius:28px;

    background:#1565c0;
    color:#ffffff;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    transition:
        background .2s,
        opacity .2s;
}

.register-button:hover{
    background:#0d47a1;
}

.register-button:disabled{
    background:#9eabb3;
    cursor:not-allowed;
}


/* =========================
   MESSAGE
========================= */

.message{
    width:100%;

    min-height:22px;

    margin-top:16px;

    text-align:center;

    font-size:14px;
    font-weight:700;

    line-height:1.5;

    word-break:break-word;
}


/* =========================
   LINKS
========================= */

.links{
    width:100%;

    text-align:center;

    margin-top:25px;
}

.links a{
    display:block;

    margin-top:12px;

    color:#1565c0;

    text-decoration:none;

    font-weight:700;

    line-height:1.5;
}

.links a:hover{
    text-decoration:underline;
}


/* =========================
   SECURITY
========================= */

.security{
    width:100%;

    margin-top:25px;

    padding:16px;

    background:#f8fafc;

    border-radius:12px;

    text-align:center;

    font-size:13px;

    color:#68757c;

    line-height:1.6;
}


/* =========================
   FOOTER
========================= */

footer{
    margin-top:auto;

    background:#111827;

    color:#9ca3af;

    text-align:center;

    padding:25px 20px;
}

footer strong{
    color:#ffffff;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    nav{
        padding:15px 20px;
    }

    .logo{
        font-size:20px;
    }

    .container{
        padding:25px 15px;
    }

    .card{
        padding:25px 20px;
        border-radius:16px;
    }

    h1{
        font-size:27px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:25px;
    }

    input{
        height:50px;
        font-size:16px;
    }

    .register-button{
        height:50px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:360px){

    .card{
        padding:22px 16px;
    }

    .logo{
        font-size:18px;
    }

    h1{
        font-size:24px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

    <div class="logo">
        📚 CreateLK Academy
    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main class="container">

<div class="card">


<h1>
    Create Student Account
</h1>


<p class="subtitle">
    Create your account to access CreateLK Academy.
</p>


<form id="registerForm">


<!-- =========================
     FIRST NAME
========================= -->

<div class="form-group">

<label for="firstName">
    First Name
</label>

<input
    id="firstName"
    type="text"
    placeholder="Enter your first name"
    autocomplete="given-name"
    required
>

</div>


<!-- =========================
     LAST NAME
========================= -->

<div class="form-group">

<label for="lastName">
    Last Name
</label>

<input
    id="lastName"
    type="text"
    placeholder="Enter your last name"
    autocomplete="family-name"
    required
>

</div>


<!-- =========================
     EMAIL
========================= -->

<div class="form-group">

<label for="email">
    Email Address
</label>

<input
    id="email"
    type="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>

</div>


<!-- =========================
     WHATSAPP
========================= -->

<div class="form-group">

<label for="phone">
    WhatsApp Number
</label>

<input
    id="phone"
    type="tel"
    placeholder="+94 7XXXXXXXX"
    autocomplete="tel"
>

</div>


<!-- =========================
     PASSWORD
========================= -->

<div class="form-group">

<label for="password">
    Password
</label>

<div class="password-wrap">

<input
    id="password"
    type="password"
    placeholder="Create a strong password"
    autocomplete="new-password"
    minlength="8"
    required
>

<button
    type="button"
    class="show-password"
    id="showPassword"
>
    Show
</button>

</div>


<div
    id="passwordStrength"
    class="password-strength"
    aria-live="polite">
</div>

</div>


<!-- =========================
     CONFIRM PASSWORD
========================= -->

<div class="form-group">

<label for="confirmPassword">
    Confirm Password
</label>

<div class="password-wrap">

<input
    id="confirmPassword"
    type="password"
    placeholder="Enter your password again"
    autocomplete="new-password"
    minlength="8"
    required
>

<button
    type="button"
    class="show-password"
    id="showConfirmPassword"
>
    Show
</button>

</div>

</div>


<!-- =========================
     CREATE ACCOUNT
========================= -->

<button
    id="registerButton"
    class="register-button"
    type="submit"
>
    Create Account
</button>


<!-- =========================
     MESSAGE
========================= -->

<div
    id="message"
    class="message"
    aria-live="polite">
</div>


</form>


<!-- =========================
     LINKS
========================= -->

<div class="links">

<a href="login.html">
    Already have an account? Sign in
</a>

<a href="index.html">
    ← Back to Academy
</a>

</div>


<!-- =========================
     SECURITY
========================= -->

<div class="security">

🔐 Your password is securely hashed
before it is stored by the server.

</div>


</div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

<p>

<strong>
    📚 CreateLK Academy
</strong>

</p>

<p style="margin-top:8px;">

    © 2026 CreateLK Academy.
    All Rights Reserved.

</p>

</footer>


<script>

/* =========================================
   CREATE LK ACADEMY REGISTRATION
========================================= */


/*
   YOUR CURRENT WORKER API
*/

const API =
"https://flat-queen-4e0b.gateofheavensl1.workers.dev";


/*
   ELEMENTS
*/

const registerForm =
document.getElementById("registerForm");

const registerButton =
document.getElementById("registerButton");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const passwordStrength =
document.getElementById("passwordStrength");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type === "password"
        ){

            passwordInput.type = "text";

            showPassword.textContent =
            "Hide";

        }else{

            passwordInput.type = "password";

            showPassword.textContent =
            "Show";

        }

    }
);


showConfirmPassword.addEventListener(
    "click",
    function(){

        if(
            confirmPasswordInput.type === "password"
        ){

            confirmPasswordInput.type =
            "text";

            showConfirmPassword.textContent =
            "Hide";

        }else{

            confirmPasswordInput.type =
            "password";

            showConfirmPassword.textContent =
            "Show";

        }

    }
);


/* =========================================
   PASSWORD STRENGTH
========================================= */

function checkPasswordStrength(value){

    if(!value){

        passwordStrength.textContent = "";

        return;
    }


    let score = 0;


    if(value.length >= 8)
        score++;


    if(value.length >= 12)
        score++;


    if(/[A-Z]/.test(value))
        score++;


    if(/[a-z]/.test(value))
        score++;


    if(/[0-9]/.test(value))
        score++;


    if(/[^A-Za-z0-9]/.test(value))
        score++;


    if(score <= 2){

        passwordStrength.textContent =
        "Password strength: Weak";

        passwordStrength.style.color =
        "#c62828";

    }
    else if(score <= 4){

        passwordStrength.textContent =
        "Password strength: Medium";

        passwordStrength.style.color =
        "#ef6c00";

    }
    else{

        passwordStrength.textContent =
        "Password strength: Strong";

        passwordStrength.style.color =
        "#00897b";

    }

}


passwordInput.addEventListener(
    "input",
    function(){

        checkPasswordStrength(
            passwordInput.value
        );

    }
);


/* =========================================
   REGISTRATION
========================================= */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        /*
           GET VALUES
        */

        const firstName =
        document
        .getElementById("firstName")
        .value
        .trim();


        const lastName =
        document
        .getElementById("lastName")
        .value
        .trim();


        const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


        const phone =
        document
        .getElementById("phone")
        .value
        .trim();


        const password =
        passwordInput.value;


        const confirmPassword =
        confirmPasswordInput.value;


        /*
           BASIC VALIDATION
        */

        if(!firstName){

            message.textContent =
            "Please enter your first name.";

            message.style.color =
            "#c62828";

            return;
        }


        if(!lastName){

            message.textContent =
            "Please enter your last name.";

            message.style.color =
            "#c62828";

            return;
        }


        if(!email){

            message.textContent =
            "Please enter your email address.";

            message.style.color =
            "#c62828";

            return;
        }


        if(!password){

            message.textContent =
            "Please create a password.";

            message.style.color =
            "#c62828";

            return;
        }


        /*
           PASSWORD MATCH
        */

        if(
            password !==
            confirmPassword
        ){

            message.textContent =
            "Passwords do not match.";

            message.style.color =
            "#c62828";

            return;
        }


        /*
           PASSWORD LENGTH
        */

        if(
            password.length < 8
        ){

            message.textContent =
            "Password must contain at least 8 characters.";

            message.style.color =
            "#c62828";

            return;
        }


        /*
           PASSWORD COMPLEXITY
        */

        if(
            !/[A-Z]/.test(password) ||
            !/[a-z]/.test(password) ||
            !/[0-9]/.test(password) ||
            !/[^A-Za-z0-9]/.test(password)
        ){

            message.textContent =
            "Use uppercase, lowercase, numbers and a symbol.";

            message.style.color =
            "#c62828";

            return;
        }


        /*
           DISABLE BUTTON
        */

        registerButton.disabled =
        true;

        registerButton.textContent =
        "Creating Account...";


        message.textContent =
        "Creating your account...";

        message.style.color =
        "#1565c0";


        try{


            /*
               SEND TO WORKER
            */

            const response =
            await fetch(
                API + "/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        first_name:
                        firstName,

                        last_name:
                        lastName,

                        email:
                        email,

                        phone:
                        phone,

                        password:
                        password

                    })

                }
            );


            /*
               READ RESPONSE
            */

            let data;


            try{

                data =
                await response.json();

            }
            catch{

                throw new Error(
                    "The server returned an invalid response."
                );

            }


            /*
               CHECK SERVER RESULT
            */

            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Account creation failed."
                );

            }


            /*
               SUCCESS
            */

            message.textContent =
            "Account created successfully!";

            message.style.color =
            "#00897b";


            registerButton.textContent =
            "Account Created";


            /*
               REDIRECT AFTER SUCCESS
            */

            setTimeout(
                function(){

                    window.location.href =
                    "login.html";

                },
                1200
            );


        }
        catch(error){

            console.error(
                "Registration error:",
                error
            );


            /*
               SHOW ERROR
            */

            message.textContent =
            error.message ||
            "Unable to create account.";

            message.style.color =
            "#c62828";


            /*
               IMPORTANT:
               DO NOT CLEAR THE FORM
            */


            registerButton.disabled =
            false;

            registerButton.textContent =
            "Create Account";

        }

    }
);

</script>

</body>

</html>
