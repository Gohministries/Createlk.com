<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account | CreateLK Academy</title>

<meta name="description"
content="Create your CreateLK Academy student account.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
min-height:100vh;
background:#f4f7fc;
color:#263238;
display:flex;
flex-direction:column;
}

nav{
background:#fff;
padding:16px 6%;
box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.logo{
font-size:23px;
font-weight:800;
color:#1565c0;
}

.container{
width:100%;
max-width:520px;
margin:auto;
padding:30px 20px;
}

.card{
background:#fff;
padding:32px;
border-radius:20px;
box-shadow:0 8px 28px rgba(0,0,0,.08);
border:1px solid #edf0f5;
}

h1{
text-align:center;
color:#1565c0;
margin-bottom:8px;
font-size:30px;
}

.subtitle{
text-align:center;
color:#68757c;
margin-bottom:25px;
}

label{
display:block;
font-weight:600;
margin:15px 0 6px;
}

input{
width:100%;
padding:13px 15px;
border:1px solid #ccd5dc;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#1565c0;
}

.register-button{
width:100%;
margin-top:22px;
padding:14px;
border:0;
border-radius:28px;
background:#1565c0;
color:#fff;
font-size:16px;
font-weight:800;
cursor:pointer;
}

.register-button:hover{
background:#0d47a1;
}

.register-button:disabled{
background:#9eabb3;
cursor:not-allowed;
}

.message{
text-align:center;
margin-top:16px;
font-weight:600;
font-size:14px;
}

.links{
text-align:center;
margin-top:22px;
}

.links a{
display:block;
margin-top:10px;
color:#1565c0;
text-decoration:none;
font-weight:600;
}

.links a:hover{
text-decoration:underline;
}

.security{
margin-top:25px;
padding:16px;
background:#f8fafc;
border-radius:12px;
text-align:center;
font-size:13px;
color:#68757c;
}

footer{
margin-top:auto;
background:#111827;
color:#9ca3af;
text-align:center;
padding:25px 20px;
}

footer strong{
color:#fff;
}

@media(max-width:600px){

.card{
padding:24px 20px;
}

h1{
font-size:27px;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">
📚 CreateLK Academy
</div>

</nav>


<main class="container">

<div class="card">

<h1>
Create Student Account
</h1>

<p class="subtitle">
Create your account to access CreateLK Academy.
</p>


<form id="registerForm">


<label for="firstName">
First Name
</label>

<input
id="firstName"
type="text"
placeholder="Enter your first name"
autocomplete="given-name"
required
>


<label for="lastName">
Last Name
</label>

<input
id="lastName"
type="text"
placeholder="Enter your last name"
autocomplete="family-name"
required
>


<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required
>


<label for="phone">
WhatsApp Number
</label>

<input
id="phone"
type="tel"
placeholder="+94 7XXXXXXXX"
autocomplete="tel"
>


<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="At least 8 characters"
autocomplete="new-password"
minlength="8"
required
>


<label for="confirmPassword">
Confirm Password
</label>

<input
id="confirmPassword"
type="password"
placeholder="Enter your password again"
autocomplete="new-password"
minlength="8"
required
>


<button
id="registerButton"
class="register-button"
type="submit"
>

Create Account

</button>


<div
id="message"
class="message">
</div>

</form>


<div class="links">

<a href="login.html">
Already have an account? Sign in
</a>

<a href="index.html">
← Back to Academy
</a>

</div>


<div class="security">

🔐 Your password is securely hashed
before it is stored by the server.

</div>

</div>

</main>


<footer>

<p>

<strong>
📚 CreateLK Academy
</strong>

</p>

<p style="margin-top:8px;">
© 2026 CreateLK Academy. All Rights Reserved.
</p>

</footer>


<script>

const registerForm =
document.getElementById(
"registerForm"
);

const registerButton =
document.getElementById(
"registerButton"
);

const message =
document.getElementById(
"message"
);


registerForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


const firstName =
document
.getElementById(
"firstName"
)
.value
.trim();


const lastName =
document
.getElementById(
"lastName"
)
.value
.trim();


const email =
document
.getElementById(
"email"
)
.value
.trim()
.toLowerCase();


const phone =
document
.getElementById(
"phone"
)
.value
.trim();


const password =
document
.getElementById(
"password"
)
.value;


const confirmPassword =
document
.getElementById(
"confirmPassword"
)
.value;


if(
password !==
confirmPassword
){

message.textContent =
"Passwords do not match.";

message.style.color =
"#c62828";

return;

}


if(password.length < 8){

message.textContent =
"Password must contain at least 8 characters.";

message.style.color =
"#c62828";

return;

}


registerButton.disabled =
true;

registerButton.textContent =
"Creating account...";

message.textContent =
"Please wait...";

message.style.color =
"#1565c0";


try{


const response =
await fetch(
"https://falling-pond-40a7.gateofheavensl1.workers.dev/register",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

first_name:
firstName,

last_name:
lastName,

email:
email,

phone:
phone,

password:
password

})

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Account creation failed."
);

}


message.textContent =
"Account created successfully!";

message.style.color =
"#00897b";


setTimeout(
function(){

window.location.href =
"login.html";

},
1000
);


}
catch(error){

console.error(error);

message.textContent =
error.message ||
"Unable to create account.";

message.style.color =
"#c62828";

registerButton.disabled =
false;

registerButton.textContent =
"Create Account";

}

});

</script>

</body>

</html>
