/* INPUT */

input{

/* PASSWORD */

.password-wrap{

}

.password-wrap input{

}

.show-password{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    height:34px;

    padding:5px 8px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#1565c0;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    z-index:2;
}

.show-password:hover{
    background:#e3f2fd;
}

/* PASSWORD STRENGTH */

.password-strength{
    min-height:20px;
    margin-top:7px;
    font-size:13px;
    font-weight:700;
    line-height:20px;
}

/* PASSWORD SUGGESTION */

.password-suggestion{
    margin-top:8px;
    padding:12px;
    background:#f8fafc;
    border-radius:10px;
    border:1px solid #edf0f5;
}

.suggestion-box{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
}

.suggestion-text{
    flex:1;
    min-width:0;
    font-size:13px;
    color:#68757c;
    word-break:break-all;
    line-height:1.5;
}

.use-suggestion{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:36px;
    padding:8px 12px;
    border:0;
    border-radius:8px;
    background:#1565c0;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    line-height:1;
}

.use-suggestion:hover{
    background:#0d47a1;
}

.use-suggestion:active{
    transform:scale(.98);
}

/* REGISTER BUTTON */

.register-button{
    display:block;
    width:100%;
    height:48px;
    margin-top:4px;
    padding:12px 16px;
    border:0;
    border-radius:28px;
    background:#1565c0;
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.register-button:hover{
    background:#0d47a1;
}

.register-button:disabled{
    background:#9eabb3;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    width:100%;
    min-height:22px;
    margin-top:16px;
    text-align:center;
    font-weight:600;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

/* LINKS */

.links{
    text-align:center;
    margin-top:24px;
}

.links a{
    display:block;
    margin-top:10px;
    color:#1565c0;
    text-decoration:none;
    font-weight:600;
    line-height:1.5;
}

.links a:hover{
    text-decoration:underline;
}

/* SECURITY */

.security{
    margin-top:25px;
    padding:16px;
    background:#f8fafc;
    border-radius:12px;
    text-align:center;
    font-size:13px;
    color:#68757c;
    line-height:1.6;
}

/* FOOTER */

footer{
    margin-top:auto;
    background:#111827;
    color:#9ca3af;
    text-align:center;
    padding:25px 20px;
}

footer strong{
    color:#fff;
}

/* MOBILE */

@media(max-width:600px){

    nav{
        padding:15px 20px;
    }

    .logo{
        font-size:20px;
    }

    .container{
        padding:25px 15px;
    }

    .card{
        padding:25px 20px;
        border-radius:16px;
    }

    h1{
        font-size:27px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:25px;
    }

    input{
        height:48px;
        font-size:16px;
    }

    .suggestion-box{
        flex-direction:column;
        align-items:stretch;
    }

    .use-suggestion{
        width:100%;
        min-height:42px;
    }

    .register-button{
        height:50px;
    }
}

/* VERY SMALL */

@media(max-width:360px){

    .card{
        padding:22px 16px;
    }

    .logo{
        font-size:18px;
    }

    h1{
        font-size:24px;
    }

}

</style></head><body><nav>

© 2026 CreateLK Academy. All Rights Reserved.
</p></footer><script>

const API =
"https://flat-queen-4e0b.gateofheavensl1.workers.dev";

const registerForm =
document.getElementById("registerForm");

const registerButton =
document.getElementById("registerButton");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const passwordStrength =
document.getElementById("passwordStrength");

const passwordSuggestion =
document.getElementById("passwordSuggestion");

const useSuggestion =
document.getElementById("useSuggestion");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");


/* SHOW / HIDE PASSWORD */

showPassword.addEventListener("click", function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";
        showPassword.textContent = "Hide";

    }else{

        passwordInput.type = "password";
        showPassword.textContent = "Show";

    }

});


showConfirmPassword.addEventListener("click", function(){

    if(confirmPasswordInput.type === "password"){

        confirmPasswordInput.type = "text";
        showConfirmPassword.textContent = "Hide";

    }else{

        confirmPasswordInput.type = "password";
        showConfirmPassword.textContent = "Show";

    }

});


/* GENERATE STRONG PASSWORD */

function generateStrongPassword(){

    const upper =
        "ABCDEFGHJKLMNPQRSTUVWXYZ";

    const lower =
        "abcdefghijkmnopqrstuvwxyz";

    const numbers =
        "23456789";

    const symbols =
        "!@#$%^&*";

    const all =
        upper + lower + numbers + symbols;

    const array =
        new Uint32Array(16);

    crypto.getRandomValues(array);

    let result = "";

    /* Guarantee all character types */

    result += upper[array[0] % upper.length];
    result += lower[array[1] % lower.length];
    result += numbers[array[2] % numbers.length];
    result += symbols[array[3] % symbols.length];

    for(let i = 4; i < 16; i++){

        result +=
            all[array[i] % all.length];

    }

    /* Shuffle */

    return result
        .split("")
        .sort(() => Math.random() - 0.5)
        .join("");

}


/* PASSWORD STRENGTH */

function checkPasswordStrength(value){

    if(!value){

        passwordStrength.textContent = "";
        return;

    }

    let score = 0;

    if(value.length >= 8)
        score++;

    if(value.length >= 12)
        score++;

    if(/[A-Z]/.test(value))
        score++;

    if(/[a-z]/.test(value))
        score++;

    if(/[0-9]/.test(value))
        score++;

    if(/[^A-Za-z0-9]/.test(value))
        score++;


    if(score <= 2){

        passwordStrength.textContent =
            "Password strength: Weak";

        passwordStrength.style.color =
            "#c62828";

    }
    else if(score <= 4){

        passwordStrength.textContent =
            "Password strength: Medium";

        passwordStrength.style.color =
            "#ef6c00";

    }
    else{

        passwordStrength.textContent =
            "Password strength: Strong";

        passwordStrength.style.color =
            "#00897b";

    }

}


passwordInput.addEventListener(
"input",
function(){

    checkPasswordStrength(
        passwordInput.value
    );

});


/* GENERATE BUTTON */

useSuggestion.addEventListener(
"click",
function(){

    const suggestion =
        generateStrongPassword();

    passwordInput.value =
        suggestion;

    confirmPasswordInput.value =
        suggestion;

    passwordSuggestion.textContent =
        suggestion;

    passwordInput.type =
        "text";

    confirmPasswordInput.type =
        "text";

    showPassword.textContent =
        "Hide";

    showConfirmPassword.textContent =
        "Hide";

    checkPasswordStrength(
        suggestion
    );

    passwordInput.focus();

});


/* REGISTRATION */

registerForm.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    const firstName =
        document
        .getElementById("firstName")
        .value
        .trim();

    const lastName =
        document
        .getElementById("lastName")
        .value
        .trim();

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const phone =
        document
        .getElementById("phone")
        .value
        .trim();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;


    if(password !== confirmPassword){

        message.textContent =
            "Passwords do not match.";

        message.style.color =
            "#c62828";

        return;

    }


    if(password.length < 8){

        message.textContent =
            "Password must contain at least 8 characters.";

        message.style.color =
            "#c62828";

        return;

    }


    if(
        !/[A-Z]/.test(password) ||
        !/[a-z]/.test(password) ||
        !/[0-9]/.test(password) ||
        !/[^A-Za-z0-9]/.test(password)
    ){

        message.textContent =
            "Use uppercase, lowercase, numbers and a symbol.";

        message.style.color =
            "#c62828";

        return;

    }


    registerButton.disabled =
        true;

    registerButton.textContent =
        "Creating account...";

    message.textContent =
        "Please wait...";

    message.style.color =
        "#1565c0";


    try{

        const response =
            await fetch(
                API + "/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        first_name:
                            firstName,

                        last_name:
                            lastName,

                        email:
                            email,

                        phone:
                            phone,

                        password:
                            password

                    })
                }
            );


        let data;

        try{

            data =
                await response.json();

        }catch{

            throw new Error(
                "Invalid response from the server."
            );

        }


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Account creation failed."
            );

        }


        message.textContent =
            "Account created successfully!";

        message.style.color =
            "#00897b";


        setTimeout(
            function(){

                window.location.href =
                    "login.html";

            },
            1000
        );


    }
    catch(error){

        console.error(
            "Registration error:",
            error
        );

        message.textContent =
            error.message ||
            "Unable to create account.";

        message.style.color =
            "#c62828";

        registerButton.disabled =
            false;

        registerButton.textContent =
            "Create Account";

    }

});

</script></body>
