<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account | CreateLK Academy</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#f4f7fc;
    color:#263238;
    font-family:Arial,"Segoe UI",sans-serif;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
}


/* NAV */

nav{
    width:100%;
    background:#fff;
    padding:16px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.logo{
    max-width:600px;
    margin:auto;
    color:#1565c0;
    font-size:22px;
    font-weight:800;
}


/* MAIN */

.container{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:30px 15px 40px;
}

.card{
    width:100%;
    background:#fff;
    border:1px solid #e8edf2;
    border-radius:18px;
    padding:30px 25px;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}


/* HEADINGS */

h1{
    color:#1565c0;
    text-align:center;
    font-size:29px;
    line-height:1.3;
    margin-bottom:8px;
}

.subtitle{
    color:#68757c;
    text-align:center;
    font-size:15px;
    line-height:1.6;
    margin-bottom:25px;
}


/* FORM */

.form-group{
    width:100%;
    margin-bottom:18px;
}

label{
    display:block;
    width:100%;
    margin-bottom:7px;
    font-weight:700;
    line-height:1.4;
}


/* INPUT */

input{
    display:block;
    width:100%;
    height:50px;
    padding:0 14px;
    border:1px solid #ccd5dc;
    border-radius:10px;
    background:#fff;
    color:#263238;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#1565c0;
    box-shadow:0 0 0 3px rgba(21,101,192,.08);
}


/* PASSWORD ROW */

.password-row{
    display:flex;
    width:100%;
    gap:8px;
}

.password-row input{
    flex:1;
    min-width:0;
}


/* SHOW / HIDE BUTTON */

.password-toggle{
    flex:0 0 70px;
    width:70px;
    height:50px;
    padding:0;
    border:1px solid #ccd5dc;
    border-radius:10px;
    background:#fff;
    color:#1565c0;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
}

.password-toggle:hover{
    background:#e3f2fd;
    color:#0d47a1;
}


/* PASSWORD STRENGTH */

.password-strength{
    width:100%;
    min-height:22px;
    margin-top:8px;
    font-size:13px;
    font-weight:700;
    line-height:1.5;
}


/* REGISTER BUTTON */

.register-button{
    display:block;
    width:100%;
    height:50px;
    margin-top:23px;
    border:0;
    border-radius:28px;
    background:#1565c0;
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.register-button:hover{
    background:#0d47a1;
}

.register-button:disabled{
    background:#9eabb3;
    cursor:not-allowed;
}


/* MESSAGE */

.message{
    width:100%;
    min-height:22px;
    margin-top:15px;
    text-align:center;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
    overflow-wrap:anywhere;
}


/* LINKS */

.links{
    width:100%;
    margin-top:24px;
    text-align:center;
}

.links a{
    display:block;
    margin-top:11px;
    color:#1565c0;
    text-decoration:none;
    font-weight:700;
    line-height:1.5;
}

.links a:hover{
    text-decoration:underline;
}


/* SECURITY */

.security{
    width:100%;
    margin-top:25px;
    padding:15px;
    border-radius:12px;
    background:#f8fafc;
    color:#68757c;
    text-align:center;
    font-size:13px;
    line-height:1.6;
}


/* FOOTER */

footer{
    width:100%;
    margin-top:auto;
    padding:25px 15px;
    background:#111827;
    color:#9ca3af;
    text-align:center;
}

footer strong{
    color:#fff;
}


/* MOBILE */

@media(max-width:480px){

    .container{
        padding:20px 10px 30px;
    }

    .card{
        padding:24px 16px;
        border-radius:15px;
    }

    h1{
        font-size:25px;
    }

    .subtitle{
        font-size:14px;
    }

}


/* VERY SMALL PHONE */

@media(max-width:340px){

    .password-row{
        display:block;
    }

    .password-row input{
        width:100%;
    }

    .password-toggle{
        width:100%;
        margin-top:7px;
    }

}

</style></head><body><nav><div class="logo">
📚 CreateLK Academy
</div></nav><main class="container"><div class="card"><h1>
Create Student Account
</h1><p class="subtitle">
Create your account to access CreateLK Academy.
</p><form id="registerForm"><!-- FIRST NAME --><div class="form-group"><label for="firstName">
First Name
</label><input
id="firstName"
type="text"
placeholder="Enter your first name"
autocomplete="given-name"
required

«»

</div><!-- LAST NAME --><div class="form-group"><label for="lastName">
Last Name
</label><input
id="lastName"
type="text"
placeholder="Enter your last name"
autocomplete="family-name"
required

«»

</div><!-- EMAIL --><div class="form-group"><label for="email">
Email Address
</label><input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required

«»

</div><!-- PHONE --><div class="form-group"><label for="phone">
WhatsApp Number
</label><input
id="phone"
type="tel"
placeholder="+94 7XXXXXXXX"
autocomplete="tel"

«»

</div><!-- PASSWORD --><div class="form-group"><label for="password">
Password
</label><div class="password-row"><input
id="password"
type="password"
placeholder="Create a strong password"
autocomplete="new-password"
minlength="8"
required

«»

<button
type="button"
id="showPassword"
class="password-toggle"

«»

Show
</button>

</div><div
id="passwordStrength"
class="password-strength"
aria-live="polite">
</div></div><!-- CONFIRM PASSWORD --><div class="form-group"><label for="confirmPassword">
Confirm Password
</label><div class="password-row"><input
id="confirmPassword"
type="password"
placeholder="Enter your password again"
autocomplete="new-password"
minlength="8"
required

«»

<button
type="button"
id="showConfirmPassword"
class="password-toggle"

«»

Show
</button>

</div></div><!-- CREATE ACCOUNT --><button
id="registerButton"
class="register-button"
type="submit"

«»

Create Account
</button>

<div
id="message"
class="message"
aria-live="polite">
</div></form><div class="links"><a href="login.html">
Already have an account? Sign in
</a><a href="index.html">
← Back to Academy
</a></div><div class="security">🔐 Your password is securely hashed
before it is stored by the server.

</div></div></main><footer><p><strong>
📚 CreateLK Academy
</strong></p><p style="margin-top:8px;">© 2026 CreateLK Academy.
All Rights Reserved.

</p></footer><script>

const API =
"https://flat-queen-4e0b.gateofheavensl1.workers.dev";


const registerForm =
document.getElementById("registerForm");

const registerButton =
document.getElementById("registerButton");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const passwordStrength =
document.getElementById("passwordStrength");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");


/* SHOW PASSWORD */

showPassword.addEventListener(
"click",
function(){

if(passwordInput.type === "password"){

passwordInput.type = "text";
showPassword.textContent = "Hide";

}else{

passwordInput.type = "password";
showPassword.textContent = "Show";

}

});


/* SHOW CONFIRM PASSWORD */

showConfirmPassword.addEventListener(
"click",
function(){

if(confirmPasswordInput.type === "password"){

confirmPasswordInput.type = "text";
showConfirmPassword.textContent = "Hide";

}else{

confirmPasswordInput.type = "password";
showConfirmPassword.textContent = "Show";

}

});


/* PASSWORD STRENGTH */

function checkPasswordStrength(value){

if(!value){

passwordStrength.textContent = "";
return;

}


let score = 0;


if(value.length >= 8)
score++;

if(value.length >= 12)
score++;

if(/[A-Z]/.test(value))
score++;

if(/[a-z]/.test(value))
score++;

if(/[0-9]/.test(value))
score++;

if(/[^A-Za-z0-9]/.test(value))
score++;


if(score <= 2){

passwordStrength.textContent =
"Password strength: Weak";

passwordStrength.style.color =
"#c62828";

}

else if(score <= 4){

passwordStrength.textContent =
"Password strength: Medium";

passwordStrength.style.color =
"#ef6c00";

}

else{

passwordStrength.textContent =
"Password strength: Strong";

passwordStrength.style.color =
"#00897b";

}

}


passwordInput.addEventListener(
"input",
function(){

checkPasswordStrength(
passwordInput.value
);

});


/* REGISTRATION */

registerForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


const firstName =
document
.getElementById("firstName")
.value
.trim();


const lastName =
document
.getElementById("lastName")
.value
.trim();


const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();


const phone =
document
.getElementById("phone")
.value
.trim();


const password =
passwordInput.value;


const confirmPassword =
confirmPasswordInput.value;


/* PASSWORD MATCH */

if(password !== confirmPassword){

message.textContent =
"Passwords do not match.";

message.style.color =
"#c62828";

return;

}


/* PASSWORD LENGTH */

if(password.length < 8){

message.textContent =
"Password must contain at least 8 characters.";

message.style.color =
"#c62828";

return;

}


/* PASSWORD REQUIREMENTS */

if(
!/[A-Z]/.test(password) ||
!/[a-z]/.test(password) ||
!/[0-9]/.test(password) ||
!/[^A-Za-z0-9]/.test(password)
){

message.textContent =
"Use uppercase, lowercase, numbers and a symbol.";

message.style.color =
"#c62828";

return;

}


/* SUBMIT */

registerButton.disabled = true;

registerButton.textContent =
"Creating account...";

message.textContent =
"Please wait...";

message.style.color =
"#1565c0";


try{

const response =
await fetch(
API + "/register",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

first_name:firstName,
last_name:lastName,
email:email,
phone:phone,
password:password

})

});


let data;

try{

data =
await response.json();

}catch{

throw new Error(
"Invalid response from the server."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Account creation failed."
);

}


message.textContent =
"Account created successfully!";

message.style.color =
"#00897b";


setTimeout(
function(){

window.location.href =
"login.html";

},
1000
);


}
catch(error){

console.error(
"Registration error:",
error
);

message.textContent =
error.message ||
"Unable to create account.";

message.style.color =
"#c62828";

registerButton.disabled =
false;

registerButton.textContent =
"Create Account";

}

});

</script></body>
</html>
