<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | CreateLK Academy</title><meta name="description"
content="Create your free CreateLK Academy student account.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #eef4ff,
        #ffffff
    );
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:480px;
}

.card{
    background:#fff;
    padding:32px 26px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:800;
    color:#174ea6;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:6px 0 25px;
}

.field{
    margin-bottom:17px;
}

.row{
    display:flex;
    gap:12px;
}

.field-half{
    flex:1;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d5d9e0;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#174ea6;
    box-shadow:
        0 0 0 3px
        rgba(23,78,166,.10);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#174ea6;
    font-weight:600;
    cursor:pointer;
}

.strength{
    margin-top:6px;
    font-size:13px;
    color:#777;
}

.register{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#174ea6;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.register:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:17px;
    text-align:center;
    font-size:14px;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.error{
    background:#fdeaea;
    color:#a32121;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.login-link a{
    color:#174ea6;
    font-weight:700;
    text-decoration:none;
}

.note{
    margin-top:18px;
    padding:12px;
    background:#f3f7ff;
    border-radius:10px;
    font-size:13px;
    color:#52606d;
    text-align:center;
}

@media(max-width:500px){

    .row{
        flex-direction:column;
        gap:0;
    }

    .card{
        padding:27px 20px;
    }
}

</style></head><body><div class="container"><div class="card"><div class="logo">
📚 CreateLK Academy
</div><div class="subtitle">
Create your free student account
</div><div id="message"
class="message">
</div><form id="registerForm"><div class="row"><div class="field field-half"><label for="firstName">
First Name
</label><input
type="text"
id="firstName"
placeholder="First name"
autocomplete="given-name"
maxlength="50"
required>

</div><div class="field field-half"><label for="lastName">
Last Name
</label><input
type="text"
id="lastName"
placeholder="Last name"
autocomplete="family-name"
maxlength="50"
required>

</div></div><div class="field"><label for="email">
Email Address
</label><input
type="email"
id="email"
placeholder="you@example.com"
autocomplete="email"
maxlength="150"
required>

</div><div class="field"><label for="phone">
WhatsApp Number
</label><input
type="tel"
id="phone"
placeholder="+94771234567"
autocomplete="tel"
maxlength="20">

</div><div class="field"><label for="password">
Password
</label><div class="password-box"><input
type="password"
id="password"
placeholder="Minimum 8 characters"
autocomplete="new-password"
minlength="8"
maxlength="100"
required>

<button
type="button"
class="show"
data-target="password">
Show
</button>

</div><div id="strength"
class="strength">
Password strength: —
</div></div><div class="field"><label for="confirmPassword">
Confirm Password
</label><div class="password-box"><input
type="password"
id="confirmPassword"
placeholder="Enter password again"
autocomplete="new-password"
minlength="8"
maxlength="100"
required>

<button
type="button"
class="show"
data-target="confirmPassword">
Show
</button>

</div></div><button
type="submit"
class="register"
id="registerButton">

Create Account

</button></form><div class="note">
🌱 Your account gives you access to
Beginner English — <strong>100 MCQs FREE FOREVER.</strong>
</div><div class="login-link">Already have an account?

<a href="login.html">
Login
</a></div></div></div><script>

"use strict";

const API_URL =
"https://shy-fog-1588.gateofheavensl1.workers.dev";


const form =
document.getElementById("registerForm");

const message =
document.getElementById("message");

const button =
document.getElementById("registerButton");

const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirmPassword");

const strength =
document.getElementById("strength");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


function setLoading(loading){

    button.disabled =
        loading;

    button.textContent =
        loading
        ? "Creating Account..."
        : "Create Account";
}


/* Password visibility */

document
.querySelectorAll(".show")
.forEach(function(btn){

    btn.addEventListener(
        "click",
        function(){

            const input =
                document.getElementById(
                    btn.dataset.target
                );

            if(input.type === "password"){

                input.type = "text";
                btn.textContent = "Hide";

            }else{

                input.type = "password";
                btn.textContent = "Show";
            }
        }
    );

});


/* Password strength */

password.addEventListener(
    "input",
    function(){

        const value =
            password.value;

        if(!value){

            strength.textContent =
                "Password strength: —";

            return;
        }

        let score = 0;

        if(value.length >= 8)
            score++;

        if(/[A-Z]/.test(value))
            score++;

        if(/[a-z]/.test(value))
            score++;

        if(/[0-9]/.test(value))
            score++;

        if(/[^A-Za-z0-9]/.test(value))
            score++;


        if(score <= 2){

            strength.textContent =
                "Password strength: Weak";

        }else if(score <= 4){

            strength.textContent =
                "Password strength: Medium";

        }else{

            strength.textContent =
                "Password strength: Strong";
        }
    }
);


/* Registration */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        message.style.display =
            "none";


        const firstName =
            document
            .getElementById("firstName")
            .value
            .trim();

        const lastName =
            document
            .getElementById("lastName")
            .value
            .trim();

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const phone =
            document
            .getElementById("phone")
            .value
            .trim();

        const passwordValue =
            password.value;

        const confirmValue =
            confirmPassword.value;


        if(firstName.length < 2){

            showMessage(
                "Please enter your first name.",
                "error"
            );

            return;
        }


        if(lastName.length < 2){

            showMessage(
                "Please enter your last name.",
                "error"
            );

            return;
        }


        if(passwordValue.length < 8){

            showMessage(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;
        }


        if(passwordValue !== confirmValue){

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        setLoading(true);


        try{

            const response =
                await fetch(
                    API_URL + "/register",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            first_name:firstName,
                            last_name:lastName,
                            email:email,
                            phone:phone,
                            password:passwordValue

                        })
                    }
                );


            let data = {};

            try{

                data =
                    await response.json();

            }catch(jsonError){

                data = {};
            }


            if(response.ok && data.success){

                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );

                form.reset();

                strength.textContent =
                    "Password strength: —";


                setTimeout(
                    function(){

                        window.location.href =
                            "login.html";

                    },
                    1200
                );

                return;
            }


            showMessage(
                data.message ||
                "Registration failed. Please try again.",
                "error"
            );

            setLoading(false);


        }catch(error){

            console.error(
                "Registration Error:",
                error
            );

            showMessage(
                "Unable to connect to the server. Please check your internet connection.",
                "error"
            );

            setLoading(false);
        }

    }
);

</script></body>
</html>
