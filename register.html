<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | CreateLK Academy</title><meta name="description"
content="Create your CreateLK Academy student account.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:480px;
}

.card{
    background:#fff;
    padding:32px 26px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    color:#174ea6;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.row{
    display:flex;
    gap:12px;
}

.field{
    margin-bottom:17px;
    flex:1;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
    color:#333;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d5d9e0;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#174ea6;
    box-shadow:0 0 0 3px rgba(23,78,166,.10);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:70px;
}

.show-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#174ea6;
    font-weight:600;
    cursor:pointer;
}

.strength{
    font-size:13px;
    margin-top:6px;
    color:#777;
}

button.register{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#174ea6;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:5px;
}

button.register:hover{
    background:#123d82;
}

button.register:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:17px;
    font-size:14px;
    text-align:center;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.error{
    background:#fdeaea;
    color:#a32121;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.login-link a{
    color:#174ea6;
    font-weight:700;
    text-decoration:none;
}

@media(max-width:500px){
    .row{
        flex-direction:column;
        gap:0;
    }

    .card{
        padding:27px 20px;
    }
}
</style></head><body><div class="container"><div class="card"><div class="logo">
📚 CreateLK Academy
</div><div class="subtitle">
Create your student account
</div><div id="message" class="message"></div><form id="registerForm"><div class="row"><div class="field">
<label for="firstName">First Name</label>
<input
type="text"
id="firstName"
placeholder="First name"
required>
</div><div class="field">
<label for="lastName">Last Name</label>
<input
type="text"
id="lastName"
placeholder="Last name"
required>
</div></div><div class="field">
<label for="email">Email Address</label>
<input
type="email"
id="email"
placeholder="you@example.com"
required>
</div><div class="field">
<label for="phone">WhatsApp Number</label>
<input
type="tel"
id="phone"
placeholder="+94771234567">
</div><div class="field"><label for="password">
Password
</label><div class="password-box"><input
type="password"
id="password"
placeholder="Minimum 8 characters"
required
minlength="8">

<button
type="button"
class="show-btn"
onclick="togglePassword('password',this)">
Show
</button>

</div><div id="strength" class="strength">
Password strength: —
</div></div><div class="field"><label for="confirmPassword">
Confirm Password
</label><div class="password-box"><input
type="password"
id="confirmPassword"
placeholder="Enter password again"
required
minlength="8">

<button
type="button"
class="show-btn"
onclick="togglePassword('confirmPassword',this)">
Show
</button>

</div></div><button
type="submit"
class="register"
id="registerButton">

Create Account

</button></form><div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div></div>
</div><script>

/* ==========================================
   CLOUDFLARE WORKER API
========================================== */

const API_URL =
"https://shy-fog-1588.gateofheavensl1.workers.dev";


/* ==========================================
   ELEMENTS
========================================== */

const form =
document.getElementById("registerForm");

const message =
document.getElementById("message");

const button =
document.getElementById("registerButton");

const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirmPassword");

const strength =
document.getElementById("strength");


/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* ==========================================
   PASSWORD SHOW / HIDE
========================================== */

function togglePassword(id,btn){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        btn.textContent = "Hide";

    }else{

        input.type = "password";

        btn.textContent = "Show";

    }

}


/* ==========================================
   PASSWORD STRENGTH
========================================== */

password.addEventListener(
"input",
function(){

    const value =
        password.value;

    if(!value){

        strength.textContent =
            "Password strength: —";

        return;

    }

    let score = 0;

    if(value.length >= 8)
        score++;

    if(/[A-Z]/.test(value))
        score++;

    if(/[a-z]/.test(value))
        score++;

    if(/[0-9]/.test(value))
        score++;

    if(/[^A-Za-z0-9]/.test(value))
        score++;

    if(score <= 2){

        strength.textContent =
            "Password strength: Weak";

    }else if(score <= 4){

        strength.textContent =
            "Password strength: Medium";

    }else{

        strength.textContent =
            "Password strength: Strong";

    }

});


/* ==========================================
   REGISTER
========================================== */

form.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    message.style.display =
        "none";


    const firstName =
        document.getElementById(
            "firstName"
        ).value.trim();

    const lastName =
        document.getElementById(
            "lastName"
        ).value.trim();

    const email =
        document.getElementById(
            "email"
        ).value.trim().toLowerCase();

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();

    const passwordValue =
        password.value;

    const confirmValue =
        confirmPassword.value;


    /* --------------------------------------
       PASSWORD CHECK
    -------------------------------------- */

    if(passwordValue.length < 8){

        showMessage(
            "Password must contain at least 8 characters.",
            "error"
        );

        return;

    }


    if(passwordValue !== confirmValue){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    /* --------------------------------------
       BUTTON
    -------------------------------------- */

    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try{

        /* ----------------------------------
           SEND TO CLOUDFLARE WORKER
        ---------------------------------- */

        const response =
            await fetch(
                API_URL + "/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        first_name:
                            firstName,

                        last_name:
                            lastName,

                        email:
                            email,

                        phone:
                            phone,

                        password:
                            passwordValue

                    })

                }
            );


        const data =
            await response.json();


        /* ----------------------------------
           SUCCESS
        ---------------------------------- */

        if(response.ok && data.success){

            showMessage(
                "Account created successfully! Student ID: " +
                data.student_id,
                "success"
            );

            form.reset();

            strength.textContent =
                "Password strength: —";


            /* Optional redirect */

            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                1800
            );

        }else{

            showMessage(
                data.message ||
                "Registration failed.",
                "error"
            );

        }


    }catch(error){

        console.error(error);

        showMessage(
            "Unable to connect to the server. Please try again.",
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "Create Account";

});

</script></body>
</html>
