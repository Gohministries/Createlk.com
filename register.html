<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | CreateLK Academy</title>
<meta name="description" content="Create your CreateLK Academy student account."><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{background:linear-gradient(135deg,#eef4ff,#f4f7fc);min-height:100vh;color:#263238}
nav{background:#fff;padding:16px 6%;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.logo{font-size:22px;font-weight:800;color:#1565c0}
.container{max-width:500px;margin:55px auto;padding:20px}
.card{background:#fff;padding:35px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{text-align:center;color:#1565c0;margin-bottom:8px}
.subtitle{text-align:center;color:#68757c;margin-bottom:25px}
label{display:block;font-weight:600;margin:15px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccd5dc;border-radius:10px;font-size:15px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:25px;background:#1565c0;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.note{font-size:13px;color:#68757c;margin-top:15px;text-align:center}
.links{text-align:center;margin-top:20px}
.links a{color:#1565c0;text-decoration:none;font-weight:600}
.checkbox{display:flex;gap:8px;align-items:flex-start;margin-top:16px;font-size:13px;color:#68757c}
.checkbox input{width:auto;margin-top:4px}
</style></head><body><nav>
<div class="logo">📚 CreateLK Academy</div>
</nav><main class="container"><div class="card"><h1>Create Your Account</h1><p class="subtitle">
Create your student account to access your courses and membership.
</p><form id="registerForm"><label for="name">Full Name</label>
<input id="name" type="text" placeholder="Enter your full name" required>

<label for="email">Email Address</label>
<input id="email" type="email" placeholder="Enter your email" required>

<label for="phone">WhatsApp Number</label>
<input id="phone" type="tel" placeholder="+94 7XXXXXXXX" required>

<label for="password">Password</label>
<input id="password" type="password" placeholder="Create a password" minlength="8" required>

<label for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" type="password" placeholder="Confirm your password" minlength="8" required>

<div class="checkbox">
<input id="terms" type="checkbox" required>
<label for="terms">
I agree to the Terms & Conditions and Privacy Policy.
</label>
</div><button type="submit">Create Account</button>

</form><p id="message" class="note"></p><div class="links">
Already have an account?
<a href="login.html">Login</a>
</div><div class="links">
<a href="index.html">← Back to Academy</a>
</div></div></main><script>
document.getElementById("registerForm").addEventListener("submit", function(e){

e.preventDefault();

const password=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;
const message=document.getElementById("message");

if(password !== confirm){
message.textContent="Passwords do not match.";
message.style.color="#c62828";
return;
}

/*
  IMPORTANT:
  Do not store real passwords directly in HTML/localStorage.

  This form will later send the registration data to
  your Cloudflare Worker / backend.
*/

message.textContent="Registration system is ready to be connected to the Academy server.";
message.style.color="#1565c0";

});
</script></body>
</html>
