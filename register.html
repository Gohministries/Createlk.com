All Rights Reserved.

</p></footer><script>

/*
==================================================
CREATE LK ACADEMY — STUDENT REGISTRATION
==================================================
*/

const API =
"https://flat-queen-4e0b.gateofheavensl1.workers.dev";


const registerForm =
document.getElementById("registerForm");

const registerButton =
document.getElementById("registerButton");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const passwordStrength =
document.getElementById("passwordStrength");

const passwordSuggestion =
document.getElementById("passwordSuggestion");

const useSuggestion =
document.getElementById("useSuggestion");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");


/*
==================================================
SHOW / HIDE PASSWORD
==================================================
*/

showPassword.addEventListener(
    "click",
    function(){

        if(passwordInput.type === "password"){

            passwordInput.type = "text";
            showPassword.textContent = "Hide";

        }else{

            passwordInput.type = "password";
            showPassword.textContent = "Show";

        }

    }
);


showConfirmPassword.addEventListener(
    "click",
    function(){

        if(confirmPasswordInput.type === "password"){

            confirmPasswordInput.type = "text";
            showConfirmPassword.textContent = "Hide";

        }else{

            confirmPasswordInput.type = "password";
            showConfirmPassword.textContent = "Show";

        }

    }
);


/*
==================================================
GENERATE STRONG PASSWORD
==================================================
*/

function generateStrongPassword(){

    const uppercase =
        "ABCDEFGHJKLMNPQRSTUVWXYZ";

    const lowercase =
        "abcdefghijkmnopqrstuvwxyz";

    const numbers =
        "23456789";

    const symbols =
        "!@#$%^&*";

    const all =
        uppercase +
        lowercase +
        numbers +
        symbols;

    const randomValues =
        new Uint32Array(16);

    crypto.getRandomValues(
        randomValues
    );


    /*
    Guarantee at least one character
    from every required category.
    */

    let result =
        uppercase[randomValues[0] % uppercase.length] +
        lowercase[randomValues[1] % lowercase.length] +
        numbers[randomValues[2] % numbers.length] +
        symbols[randomValues[3] % symbols.length];


    for(
        let i = 4;
        i < 16;
        i++
    ){

        result +=
            all[
                randomValues[i] %
                all.length
            ];

    }


    /*
    Shuffle the password.
    */

    const chars =
        result.split("");


    for(
        let i = chars.length - 1;
        i > 0;
        i--
    ){

        const random =
            randomValues[i] %
            (i + 1);

        [
            chars[i],
            chars[random]
        ] =
        [
            chars[random],
            chars[i]
        ];

    }


    return chars.join("");

}


/*
==================================================
PASSWORD STRENGTH
==================================================
*/

function checkPasswordStrength(
    password
){

    if(!password){

        passwordStrength.textContent = "";
        return;

    }


    let score = 0;


    if(password.length >= 8)
        score++;

    if(password.length >= 12)
        score++;

    if(/[A-Z]/.test(password))
        score++;

    if(/[a-z]/.test(password))
        score++;

    if(/[0-9]/.test(password))
        score++;

    if(/[^A-Za-z0-9]/.test(password))
        score++;


    if(score <= 2){

        passwordStrength.textContent =
            "Password strength: Weak";

        passwordStrength.style.color =
            "#c62828";

    }
    else if(score <= 4){

        passwordStrength.textContent =
            "Password strength: Medium";

        passwordStrength.style.color =
            "#ef6c00";

    }
    else{

        passwordStrength.textContent =
            "Password strength: Strong";

        passwordStrength.style.color =
            "#00897b";

    }

}


passwordInput.addEventListener(
    "input",
    function(){

        checkPasswordStrength(
            passwordInput.value
        );

    }
);


/*
==================================================
USE STRONG PASSWORD SUGGESTION
==================================================
*/

useSuggestion.addEventListener(
    "click",
    function(){

        const suggestion =
            generateStrongPassword();


        passwordInput.value =
            suggestion;

        confirmPasswordInput.value =
            suggestion;


        passwordInput.type =
            "text";

        confirmPasswordInput.type =
            "text";


        showPassword.textContent =
            "Hide";

        showConfirmPassword.textContent =
            "Hide";


        passwordSuggestion.textContent =
            suggestion;


        checkPasswordStrength(
            suggestion
        );


        passwordInput.focus();

    }
);


/*
==================================================
REGISTRATION
==================================================
*/

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const firstName =
            document
            .getElementById("firstName")
            .value
            .trim();


        const lastName =
            document
            .getElementById("lastName")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        /*
        Validate passwords.
        */

        if(password !== confirmPassword){

            message.textContent =
                "Passwords do not match.";

            message.style.color =
                "#c62828";

            return;

        }


        if(password.length < 8){

            message.textContent =
                "Password must contain at least 8 characters.";

            message.style.color =
                "#c62828";

            return;

        }


        if(
            !/[A-Z]/.test(password) ||
            !/[a-z]/.test(password) ||
            !/[0-9]/.test(password) ||
            !/[^A-Za-z0-9]/.test(password)
        ){

            message.textContent =
                "Use uppercase, lowercase, numbers and a symbol.";

            message.style.color =
                "#c62828";

            return;

        }


        /*
        Disable button.
        */

        registerButton.disabled =
            true;

        registerButton.textContent =
            "Creating account...";

        message.textContent =
            "Please wait...";

        message.style.color =
            "#1565c0";


        try{

            const response =
                await fetch(
                    API + "/register",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                first_name:
                                    firstName,

                                last_name:
                                    lastName,

                                email:
                                    email,

                                phone:
                                    phone,

                                password:
                                    password

                            })

                    }
                );


            let data;


            try{

                data =
                    await response.json();

            }
            catch{

                throw new Error(
                    "Invalid response from the server."
                );

            }


            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Account creation failed."
                );

            }


            /*
            Registration successful.
            */

            message.textContent =
                "Account created successfully!";

            message.style.color =
                "#00897b";


            /*
            Never store the password.
            */

            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                1000
            );


        }
        catch(error){

            console.error(
                "Registration error:",
                error
            );


            message.textContent =
                error.message ||
                "Unable to create account.";

            message.style.color =
                "#c62828";


            registerButton.disabled =
                false;

            registerButton.textContent =
                "Create Account";

        }

    }
);

</script></body>
