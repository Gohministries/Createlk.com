</style></head><body><nav><div class="logo">

</p></footer><script>

/*
==================================================
CREATE LK ACADEMY — STUDENT REGISTRATION
==================================================
*/

const API =
"https://flat-queen-4e0b.gateofheavensl1.workers.dev";


const registerForm =
document.getElementById(
"registerForm"
);

const registerButton =
document.getElementById(
"registerButton"
);

const message =
document.getElementById(
"message"
);

const passwordInput =
document.getElementById(
"password"
);

const confirmPasswordInput =
document.getElementById(
"confirmPassword"
);

const passwordStrength =
document.getElementById(
"passwordStrength"
);

const passwordSuggestion =
document.getElementById(
"passwordSuggestion"
);

const useSuggestion =
document.getElementById(
"useSuggestion"
);

const showPassword =
document.getElementById(
"showPassword"
);

const showConfirmPassword =
document.getElementById(
"showConfirmPassword"
);


/*
==================================================
SHOW / HIDE PASSWORD
==================================================
*/

showPassword.addEventListener(
"click",
function(){

if(
passwordInput.type === "password"
){

passwordInput.type =
"text";

showPassword.textContent =
"Hide";

}else{

passwordInput.type =
"password";

showPassword.textContent =
"Show";

}

});


showConfirmPassword.addEventListener(
"click",
function(){

if(
confirmPasswordInput.type === "password"
){

confirmPasswordInput.type =
"text";

showConfirmPassword.textContent =
"Hide";

}else{

confirmPasswordInput.type =
"password";

showConfirmPassword.textContent =
"Show";

}

});


/*
==================================================
GENERATE STRONG PASSWORD
==================================================
*/

function generateStrongPassword(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ" +
"abcdefghijkmnopqrstuvwxyz" +
"23456789" +
"!@#$%^&*";

const array =
new Uint32Array(16);

crypto.getRandomValues(
array
);

let result = "";

for(
let i = 0;
i < array.length;
i++
){

result +=
chars[
array[i] %
chars.length
];

}

return result;

}


/*
==================================================
PASSWORD STRENGTH
==================================================
*/

function checkPasswordStrength(
password
){

if(!password){

passwordStrength.textContent =
"";

return;

}

let score = 0;

if(password.length >= 8)
score++;

if(password.length >= 12)
score++;

if(/[A-Z]/.test(password))
score++;

if(/[a-z]/.test(password))
score++;

if(/[0-9]/.test(password))
score++;

if(/[^A-Za-z0-9]/.test(password))
score++;


if(score <= 2){

passwordStrength.textContent =
"Password strength: Weak";

passwordStrength.style.color =
"#c62828";

}
else if(score <= 4){

passwordStrength.textContent =
"Password strength: Medium";

passwordStrength.style.color =
"#ef6c00";

}
else{

passwordStrength.textContent =
"Password strength: Strong";

passwordStrength.style.color =
"#00897b";

}

}


passwordInput.addEventListener(
"input",
function(){

checkPasswordStrength(
passwordInput.value
);

}
);


/*
==================================================
USE PASSWORD SUGGESTION
==================================================
*/

useSuggestion.addEventListener(
"click",
function(){

const suggestion =
generateStrongPassword();

passwordInput.value =
suggestion;

confirmPasswordInput.value =
suggestion;

passwordInput.type =
"text";

confirmPasswordInput.type =
"text";

showPassword.textContent =
"Hide";

showConfirmPassword.textContent =
"Hide";

passwordSuggestion.textContent =
suggestion;

checkPasswordStrength(
suggestion
);

passwordInput.focus();

}
);


/*
==================================================
REGISTRATION
==================================================
*/

registerForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


const firstName =
document
.getElementById(
"firstName"
)
.value
.trim();


const lastName =
document
.getElementById(
"lastName"
)
.value
.trim();


const email =
document
.getElementById(
"email"
)
.value
.trim()
.toLowerCase();


const phone =
document
.getElementById(
"phone"
)
.value
.trim();


const password =
passwordInput.value;


const confirmPassword =
confirmPasswordInput.value;


if(
password !==
confirmPassword
){

message.textContent =
"Passwords do not match.";

message.style.color =
"#c62828";

return;

}


if(
password.length < 8
){

message.textContent =
"Password must contain at least 8 characters.";

message.style.color =
"#c62828";

return;

}


if(
!/[A-Z]/.test(password) ||
!/[a-z]/.test(password) ||
!/[0-9]/.test(password) ||
!/[^A-Za-z0-9]/.test(password)
){

message.textContent =
"Please use uppercase, lowercase, numbers and a symbol.";

message.style.color =
"#c62828";

return;

}


registerButton.disabled =
true;

registerButton.textContent =
"Creating account...";

message.textContent =
"Please wait...";

message.style.color =
"#1565c0";


try{


const response =
await fetch(
API + "/register",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

first_name:
firstName,

last_name:
lastName,

email:
email,

phone:
phone,

password:
password

})

}
);


let data;

try{

data =
await response.json();

}catch{

throw new Error(
"Invalid response from the server."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Account creation failed."
);

}


message.textContent =
"Account created successfully!";

message.style.color =
"#00897b";


/*
Do not send or store the password
in the browser.
*/


setTimeout(
function(){

window.location.href =
"login.html";

},
1000
);


}
catch(error){

console.error(
"Registration error:",
error
);

message.textContent =
error.message ||
"Unable to create account.";

message.style.color =
"#c62828";

registerButton.disabled =
false;

registerButton.textContent =
"Create Account";

}

});

</script></body></html>
