<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Login | CreateLK Academy</title><meta name="description"
content="Log in to your CreateLK Academy student account.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
background:linear-gradient(
135deg,
#eef4ff,
#f4f7fc
);
min-height:100vh;
color:#263238;
}

nav{
background:#fff;
padding:16px 6%;
box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.logo{
font-size:22px;
font-weight:800;
color:#1565c0;
}

.container{
max-width:500px;
margin:55px auto;
padding:20px;
}

.card{
background:#fff;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
text-align:center;
color:#1565c0;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#68757c;
margin-bottom:25px;
}

label{
display:block;
font-weight:600;
margin:15px 0 6px;
}

input{
width:100%;
padding:13px;
border:1px solid #ccd5dc;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#1565c0;
box-shadow:0 0 0 3px rgba(21,101,192,.1);
}

button{
width:100%;
margin-top:22px;
padding:14px;
border:0;
border-radius:25px;
background:#1565c0;
color:#fff;
font-size:16px;
font-weight:700;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

button:disabled{
opacity:.65;
cursor:not-allowed;
}

.message{
font-size:14px;
margin-top:15px;
text-align:center;
font-weight:600;
}

.links{
text-align:center;
margin-top:20px;
}

.links a{
color:#1565c0;
text-decoration:none;
font-weight:600;
}

.links a:hover{
text-decoration:underline;
}

.info{
margin-top:25px;
padding:15px;
background:#e3f2fd;
border-radius:12px;
color:#1565c0;
font-size:13px;
text-align:center;
}

footer{
text-align:center;
color:#68757c;
font-size:13px;
padding:25px;
}

</style></head><body><nav><div class="logo">
📚 CreateLK Academy
</div></nav><main class="container"><div class="card"><h1>
Student Login
</h1><p class="subtitle">
Sign in to access your CreateLK Academy account.
</p><form id="loginForm"><label for="email">
Email Address
</label><input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required

«»

<label for="password">
Password
</label><input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required

«»

<button
id="loginButton"
type="submit">

Login

</button></form><div
id="message"
class="message">
</div><div class="links"><a href="register.html">
Create an account
</a></div><div class="links"><a href="forgot-password.html">
Forgot your password?
</a></div><div class="links"><a href="index.html">
← Back to Academy
</a></div><div class="info">🔐 Your login will be securely verified by
the CreateLK Academy server.

</div></div></main><footer>© 2026 CreateLK Academy

</footer><script>

const API_URL =
"https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";


document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

e.preventDefault();


const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();


const password =
document
.getElementById("password")
.value;


const message =
document
.getElementById("message");


const button =
document
.getElementById("loginButton");


if(!email || !password){

message.textContent =
"Please enter your email and password.";

message.style.color =
"#c62828";

return;

}


button.disabled = true;

button.textContent =
"Signing in...";

message.textContent =
"";


try{

/*
  Cloudflare Worker endpoint.

  We will create this endpoint later:

  POST /api/login

  The server will verify the password and
  return a secure authentication session.
*/


const response =
await fetch(
API_URL + "/api/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:email,

password:password

})

}
);


const data =
await response.json();


if(
data.success &&
data.token
){

/*
  Temporary session storage.

  Later we can replace this with
  an HttpOnly Secure cookie from
  the Cloudflare Worker.
*/

sessionStorage.setItem(
"createLK_session",
data.token
);


message.textContent =
"✅ Login successful. Redirecting...";

message.style.color =
"#00897b";


setTimeout(function(){

window.location.href =
"dashboard.html";

},700);


}else{

message.textContent =
data.message ||
"Invalid email or password.";

message.style.color =
"#c62828";

}

}catch(error){

console.error(error);

message.textContent =
"Unable to connect to the server. Please try again.";

message.style.color =
"#c62828";

}


button.disabled = false;

button.textContent =
"Login";

});

</script></body></html>
