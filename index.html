<script>
"use strict";

const API_URL =
"https://cool-resonance-7780.gateofheavensl1.workers.dev";

function getStudent(){
    const saved = localStorage.getItem("createlk_student");

    if(!saved) return null;

    try{
        const student = JSON.parse(saved);

        if(student && student.id){
            return student;
        }
    }catch(error){
        localStorage.removeItem("createlk_student");
    }

    return null;
}

function updatePage(){

    const student = getStudent();

    const loginNav = document.getElementById("loginNav");
    const registerNav = document.getElementById("registerNav");
    const studentNav = document.getElementById("studentNav");

    const heroRegister = document.getElementById("heroRegister");
    const heroDashboard = document.getElementById("heroDashboard");

    const createBtn = document.getElementById("createBtn");
    const loginBtn = document.getElementById("loginBtn");
    const dashboardBtn = document.getElementById("dashboardBtn");

    const studentName = document.getElementById("studentName");
    const membershipBtn = document.getElementById("membershipBtn");

    if(!student){

        loginNav.style.display = "list-item";
        registerNav.style.display = "list-item";
        studentNav.style.display = "none";

        heroRegister.style.display = "inline-block";
        heroDashboard.style.display = "none";

        createBtn.style.display = "inline-block";
        loginBtn.style.display = "inline-block";
        dashboardBtn.style.display = "none";

        membershipBtn.href = "register.html";

        return;
    }

    loginNav.style.display = "none";
    registerNav.style.display = "none";
    studentNav.style.display = "flex";

    heroRegister.style.display = "none";
    heroDashboard.style.display = "inline-block";

    createBtn.style.display = "none";
    loginBtn.style.display = "none";
    dashboardBtn.style.display = "inline-block";

    studentName.textContent =
        "👤 " + (student.first_name || "Student");

    membershipBtn.href = "dashboard.html";
}

function logout(){

    localStorage.removeItem("createlk_student");

    window.location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", function(){

    const logoutBtn =
        document.getElementById("logoutBtn");

    if(logoutBtn){
        logoutBtn.addEventListener("click", logout);
    }

    updatePage();
});
</script>
