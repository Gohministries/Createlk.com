<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Payment Approval | CreateLK Academy</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    background:#f5f8fc;
    color:#172033;
    min-height:100vh;
}

header{
    background:#174ea6;
    color:white;
    padding:18px 20px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px 60px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:30px;
}

.login-card{
    max-width:500px;
    margin:20px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 30px #0001;
}

label{
    display:block;
    font-weight:700;
    margin-top:15px;
}

input{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.login-button{
    width:100%;
    margin-top:20px;
    background:#174ea6;
    color:white;
}

.logout{
    background:white;
    color:#174ea6;
}

.admin-content{
    display:none;
}

.payment-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.payment-card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 30px #0001;
}

.payment-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.status{
    background:#fff4d6;
    color:#946200;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.detail{
    padding:10px 0;
    border-bottom:1px solid #edf0f4;
}

.detail-label{
    display:block;
    color:#667085;
    font-size:13px;
    margin-bottom:3px;
}

.detail-value{
    display:block;
    font-weight:700;
    word-break:break-word;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.receipt-button{
    background:#475569;
    color:white;
}

.approve-button{
    background:#15803d;
    color:white;
}

.reject-button{
    background:#dc2626;
    color:white;
}

.refresh-button{
    background:#174ea6;
    color:white;
    margin-bottom:20px;
}

.message{
    padding:14px;
    border-radius:10px;
    margin:15px 0;
    font-weight:700;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.loading,
.empty{
    background:white;
    padding:35px;
    border-radius:18px;
    text-align:center;
    color:#667085;
}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
    }

    .actions{
        flex-direction:column;
    }

    .actions button{
        width:100%;
    }

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
📚 CreateLK Academy — Admin
</div>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

</header>


<main class="container">

<h1>
🏦 Payment Approval
</h1>

<p class="subtitle">
Review payment slips and activate Premium membership.
</p>


<div
id="loginCard"
class="login-card">

<h2>
🔐 Admin Login
</h2>

<label>
Admin Key
</label>

<input
type="password"
id="adminKey"
placeholder="Enter admin key">

<button
class="login-button"
onclick="login()">
🔐 Login
</button>

<div id="loginMessage"></div>

</div>


<div
id="adminContent"
class="admin-content">

<button
class="refresh-button"
onclick="loadPayments()">
🔄 Refresh Payments
</button>

<div id="payments"></div>

</div>

</main>


<script>

"use strict";


const WORKER =
"https://approve.gateofheavensl1.workers.dev";


let ADMIN_KEY = "";


/* =====================================
   LOGIN
===================================== */

async function login(){

    const key =
        document
        .getElementById("adminKey")
        .value
        .trim();

    const message =
        document
        .getElementById("loginMessage");


    if(!key){

        message.className =
        "message error";

        message.textContent =
        "Please enter your admin key.";

        return;
    }


    ADMIN_KEY = key;


    try{

        const response =
        await fetch(WORKER + "/");


        const data =
        await response.json();


        if(
            data.success &&
            data.database &&
            data.receipt_bucket &&
            data.admin_key
        ){

            document
            .getElementById("loginCard")
            .style.display="none";


            document
            .getElementById("adminContent")
            .style.display="block";


            loadPayments();

        }else{

            ADMIN_KEY="";

            message.className =
            "message error";

            message.textContent =
            "Approval Worker is not configured correctly.";

        }

    }catch(error){

        ADMIN_KEY="";

        message.className =
        "message error";

        message.textContent =
        "Unable to connect to Approval Worker.";

    }

}


/* =====================================
   LOAD PAYMENTS
===================================== */

async function loadPayments(){

    const container =
        document.getElementById("payments");


    container.innerHTML =
    `
    <div class="loading">
        ⏳ Loading pending payments...
    </div>
    `;


    try{

        const response =
        await fetch(
            WORKER +
            "/payments?status=pending",
            {
                headers:{
                    "Authorization":
                    "Bearer " + ADMIN_KEY
                }
            }
        );


        const data =
        await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load payments."
            );
        }


        const payments =
            data.payments || [];


        if(!payments.length){

            container.innerHTML =
            `
            <div class="empty">
                ✅ No pending payments.
            </div>
            `;

            return;
        }


        container.innerHTML =
        `
        <div class="payment-grid">
            ${payments
                .map(createCard)
                .join("")}
        </div>
        `;


    }catch(error){

        container.innerHTML =
        `
        <div class="message error">
            ${escapeHtml(error.message)}
        </div>
        `;

    }

}


/* =====================================
   PAYMENT CARD
===================================== */

function createCard(payment){

    return `

    <div class="payment-card">

        <div class="payment-header">

            <h2>
                Payment #${payment.id}
            </h2>

            <span class="status">
                ${escapeHtml(
                    payment.status.toUpperCase()
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Student Email
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.student_email || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Sender Name
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.sender_name || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Bank
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.sender_bank || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Branch
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.branch || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Account
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.sender_account || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Amount
            </span>

            <span class="detail-value">
                LKR ${Number(
                    payment.amount || 0
                ).toLocaleString()}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Submitted
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.created_at || "-"
                )}
            </span>

        </div>


        <div class="actions">

            <button
            class="receipt-button"
            onclick="viewReceipt(${payment.id})">

                🧾 View Slip

            </button>


            <button
            class="approve-button"
            onclick="approvePayment(${payment.id})">

                ✅ Approve — Activate 30 Days

            </button>


            <button
            class="reject-button"
            onclick="rejectPayment(${payment.id})">

                ❌ Reject

            </button>

        </div>

    </div>

    `;
}


/* =====================================
   VIEW SLIP
===================================== */

async function viewReceipt(id){

    try{

        const response =
        await fetch(
            WORKER +
            "/receipt/" +
            id,
            {
                headers:{
                    "Authorization":
                    "Bearer " + ADMIN_KEY
                }
            }
        );


        if(!response.ok){

            const text =
                await response.text();

            throw new Error(
                text ||
                "Unable to open slip."
            );
        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(blob);


        window.open(
            url,
            "_blank"
        );


    }catch(error){

        alert(
            "❌ Unable to view slip:\n\n" +
            error.message
        );

    }

}


/* =====================================
   APPROVE
===================================== */

async function approvePayment(id){

    const confirmed =
    confirm(
        "Approve this payment?\n\n" +
        "This will activate Premium for 30 days."
    );


    if(!confirmed){
        return;
    }


    try{

        const response =
        await fetch(
            WORKER + "/approve",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + ADMIN_KEY
                },

                body:JSON.stringify({
                    payment_id:id
                })
            }
        );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Approval failed."
            );
        }


        alert(
            "✅ Payment approved!\n\n" +
            "Student: " +
            data.student_email +
            "\n\n" +
            "Premium: ACTIVE" +
            "\n30 Days" +
            "\nExpires: " +
            data.membership_expiry
        );


        loadPayments();


    }catch(error){

        alert(
            "❌ Approval failed:\n\n" +
            error.message
        );

    }

}


/* =====================================
   REJECT
===================================== */

async function rejectPayment(id){

    const reason =
        prompt(
            "Reason for rejection:"
        );


    if(reason === null){
        return;
    }


    try{

        const response =
        await fetch(
            WORKER + "/reject",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + ADMIN_KEY
                },

                body:JSON.stringify({
                    payment_id:id,
                    admin_note:
                    reason.trim()
                })
            }
        );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Rejection failed."
            );
        }


        alert(
            "❌ Payment rejected."
        );


        loadPayments();


    }catch(error){

        alert(
            "❌ Rejection failed:\n\n" +
            error.message
        );

    }

}


/* =====================================
   LOGOUT
===================================== */

function logout(){

    ADMIN_KEY="";

    location.reload();

}


/* =====================================
   ESCAPE
===================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>

</html>
