<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Payment Approval | CreateLK Academy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    background:#f5f8fc;
    color:#172033;
    min-height:100vh;
}

header{
    background:#174ea6;
    color:white;
    padding:18px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px 60px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:30px;
}

.login-card{
    max-width:500px;
    margin:20px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login-card h2{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:700;
    margin-top:15px;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.login-button{
    width:100%;
    margin-top:20px;
    background:#174ea6;
    color:white;
}

.logout{
    background:white;
    color:#174ea6;
}

.payment-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.payment-card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.payment-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.status{
    background:#fff4d6;
    color:#946200;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.detail{
    padding:10px 0;
    border-bottom:1px solid #edf0f4;
}

.detail:last-child{
    border-bottom:0;
}

.detail-label{
    display:block;
    color:#667085;
    font-size:13px;
    margin-bottom:3px;
}

.detail-value{
    display:block;
    font-weight:700;
    word-break:break-word;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.receipt-button{
    background:#475569;
    color:white;
}

.approve-button{
    background:#15803d;
    color:white;
}

.reject-button{
    background:#dc2626;
    color:white;
}

.refresh-button{
    background:#174ea6;
    color:white;
    margin-bottom:20px;
}

.message{
    display:none;
    padding:14px;
    border-radius:10px;
    margin:15px 0;
    font-weight:700;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.loading{
    background:white;
    padding:35px;
    border-radius:18px;
    text-align:center;
    color:#667085;
}

.empty{
    background:white;
    padding:35px;
    border-radius:18px;
    text-align:center;
    color:#667085;
}

.admin-content{
    display:none;
}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
    }

    .actions{
        flex-direction:column;
    }

    .actions button{
        width:100%;
    }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<div class="logo">
📚 CreateLK Academy — Admin
</div>

<button
    class="logout"
    onclick="logout()">

Logout

</button>

</div>

</header>


<main class="container">


<h1>
🏦 Payment Approval
</h1>

<p class="subtitle">
Review bank payments and activate Premium membership.
</p>


<!-- LOGIN -->

<div
    id="loginCard"
    class="login-card">

<h2>
🔐 Admin Login
</h2>

<label for="adminKey">
ADMIN KEY
</label>

<input
    type="password"
    id="adminKey"
    placeholder="Enter your admin key">

<button
    class="login-button"
    onclick="login()">

🔐 Login

</button>

<div
    id="loginMessage"
    class="message">
</div>

</div>


<!-- ADMIN CONTENT -->

<div
    id="adminContent"
    class="admin-content">

<div
    id="pageMessage"
    class="message">
</div>


<button
    class="refresh-button"
    onclick="loadPayments()">

🔄 Refresh Payments

</button>


<div
    id="payments"
    class="payment-grid">

</div>

</div>


</main>


<script>

"use strict";


/* =====================================
   CONFIGURATION
===================================== */

const APPROVE_WORKER =
    "https://approve.gateofheavensl1.workers.dev";


let ADMIN_KEY = "";


/* =====================================
   LOGIN
===================================== */

async function login(){

    const input =
        document.getElementById(
            "adminKey"
        );

    const message =
        document.getElementById(
            "loginMessage"
        );


    const key =
        input.value.trim();


    if(!key){

        message.className =
            "message error";

        message.textContent =
            "Please enter your admin key.";

        return;

    }


    ADMIN_KEY = key;


    try{

        const response =
            await fetch(
                APPROVE_WORKER + "/",
                {
                    method:"GET"
                }
            );


        const data =
            await response.json();


        if(
            response.ok &&
            data.success &&
            data.database &&
            data.admin_key
        ){

            document
                .getElementById(
                    "loginCard"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "adminContent"
                )
                .style.display =
                "block";


            loadPayments();

        }
        else{

            ADMIN_KEY = "";

            message.className =
                "message error";

            message.textContent =
                "Approval Worker is not configured correctly.";

        }

    }
    catch(error){

        console.error(error);

        ADMIN_KEY = "";

        message.className =
            "message error";

        message.textContent =
            "Unable to connect to Approval Worker.";

    }

}


/* =====================================
   LOAD PENDING PAYMENTS
===================================== */

async function loadPayments(){

    const container =
        document.getElementById(
            "payments"
        );


    container.innerHTML =
        `
        <div class="loading">
            ⏳ Loading pending payments...
        </div>
        `;


    try{

        const response =
            await fetch(
                APPROVE_WORKER +
                "/payments?status=pending",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            ADMIN_KEY
                    }
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Could not load payments."
            );

        }


        const payments =
            data.payments || [];


        if(
            payments.length === 0
        ){

            container.innerHTML =
                `
                <div class="empty">
                    ✅ No pending payments.
                </div>
                `;

            return;

        }


        container.innerHTML =
            payments
            .map(
                createPaymentCard
            )
            .join("");


    }
    catch(error){

        console.error(error);

        container.innerHTML =
            `
            <div class="message error">
                ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/* =====================================
   PAYMENT CARD
===================================== */

function createPaymentCard(payment){

    const amount =
        Number(
            payment.amount || 0
        ).toLocaleString();


    return `

    <div class="payment-card">

        <div class="payment-header">

            <h2>
                Payment #${payment.id}
            </h2>

            <span class="status">
                PENDING
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Student Email
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.student_email || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Sender Name
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.sender_name || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Sender Bank
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.sender_bank || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Sender Account
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.sender_account || "-"
                )}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Amount
            </span>

            <span class="detail-value">
                LKR ${amount}
            </span>

        </div>


        <div class="detail">

            <span class="detail-label">
                Submitted
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    payment.created_at || "-"
                )}
            </span>

        </div>


        <div class="actions">

            <button
                class="receipt-button"
                onclick="viewReceipt(
                    ${payment.id}
                )">

                🧾 View Slip

            </button>


            <button
                class="approve-button"
                onclick="approvePayment(
                    ${payment.id}
                )">

                ✅ Approve — Activate 30 Days

            </button>


            <button
                class="reject-button"
                onclick="rejectPayment(
                    ${payment.id}
                )">

                ❌ Reject

            </button>

        </div>

    </div>

    `;

}


/* =====================================
   VIEW RECEIPT
===================================== */

async function viewReceipt(id){

    try{

        const response =
            await fetch(
                APPROVE_WORKER +
                "/receipt/" +
                id,
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            ADMIN_KEY
                    }
                }
            );


        if(!response.ok){

            const text =
                await response.text();

            throw new Error(
                text ||
                "Unable to open receipt."
            );

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(
                blob
            );


        window.open(
            url,
            "_blank"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Unable to view receipt:\n\n" +
            error.message
        );

    }

}


/* =====================================
   APPROVE PAYMENT
===================================== */

async function approvePayment(id){

    const confirmed =
        confirm(
            "Approve this payment?\n\n" +
            "Premium access will be activated " +
            "for 30 days."
        );


    if(!confirmed){
        return;
    }


    try{

        const response =
            await fetch(
                APPROVE_WORKER +
                "/approve",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            ADMIN_KEY
                    },

                    body:
                        JSON.stringify({
                            payment_id:id
                        })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Payment approval failed."
            );

        }


        alert(
            "✅ Payment approved successfully!\n\n" +
            "Student: " +
            data.student_email +
            "\n\n" +
            "Premium status: ACTIVE\n" +
            "Expiry: " +
            data.membership_expiry
        );


        loadPayments();


    }
    catch(error){

        console.error(error);

        alert(
            "❌ Approval failed:\n\n" +
            error.message
        );

    }

}


/* =====================================
   REJECT PAYMENT
===================================== */

async function rejectPayment(id){

    const note =
        prompt(
            "Enter the reason for rejection:"
        );


    if(note === null){
        return;
    }


    try{

        const response =
            await fetch(
                APPROVE_WORKER +
                "/reject",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            ADMIN_KEY
                    },

                    body:
                        JSON.stringify({
                            payment_id:id,
                            admin_note:
                                note.trim()
                        })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Payment rejection failed."
            );

        }


        alert(
            "❌ Payment rejected."
        );


        loadPayments();


    }
    catch(error){

        console.error(error);

        alert(
            "❌ Rejection failed:\n\n" +
            error.message
        );

    }

}


/* =====================================
   LOGOUT
===================================== */

function logout(){

    ADMIN_KEY = "";

    location.reload();

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
