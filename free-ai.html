<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK AI English Tutor | CreateLK Academy</title>

<style>
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}

body{
margin:0;
background:#f5f8ff;
color:#172033
}

header{
background:#174ea6;
color:#fff;
padding:16px 20px;
text-align:center;
font-size:20px;
font-weight:800
}

main{
max-width:700px;
margin:auto;
padding:25px 15px
}

.card{
background:#fff;
border-radius:20px;
padding:25px;
box-shadow:0 7px 25px #00000012
}

h1{
margin:0 0 8px;
font-size:27px;
color:#174ea6
}

.subtitle{
color:#667085;
margin-bottom:20px
}

textarea{
width:100%;
height:140px;
resize:none;
border:1px solid #d0d5dd;
border-radius:12px;
padding:14px;
font-size:15px;
outline:none
}

textarea:focus{
border-color:#174ea6;
box-shadow:0 0 0 3px #174ea61a
}

button{
width:100%;
margin-top:12px;
padding:14px;
border:0;
border-radius:10px;
background:#174ea6;
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.answer{
display:none;
margin-top:20px;
background:#f5f8ff;
border-radius:12px;
padding:16px;
line-height:1.7;
white-space:pre-wrap
}

.usage{
text-align:center;
margin-top:12px;
font-size:13px;
color:#667085
}

.back{
display:block;
text-align:center;
margin-top:18px;
color:#174ea6;
font-weight:700;
text-decoration:none
}

.error{
color:#b42318;
background:#fef3f2
}
</style>
</head>

<body>

<header>
📚 CreateLK Academy
</header>

<main>

<div class="card">

<h1>🤖 CreateLK AI English Tutor</h1>

<p class="subtitle">
Practise English with your free AI tutor.
Ask questions, check grammar, improve vocabulary
and practise conversation.
</p>

<textarea
id="question"
placeholder="Ask anything about English...

Example:
Explain the difference between 'has' and 'have'.">
</textarea>

<button id="askBtn">
🤖 Ask AI
</button>

<div class="usage" id="usage">
Free AI available
</div>

<div class="answer" id="answer"></div>

<a href="dashboard.html" class="back">
← Back to Dashboard
</a>

</div>

</main>

<script>
"use strict";

const API =
"https://free.gateofheavensl1.workers.dev";

const saved =
localStorage.getItem("createlk_student");

if(!saved){
location.href="login.html";
throw new Error("Not logged in");
}

let student;

try{
student=JSON.parse(saved);
}catch(e){
localStorage.removeItem("createlk_student");
location.href="login.html";
throw new Error("Invalid student");
}

if(!student || !student.id || !student.email){
localStorage.removeItem("createlk_student");
location.href="login.html";
throw new Error("Invalid account");
}

const email=student.email;

const question=
document.getElementById("question");

const askBtn=
document.getElementById("askBtn");

const answer=
document.getElementById("answer");

const usage=
document.getElementById("usage");


askBtn.addEventListener("click",askAI);


question.addEventListener("keydown",function(e){

if(e.key==="Enter" && e.ctrlKey){
askAI();
}

});


async function askAI(){

const q=question.value.trim();

if(!q){
alert("Please enter your English question.");
return;
}

askBtn.disabled=true;
askBtn.textContent="⏳ AI is thinking...";

answer.style.display="none";
answer.classList.remove("error");

try{

const response=await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
question:q
})
});

const data=await response.json();

if(!response.ok || !data.success){

throw new Error(
data.message ||
"Unable to contact AI."
);

}

answer.textContent=
data.answer ||
"No answer received.";

answer.style.display="block";

if(data.remaining!==undefined){

usage.textContent=
"🤖 Free AI questions remaining today: "
+data.remaining;

}

question.value="";

}catch(error){

answer.textContent=
"❌ "+error.message;

answer.classList.add("error");
answer.style.display="block";

}

askBtn.disabled=false;
askBtn.textContent="🤖 Ask AI";

}
</script>

</body>
</html>
