<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Premium Payment | CreateLK Academy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f7ff;
    padding:20px;
}

.container{
    max-width:600px;
    margin:30px auto;
}

.card{
    background:#fff;
    padding:28px;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:800;
    color:#174ea6;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:25px;
}

.price{
    text-align:center;
    background:#fff8e8;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.price h2{
    color:#c47a00;
    font-size:30px;
}

.bank{
    background:#f4f7ff;
    padding:20px;
    border-radius:14px;
    margin-bottom:22px;
}

.bank h3{
    margin-bottom:14px;
    color:#174ea6;
}

.bank p{
    margin:8px 0;
    line-height:1.5;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d5d9e0;
    border-radius:10px;
    font-size:15px;
}

.submit{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#174ea6;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.submit:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
    text-align:center;
}

.success{
    background:#e8f7ed;
    color:#176b35;
}

.error{
    background:#fdeaea;
    color:#a32121;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#174ea6;
    text-decoration:none;
    font-weight:600;
}

.student{
    background:#eef4ff;
    color:#174ea6;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
📚 CreateLK Academy
</div>

<div class="subtitle">
⭐ Premium Membership
</div>


<div
    class="student"
    id="studentInfo">

Loading student...

</div>


<div class="price">

<h2>
LKR 1,500
</h2>

<p>
30 Days Premium Access
</p>

</div>


<div class="bank">

<h3>
🏦 Bank Deposit Details
</h3>

<p>
<strong>Bank:</strong>
People's Bank
</p>

<p>
<strong>Branch:</strong>
Udapussellawa
</p>

<p>
<strong>Account No:</strong>
292200280023178
</p>

<p>
<strong>Account Name:</strong>
Thinarathnam Saththiyanadan
</p>

</div>


<div
    id="message"
    class="message">
</div>


<form
    id="paymentForm">


<div class="field">

<label>
Payment Reference
</label>

<input
    type="text"
    id="paymentReference"
    name="payment_reference"
    placeholder="Enter bank transaction/reference number"
    required>

</div>


<div class="field">

<label>
Upload Payment Receipt
</label>

<input
    type="file"
    id="receipt"
    name="receipt"
    accept="image/jpeg,image/png,image/webp,application/pdf"
    required>

</div>


<button
    type="submit"
    class="submit"
    id="submitButton">

Submit Payment for Approval

</button>

</form>


<div class="back">

<a href="dashboard.html">
← Back to Dashboard
</a>

</div>

</div>

</div>


<script>

"use strict";


const API_URL =
"https://cool-resonance-7780.gateofheavensl1.workers.dev";


const form =
document.getElementById(
    "paymentForm"
);

const message =
document.getElementById(
    "message"
);

const button =
document.getElementById(
    "submitButton"
);

const studentInfo =
document.getElementById(
    "studentInfo"
);


/* =====================================
   GET STUDENT
===================================== */

function getStudent(){

    const saved =
        localStorage.getItem(
            "createlk_student"
        );

    if(!saved){

        window.location.href =
            "login.html";

        return null;
    }

    try{

        const student =
            JSON.parse(saved);

        if(
            student &&
            student.id
        ){

            return student;
        }

    }catch(error){

        localStorage.removeItem(
            "createlk_student"
        );
    }

    window.location.href =
        "login.html";

    return null;
}


const student =
getStudent();


if(student){

    studentInfo.innerHTML =
        "👤 <strong>" +
        (
            student.first_name ||
            "Student"
        ) +
        "</strong><br>" +
        (
            student.email ||
            ""
        );

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =====================================
   SUBMIT PAYMENT
===================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!student){

            return;
        }


        const receipt =
            document.getElementById(
                "receipt"
            ).files[0];


        const paymentReference =
            document.getElementById(
                "paymentReference"
            ).value.trim();


        if(!paymentReference){

            showMessage(
                "Please enter your payment reference.",
                "error"
            );

            return;
        }


        if(!receipt){

            showMessage(
                "Please upload your payment receipt.",
                "error"
            );

            return;
        }


        if(
            receipt.size >
            5 * 1024 * 1024
        ){

            showMessage(
                "Receipt must be smaller than 5 MB.",
                "error"
            );

            return;
        }


        button.disabled =
            true;

        button.textContent =
            "Uploading Receipt...";


        try{

            const formData =
                new FormData();


            formData.append(
                "student_id",
                student.id
            );


            formData.append(
                "amount",
                "1500"
            );


            formData.append(
                "payment_reference",
                paymentReference
            );


            formData.append(
                "receipt",
                receipt
            );


            const response =
                await fetch(
                    API_URL +
                    "/api/premium/payment",
                    {
                        method:"POST",
                        body:formData
                    }
                );


            const data =
                await response.json();


            if(!response.ok ||
               data.success !== true){

                showMessage(
                    data.message ||
                    "Payment submission failed.",
                    "error"
                );

                button.disabled =
                    false;

                button.textContent =
                    "Submit Payment for Approval";

                return;
            }


            showMessage(
                "Payment submitted successfully! Your Premium membership is waiting for admin approval.",
                "success"
            );


            button.textContent =
                "Payment Submitted ✓";


            button.disabled =
                true;


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                2500
            );


        }catch(error){

            console.error(error);

            showMessage(
                "Could not connect to the payment server.",
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "Submit Payment for Approval";

        }

    }
);

</script>

</body>
</html>
