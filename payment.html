"use strict";


/* =====================================
   CLOUDFLARE WORKER
===================================== */

const API_URL =
"https://cool-resonance-7780.gateofheavensl1.workers.dev";


/* =====================================
   GET STUDENT
===================================== */

function getStudent(){

    const saved =
        localStorage.getItem(
            "createlk_student"
        );


    if(!saved){

        window.location.href =
            "login.html";

        return null;

    }


    try{

        const student =
            JSON.parse(saved);


        if(
            !student ||
            !student.id
        ){

            window.location.href =
                "login.html";

            return null;

        }


        return student;

    }

    catch(error){

        localStorage.removeItem(
            "createlk_student"
        );


        window.location.href =
            "login.html";

        return null;

    }

}


/* =====================================
   LOAD STUDENT
===================================== */

const student =
getStudent();


if(student){

    document.getElementById(
        "studentName"
    ).textContent =

        (
            student.first_name ||
            "Student"
        ) +

        " " +

        (
            student.last_name ||
            ""
        );


    document.getElementById(
        "studentEmail"
    ).textContent =
        student.email || "";

}


/* =====================================
   ELEMENTS
===================================== */

const form =
document.getElementById(
    "paymentForm"
);

const button =
document.getElementById(
    "submitButton"
);

const message =
document.getElementById(
    "message"
);


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================
   PAYMENT SUBMISSION
===================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!student){

            window.location.href =
                "login.html";

            return;

        }


        const reference =
            document
            .getElementById(
                "reference"
            )
            .value
            .trim();


        const receipt =
            document
            .getElementById(
                "receipt"
            )
            .files[0];


        /* =========================
           VALIDATE REFERENCE
        ========================= */

        if(!reference){

            showMessage(

                "Please enter your payment reference.",

                "error"

            );

            return;

        }


        /* =========================
           VALIDATE RECEIPT
        ========================= */

        if(!receipt){

            showMessage(

                "Please upload your payment receipt.",

                "error"

            );

            return;

        }


        /* =========================
           FILE SIZE
        ========================= */

        if(
            receipt.size >
            5 * 1024 * 1024
        ){

            showMessage(

                "Receipt must be smaller than 5 MB.",

                "error"

            );

            return;

        }


        /* =========================
           FILE TYPE
        ========================= */

        const allowedTypes = [

            "image/jpeg",

            "image/png",

            "image/webp",

            "application/pdf"

        ];


        if(
            !allowedTypes.includes(
                receipt.type
            )
        ){

            showMessage(

                "Please upload JPG, PNG, WEBP or PDF.",

                "error"

            );

            return;

        }


        /* =========================
           DISABLE BUTTON
        ========================= */

        button.disabled =
            true;

        button.textContent =
            "Uploading receipt...";


        try{


            /* =========================
               FORM DATA
            ========================= */

            const formData =
                new FormData();


            formData.append(

                "student_id",

                String(
                    student.id
                )

            );


            formData.append(

                "amount",

                "1500"

            );


            formData.append(

                "payment_reference",

                reference

            );


            formData.append(

                "receipt",

                receipt

            );


            /* =========================
               WORKER API
            ========================= */

            const response =
                await fetch(

                    API_URL +
                    "/api/premium/payment",

                    {

                        method:
                            "POST",

                        body:
                            formData

                    }

                );


            /* =========================
               RESPONSE TEXT
            ========================= */

            const text =
                await response.text();


            let data;


            try{

                data =
                    JSON.parse(text);

            }

            catch(error){

                showMessage(

                    "Server response: " +
                    text,

                    "error"

                );


                button.disabled =
                    false;


                button.textContent =
                    "💳 Submit Payment for Approval";


                return;

            }


            /* =========================
               API ERROR
            ========================= */

            if(
                !response.ok ||
                data.success !== true
            ){

                showMessage(

                    data.message ||
                    "Payment submission failed.",

                    "error"

                );


                button.disabled =
                    false;


                button.textContent =
                    "💳 Submit Payment for Approval";


                return;

            }


            /* =========================
               SUCCESS
            ========================= */

            showMessage(

                "✅ Payment submitted successfully. Your payment is waiting for admin approval.",

                "success"

            );


            button.textContent =
                "✅ Payment Submitted";


            button.disabled =
                true;


            document.getElementById(
                "reference"
            ).disabled =
                true;


            document.getElementById(
                "receipt"
            ).disabled =
                true;


        }

        catch(error){

            console.error(
                "PAYMENT ERROR:",
                error
            );


            showMessage(

                "Could not connect to CreateLK Academy payment server.",

                "error"

            );


            button.disabled =
                false;


            button.textContent =
                "💳 Submit Payment for Approval";

        }

    }

);
