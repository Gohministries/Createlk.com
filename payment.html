<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CreateLK Academy | Premium Membership</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 45px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    color:#1769ff;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.plan{
    background:#f1f6ff;
    border:1px solid #dce8ff;
    border-radius:16px;
    padding:20px;
    text-align:center;
    margin-bottom:25px;
}

.plan h2{
    color:#1769ff;
    margin-bottom:8px;
}

.price{
    font-size:32px;
    font-weight:800;
    color:#111;
}

.duration{
    color:#666;
    margin-top:5px;
}

.input-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
    color:#333;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d5dbe5;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#1769ff;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#1769ff;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:18px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#c62828;
    border:1px solid #ffcaca;
}

.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    color:#1769ff;
    font-weight:600;
}

.secure{
    text-align:center;
    margin-top:16px;
    color:#777;
    font-size:13px;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:#888;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

    <div class="logo">
        📚 CreateLK Academy
    </div>

    <div class="subtitle">
        ⭐ Premium Membership
    </div>

    <div class="plan">

        <h2>CreateLK Academy Premium</h2>

        <div class="price">
            LKR 1,500
        </div>

        <div class="duration">
            30 days of premium access
        </div>

    </div>

    <div id="message" class="message"></div>

    <form id="paymentForm">

        <div class="input-group">
            <label>First Name</label>
            <input
                id="first_name"
                type="text"
                required
                placeholder="Enter your first name">
        </div>

        <div class="input-group">
            <label>Last Name</label>
            <input
                id="last_name"
                type="text"
                required
                placeholder="Enter your last name">
        </div>

        <div class="input-group">
            <label>Registered Email</label>
            <input
                id="email"
                type="email"
                required
                placeholder="Enter your registered email">
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input
                id="phone"
                type="tel"
                required
                placeholder="07XXXXXXXX">
        </div>

        <button id="payButton" type="submit">
            Continue to PayHere
        </button>

    </form>

    <div id="loading" class="loading">
        Connecting to secure payment...
    </div>

    <div class="secure">
        🔒 Secure payment powered by PayHere
    </div>

    <div class="footer">
        © 2026 CreateLK Academy
    </div>

</div>

</div>

<script>

const API_URL =
"https://polished-wood-2146.gateofheavensl1.workers.dev";

const form =
document.getElementById("paymentForm");

const button =
document.getElementById("payButton");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");


function showError(text){

    message.textContent = text;

    message.className = "message error";

    message.style.display = "block";
}


form.addEventListener("submit", async function(e){

    e.preventDefault();

    message.style.display = "none";

    button.disabled = true;

    button.textContent = "Connecting...";

    loading.style.display = "block";

    const first_name =
        document.getElementById("first_name").value.trim();

    const last_name =
        document.getElementById("last_name").value.trim();

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const phone =
        document.getElementById("phone").value.trim();

    try{

        const response = await fetch(
            API_URL + "/create-payment",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    first_name,
                    last_name,
                    email,
                    phone
                })
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Unable to create payment."
            );
        }

        if(!data.gateway || !data.payment){

            throw new Error(
                "PayHere payment data is missing."
            );
        }

        /*
        ======================================
        CREATE PAYHERE FORM
        ======================================
        */

        const payhereForm =
            document.createElement("form");

        payhereForm.method = "POST";

        payhereForm.action = data.gateway;

        payhereForm.style.display = "none";


        /*
        ======================================
        ADD PAYMENT FIELDS
        ======================================
        */

        for(const key in data.payment){

            const input =
                document.createElement("input");

            input.type = "hidden";

            input.name = key;

            input.value = String(
                data.payment[key]
            );

            payhereForm.appendChild(input);
        }


        document.body.appendChild(
            payhereForm
        );


        loading.textContent =
            "Redirecting to PayHere...";


        payhereForm.submit();

    }

    catch(error){

        console.error(error);

        loading.style.display = "none";

        button.disabled = false;

        button.textContent =
            "Continue to PayHere";

        showError(
            error.message ||
            "Payment connection failed."
        );

    }

});

</script>

</body>
</html>
