<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Deposit | CreateLK Academy</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
  body{background:#f4f7fc;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
  .payment-box{background:white;padding:30px;border-radius:16px;max-width:500px;width:100%;box-shadow:0 8px 25px rgba(0,0,0,0.05);}
  h2{color:#1565c0;margin-bottom:15px;text-align:center;}
  p{font-size:14px;color:#666;margin-bottom:20px;text-align:center;}
  .bank-details{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:20px;font-size:14px;border-left:4px solid #1565c0;}
  .form-group{margin-bottom:15px;}
  label{display:block;margin-bottom:5px;font-weight:600;font-size:14px;}
  input, select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;}
  button{width:100%;background:#1565c0;color:white;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s;}
  button:hover{background:#0d47a1;}
</style>
</head>
<body>

<div class="payment-box">
  <h2>Manual Deposit Verification</h2>
  <p>Pay <strong>LKR 1,500</strong> for 30 Days Subscription and submit details below.</p>
  
  <div class="bank-details">
    <strong>Bank Transfer Details:</strong><br>
    Bank: Commercial Bank<br>
    Account Name: CreateLK Academy<br>
    Account No: 1234567890<br>
    Branch: Colombo 07
  </div>

  <form id="depositForm" action="/api/submit-deposit" method="POST">
    <div class="form-group">
      <label>Your Email Address</label>
      <input type="email" name="email" required placeholder="student@example.com">
    </div>
    <div class="form-group">
      <label>Transaction Reference / ID</label>
      <input type="text" name="transactionId" required placeholder="e.g., TXN987654321">
    </div>
    <div class="form-group">
      <label>Upload Payment Slip (Image/PDF)</label>
      <input type="file" name="receipt" accept="image/*,.pdf" required>
    </div>
    <button type="submit">Submit Deposit for Approval</button>
  </form>
</div>

</body>
</html>
