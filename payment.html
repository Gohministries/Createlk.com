<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">

.bank{

    width:100%;

}

input[type="text"]:focus{
    border-color:#174ea6;
}

.file-box{
    border:2px dashed #c8d2e2;
    border-radius:10px;

    width:100%;

}

.file-name{
    margin-top:5px;

    word-break:break-word;
}

.submit{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#174ea6;
    color:#fff;

    margin-top:5px;
}

    opacity:.65;
    cursor:not-allowed;
}

.message{

}

.back{

.whatsapp{

    width:54px;

    display:flex;
    align-items:center;

    text-decoration:none;

    font-size:28px;

    box-shadow:0 5px 18px rgba(0,0,0,.25);

    z-index:9999;
}

</style></head><body><div class="card"><div class="logo">
    📚 CreateLK Academy
</div>

<div class="title">
    ⭐ Premium Membership
</div>

<div class="student">
    <b>👤 <span id="studentName">Student</span></b><br>
    <span id="studentEmail"></span>
</div>

<div class="price">
    LKR 1,500
</div>

<div class="duration">
    30 Days Premium Access
</div>

<div id="message" class="message"></div>

<div class="bank">

    <div class="bank-title">
        🏦 Bank Deposit Details
    </div>

    <b>Bank:</b> People's Bank<br>
    <b>Branch:</b> Udapussellawa<br>
    <b>Account No:</b> 292200280023178<br>
    <b>Account Name:</b> Thinarathnam Saththiyanadan

</div>

<form id="paymentForm">

    <div class="field">

        <label for="reference">
            Payment Reference
        </label>

        <input
            type="text"
            id="reference"
            placeholder="Enter bank deposit reference"
            required>

    </div>

    <div class="field">

        <label for="receipt">
            Upload Payment Receipt
        </label>

        <div class="file-box">

            <input
                type="file"
                id="receipt"
                accept="image/jpeg,image/png,image/webp,application/pdf"
                required>

            <div
                id="fileName"
                class="file-name">
                No receipt selected
            </div>

        </div>

    </div>

    <button
        type="submit"
        id="submitButton"
        class="submit">

        Submit Payment for Approval

    </button>

</form>

<a
    href="dashboard.html"
    class="back">

    ← Back to Dashboard

</a>

</div><!-- WHATSAPP --><a
class="whatsapp"
href="https://wa.me/94771190395"
target="_blank"
rel="noopener"
aria-label="Chat on WhatsApp">

💬

</a><script>

"use strict";


/* =====================================
   API
===================================== */

const API_URL =
"https://cool-resonance-7780.gateofheavensl1.workers.dev";


/* =====================================
   STUDENT
===================================== */

function getStudent(){

    const saved =
        localStorage.getItem(
            "createlk_student"
        );

    if(!saved){
        return null;
    }

    try{

        const student =
            JSON.parse(saved);

        if(
            student &&
            student.id
        ){
            return student;
        }

    }catch(error){

        localStorage.removeItem(
            "createlk_student"
        );

    }

    return null;
}


const student =
getStudent();


/* =====================================
   REQUIRE LOGIN
===================================== */

if(!student){

    window.location.href =
        "login.html";

}


/* =====================================
   STUDENT DETAILS
===================================== */

if(student){

    document.getElementById(
        "studentName"
    ).textContent =
        (
            student.first_name ||
            "Student"
        ) +
        " " +
        (
            student.last_name ||
            ""
        );

    document.getElementById(
        "studentEmail"
    ).textContent =
        student.email ||
        "";

}


/* =====================================
   ELEMENTS
===================================== */

const form =
document.getElementById(
    "paymentForm"
);

const reference =
document.getElementById(
    "reference"
);

const receipt =
document.getElementById(
    "receipt"
);

const fileName =
document.getElementById(
    "fileName"
);

const submitButton =
document.getElementById(
    "submitButton"
);

const message =
document.getElementById(
    "message"
);


/* =====================================
   SHOW MESSAGE
===================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================
   FILE SELECTED
===================================== */

receipt.addEventListener(
    "change",
    function(){

        if(
            receipt.files &&
            receipt.files.length > 0
        ){

            fileName.textContent =
                "✓ " +
                receipt.files[0].name;

        }else{

            fileName.textContent =
                "No receipt selected";

        }

    }
);


/* =====================================
   PAYMENT SUBMIT
===================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!student){

            window.location.href =
                "login.html";

            return;

        }


        const file =
            receipt.files[0];


        const ref =
            reference.value.trim();


        /* VALIDATION */

        if(!ref){

            showMessage(
                "Please enter your payment reference.",
                "error"
            );

            return;

        }


        if(!file){

            showMessage(
                "Please upload your payment receipt.",
                "error"
            );

            return;

        }


        if(
            file.size >
            5 * 1024 * 1024
        ){

            showMessage(
                "Receipt must be smaller than 5 MB.",
                "error"
            );

            return;

        }


        const allowed = [

            "image/jpeg",
            "image/png",
            "image/webp",
            "application/pdf"

        ];


        if(
            !allowed.includes(
                file.type
            )
        ){

            showMessage(
                "Please upload JPG, PNG, WEBP or PDF.",
                "error"
            );

            return;

        }


        /* =================================
           PREPARE FORM
        ================================= */

        const formData =
            new FormData();


        formData.append(
            "student_id",
            student.id
        );


        formData.append(
            "amount",
            "1500"
        );


        formData.append(
            "payment_reference",
            ref
        );


        formData.append(
            "receipt",
            file
        );


        /* =================================
           LOADING
        ================================= */

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Submitting...";

        showMessage(
            "Uploading your receipt...",
            "success"
        );


        try{

            const response =
                await fetch(
                    API_URL +
                    "/api/premium/payment",
                    {
                        method:"POST",
                        body:formData
                    }
                );


            const text =
                await response.text();


            let data;


            try{

                data =
                    JSON.parse(text);

            }catch(error){

                data = {
                    success:false,
                    message:
                        text ||
                        "Invalid server response."
                };

            }


            if(
                !response.ok ||
                data.success !== true
            ){

                throw new Error(
                    data.message ||
                    "Payment submission failed."
                );

            }


            /* =================================
               SUCCESS
            ================================= */

            showMessage(
                "✓ Payment submitted successfully. Waiting for admin approval.",
                "success"
            );


            submitButton.textContent =
                "✓ Payment Submitted";


            submitButton.disabled =
                true;


            reference.disabled =
                true;

            receipt.disabled =
                true;


            /*
              Do NOT redirect immediately.
              Student can see confirmation.
            */


        }catch(error){

            console.error(
                "PAYMENT ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Payment submission failed. Please try again.",
                "error"
            );


            /*
              IMPORTANT:
              Restore submit button
              after upload failure.
            */

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Submit Payment for Approval";

        }

    }
);

</script></body>
</html>
