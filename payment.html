<script>

const WORKER_URL =
"https://white-mouse-3643.gateofheavensl1.workers.dev";

const form =
document.getElementById("paymentForm");

const submitButton =
document.getElementById("submitButton");

const status =
document.getElementById("status");

form.addEventListener(
"submit",
async function(e){

e.preventDefault();

const name =
document.getElementById("name").value.trim();

const email =
document.getElementById("email").value.trim().toLowerCase();

const reference =
document.getElementById("reference").value.trim();

const slip =
document.getElementById("slip").files[0];

if(!name || !email || !reference || !slip){

status.className="error";

status.innerText =
"Please complete all fields and upload your payment slip.";

return;

}

if(slip.size > 10 * 1024 * 1024){

status.className="error";

status.innerText =
"Payment slip must be under 10 MB.";

return;

}

submitButton.disabled=true;

submitButton.innerText="Submitting...";

status.className="";

status.innerText =
"Uploading payment slip...";

try{

const formData =
new FormData();

formData.append("name",name);

formData.append("email",email);

formData.append(
"payment_reference",
reference
);

formData.append(
"amount",
"1500"
);

formData.append(
"slip",
slip
);

const response =
await fetch(
WORKER_URL + "/api/subscribe",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

if(response.ok && result.success){

status.className="success";

status.innerText =
"✓ Payment submitted successfully. Your payment is now waiting for administrator approval.";

form.reset();

}else{

status.className="error";

status.innerText =
result.error ||
"Unable to submit payment.";

}

}catch(error){

console.error(error);

status.className="error";

status.innerText =
"Connection error: " + error.message;

}

submitButton.disabled=false;

submitButton.innerText="Submit Payment";

});

</script>
