<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CreateLK Academy | Payment</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:"Segoe UI",Arial,sans-serif;
background:#f5f8ff;
color:#172033;
}

header{
background:#174ea6;
color:#fff;
padding:18px;
}

.nav{
max-width:600px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{font-weight:800}

.home{
color:#fff;
text-decoration:none;
font-weight:700;
}

main{
max-width:600px;
margin:auto;
padding:30px 15px;
}

.card{
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 8px 30px #0001;
}

.icon{
text-align:center;
font-size:45px;
}

h1{
text-align:center;
color:#174ea6;
margin:10px 0;
}

.price{
text-align:center;
font-weight:800;
margin-bottom:25px;
}

.info{
background:#eef4ff;
padding:15px;
border-radius:10px;
margin-bottom:18px;
line-height:1.6;
}

label{
display:block;
font-weight:700;
margin:15px 0 7px;
}

input[type=email],
input[type=file]{
width:100%;
padding:13px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:10px;
background:#174ea6;
color:#fff;
font-size:16px;
font-weight:800;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

.status{
display:none;
padding:13px;
border-radius:10px;
margin-bottom:15px;
font-weight:700;
line-height:1.5;
}

.success{
display:block;
background:#dcfce7;
color:#166534;
}

.pending{
display:block;
background:#fff7d6;
color:#946200;
}

.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#174ea6;
text-decoration:none;
font-weight:700;
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">📚 CreateLK Academy</div>
<a class="home" href="index.html">🏠 Home</a>
</div>
</header>

<main>

<div class="card">

<div class="icon">⭐</div>

<h1>Premium Membership</h1>

<div class="price">
LKR 1,500 • 30 Days
</div>

<div id="status" class="status"></div>

<div class="info">
<b>🏦 Bank Payment</b><br>
Please deposit <b>LKR 1,500</b> to the CreateLK Academy bank account and upload your payment slip below.
</div>

<label>👤 Student Email</label>

<input
type="email"
id="email"
readonly
>

<label>📤 Payment Slip</label>

<input
type="file"
id="slip"
accept="image/jpeg,image/png,image/webp,application/pdf"
>

<button
id="submitBtn"
onclick="submitPayment()"
>
📤 Submit Payment
</button>

<a class="back" href="index.html">
🏠 Back to Home
</a>

</div>

</main>

<script>

const PAYMENT_API =
"https://approve.gateofheavensl1.workers.dev";

const emailInput =
document.getElementById("email");

const slipInput =
document.getElementById("slip");

const button =
document.getElementById("submitBtn");

const statusBox =
document.getElementById("status");


function showStatus(message,type){

statusBox.className =
"status " + type;

statusBox.textContent =
message;

statusBox.style.display =
"block";

}


/* =========================
   GET STUDENT EMAIL
========================= */

function getEmail(){

let email =
localStorage.getItem(
"createlk_student_email"
);

if(!email){

try{

const user =
JSON.parse(
localStorage.getItem(
"createlk_user"
)
);

if(user){

email =
user.email ||
user.student_email ||
"";

}

}catch(e){}

}

return String(email || "")
.trim()
.toLowerCase();

}


/* =========================
   LOAD EMAIL
========================= */

const studentEmail =
getEmail();

if(studentEmail){

emailInput.value =
studentEmail;

}else{

showStatus(
"❌ Student email not found. Please login first.",
"error"
);

button.disabled=true;

}


/* =========================
   SUBMIT PAYMENT
========================= */

async function submitPayment(){

const email =
emailInput.value
.trim()
.toLowerCase();

const file =
slipInput.files[0];

if(!email){

showStatus(
"❌ Please login first.",
"error"
);

return;
}

if(!file){

showStatus(
"❌ Please select your payment slip.",
"error"
);

return;
}


/* File size */

if(file.size > 10 * 1024 * 1024){

showStatus(
"❌ File is too large. Maximum 10MB.",
"error"
);

return;
}


button.disabled=true;

button.textContent =
"⏳ Uploading...";


try{

const formData =
new FormData();

formData.append(
"email",
email
);

formData.append(
"student_email",
email
);

formData.append(
"amount",
"1500"
);

formData.append(
"slip",
file
);


/*
IMPORTANT:
Do not set Content-Type manually.
Browser creates multipart/form-data boundary.
*/

const response =
await fetch(
PAYMENT_API +
"/payment",
{
method:"POST",
body:formData
}
);


let data;

try{

data =
await response.json();

}catch(e){

throw new Error(
"Invalid response from payment server."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Payment submission failed."
);

}


/* =========================
   PENDING
========================= */

showStatus(
"✅ Payment slip submitted successfully. Your payment is now PENDING approval.",
"pending"
);

button.textContent =
"⏳ Payment Pending";

button.disabled=true;

slipInput.value="";


}catch(error){

console.error(error);

showStatus(
"❌ " + error.message,
"error"
);

button.disabled=false;

button.textContent =
"📤 Submit Payment";

}

}

</script>

</body>
</html>
