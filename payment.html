<script>
const BANK_PAYMENT_WORKER =
"https://bankpayment.gateofheavensl1.workers.dev/bank-payment";

document.getElementById("bankForm").addEventListener("submit", async function (e) {

    e.preventDefault();

    const button = document.getElementById("bankButton");
    const loading = document.getElementById("bankLoading");
    const message = document.getElementById("bankMessage");

    message.className = "message";
    message.textContent = "";

    const studentId =
        document.getElementById("studentId").value.trim();

    const reference =
        document.getElementById("reference").value.trim();

    const receipt =
        document.getElementById("receipt").files[0];

    if (!studentId) {
        message.className = "message error";
        message.textContent = "Please enter your Student ID.";
        return;
    }

    if (!reference) {
        message.className = "message error";
        message.textContent = "Please enter your payment reference.";
        return;
    }

    if (!receipt) {
        message.className = "message error";
        message.textContent = "Please select your payment receipt.";
        return;
    }

    if (receipt.size > 10 * 1024 * 1024) {
        message.className = "message error";
        message.textContent = "Receipt must be smaller than 10 MB.";
        return;
    }

    const formData = new FormData();

    formData.append("student_id", studentId);
    formData.append("payment_reference", reference);
    formData.append("receipt", receipt);

    button.disabled = true;
    loading.style.display = "block";

    try {

        const response = await fetch(
            BANK_PAYMENT_WORKER,
            {
                method: "POST",
                body: formData,
                mode: "cors"
            }
        );

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            data = {
                success: false,
                message: text || "Invalid server response."
            };
        }

        if (response.ok && data.success) {

            message.className = "message success";

            message.textContent =
                data.message ||
                "Bank payment submitted successfully.";

            document.getElementById("bankForm").reset();

        } else {

            message.className = "message error";

            message.textContent =
                data.message ||
                "Bank payment could not be submitted.";

            console.error(
                "Bank payment server response:",
                response.status,
                data
            );
        }

    } catch (error) {

        console.error(
            "Bank payment connection error:",
            error
        );

        message.className = "message error";

        message.textContent =
            "Unable to connect to the bank payment server. Please check your internet connection and try again.";

    } finally {

        button.disabled = false;
        loading.style.display = "none";

    }

});
</script>
