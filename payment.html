<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreateLK Academy | Payment</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:"Segoe UI",Arial,sans-serif;
background:#f5f8ff;color:#172033;
padding:20px
}
.card{
max-width:500px;margin:25px auto;background:#fff;
padding:25px;border-radius:18px;
box-shadow:0 8px 30px #0001
}
h1{text-align:center;color:#174ea6;margin-bottom:8px}
.price{text-align:center;color:#667085;margin-bottom:22px}
label{display:block;font-weight:700;margin:16px 0 7px}
input{
width:100%;padding:13px;border:1px solid #d1d5db;
border-radius:10px;font-size:16px
}
.bank{
background:#eef4ff;padding:15px;border-radius:12px;
line-height:1.8;margin-bottom:15px
}
button{
width:100%;padding:14px;border:0;border-radius:10px;
background:#174ea6;color:#fff;font-size:16px;
font-weight:800;margin-top:18px;cursor:pointer
}
button:disabled{opacity:.6}
.status{
margin-top:18px;padding:15px;border-radius:10px;
font-weight:700;line-height:1.5
}
.pending{background:#fff8e1;color:#8a6200}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.back{
display:block;text-align:center;margin-top:18px;
color:#174ea6;text-decoration:none;font-weight:700
}
.hidden{display:none}
</style>
</head>

<body>

<div class="card">

<h1>⭐ Premium Membership</h1>

<p class="price">
LKR 1,500 • 30 Days
</p>

<div class="bank">
<b>🏦 Bank Payment</b><br>
Please deposit <b>LKR 1,500</b> to the CreateLK Academy
bank account and upload your payment slip below.
</div>

<label>👤 Student Email</label>

<input
id="email"
type="email"
readonly
>

<label>📤 Payment Slip</label>

<input
id="slip"
type="file"
accept="image/jpeg,image/png,image/webp,application/pdf"
>

<button id="submitBtn">
📤 Submit Payment
</button>

<div id="status" class="hidden"></div>

<a class="back" href="index.html">
🏠 Back to Home
</a>

</div>

<script>

const API =
"https://createlk-payment-api.gateofheavensl1.workers.dev";

const emailBox =
document.getElementById("email");

const slip =
document.getElementById("slip");

const button =
document.getElementById("submitBtn");

const statusBox =
document.getElementById("status");


/* =========================
   GET LOGGED-IN EMAIL
========================= */

const email =
localStorage.getItem(
"createlk_student_email"
);

if(!email){

statusBox.className="status error";
statusBox.textContent=
"❌ Student email not found. Please login first.";
statusBox.classList.remove("hidden");

button.disabled=true;

}else{

emailBox.value=email;

}


/* =========================
   SUBMIT PAYMENT
========================= */

button.addEventListener(
"click",
async function(){

if(!email){
return;
}

if(!slip.files.length){

showStatus(
"❌ Please select your payment slip.",
"error"
);

return;
}

const file=slip.files[0];

const allowed=[
"image/jpeg",
"image/png",
"image/webp",
"application/pdf"
];

if(!allowed.includes(file.type)){

showStatus(
"❌ Please upload JPG, PNG, WEBP or PDF.",
"error"
);

return;
}

if(file.size>5*1024*1024){

showStatus(
"❌ Maximum file size is 5 MB.",
"error"
);

return;
}

button.disabled=true;
button.textContent="⏳ Uploading...";

try{

/*
Create payment record
*/

const createResponse=
await fetch(
API+"/payment/create",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
amount:1500,
days:30
})
}
);

const payment=
await createResponse.json();

if(
!createResponse.ok ||
!payment.success
){

throw new Error(
payment.message ||
"Unable to create payment."
);

}

const paymentId=
payment.payment_id;


/*
Upload slip
*/

button.textContent="⏳ Uploading slip...";

const formData=
new FormData();

formData.append(
"payment_id",
paymentId
);

formData.append(
"email",
email
);

formData.append(
"slip",
file
);

const uploadResponse=
await fetch(
API+"/payment/receipt",
{
method:"POST",
body:formData
}
);

const upload=
await uploadResponse.json();

if(
!uploadResponse.ok ||
!upload.success
){

throw new Error(
upload.message ||
"Slip upload failed."
);

}


/*
PENDING
*/

showStatus(
"⏳ Payment submitted successfully! Your payment is now PENDING. Please wait for admin verification.",
"pending"
);

slip.value="";

button.textContent=
"⏳ Payment Pending";

}catch(error){

console.error(error);

showStatus(
"❌ "+error.message,
"error"
);

button.disabled=false;
button.textContent=
"📤 Submit Payment";

}

});


function showStatus(message,type){

statusBox.className=
"status "+type;

statusBox.textContent=
message;

statusBox.classList.remove("hidden");

}

</script>

</body>
</html>
