<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Deposit | CreateLK Academy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#f4f7fc;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.payment-box{background:white;padding:30px;border-radius:16px;max-width:500px;width:100%;box-shadow:0 8px 25px rgba(0,0,0,0.05);}
h2{color:#1565c0;margin-bottom:15px;text-align:center;}
p{font-size:14px;color:#666;margin-bottom:20px;text-align:center;}
.bank-details{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:20px;font-size:14px;border-left:4px solid #1565c0;line-height:1.5;}
.form-group{margin-bottom:15px;}
label{display:block;margin-bottom:5px;font-weight:600;font-size:14px;}
input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;}
button{width:100%;background:#1565c0;color:white;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;}
button:hover{background:#0d47a1;}
.back-link{display:block;text-align:center;margin-top:15px;color:#666;text-decoration:none;font-size:14px;}
.back-link:hover{color:#1565c0;}
#statusMsg{margin-top:15px;text-align:center;font-weight:600;font-size:14px;}
</style>
</head>
<body>

<div class="payment-box">
  <h2>Manual Deposit Verification</h2>
  <p>Pay <strong>LKR 1,500</strong> for 30 Days Subscription and submit your details below.</p>
  
  <div class="bank-details">
    <strong>Bank Transfer Details:</strong><br>
    Bank: People's Bank<br>
    Branch: Udapussellawa<br>
    Account Name: CreateLK Academy<br>
    Account No: 292200280023178<br>
    Customer Name: Thinarathnam Saththiyanadan
  </div>

  <form id="depositForm">
    <div class="form-group">
      <label>Your Email Address</label>
      <input type="email" id="email" name="email" required placeholder="student@example.com">
    </div>
    <div class="form-group">
      <label>Transaction Reference / ID</label>
      <input type="text" id="transactionId" name="transactionId" required placeholder="e.g., TXN987654321">
    </div>
    <div class="form-group">
      <label>Upload Payment Slip (Image/PDF)</label>
      <input type="file" id="receipt" name="receipt" accept="image/*,.pdf" required>
    </div>
    <button type="submit" id="submitBtn">Submit Deposit for Approval</button>
  </form>

  <p id="statusMsg"></p>
  <a href="index.html" class="back-link">← Back to Home</a>
</div>

<script>
const WORKER_URL = "https://proud-smoke-3af1.gateofheavensl1.workers.dev";

document.getElementById('depositForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  
  const email = document.getElementById('email').value;
  const transactionId = document.getElementById('transactionId').value;
  const receiptFile = document.getElementById('receipt').files[0];

  const formData = new FormData();
  formData.append('email', email);
  formData.append('transactionId', transactionId);
  formData.append('receipt', receiptFile);

  submitBtn.disabled = true;
  submitBtn.innerText = 'Submitting...';
  statusMsg.style.color = '#333';
  statusMsg.innerText = 'Uploading your deposit details...';

  try {
    const response = await fetch(`${WORKER_URL}/api/submit-deposit`, {
      method: 'POST',
      body: formData
    });

    const result = await response.json();

    if (response.ok) {
      statusMsg.style.color = 'green';
      statusMsg.innerText = result.message || 'Deposit submitted successfully! Waiting for admin approval.';
      document.getElementById('depositForm').reset();
    } else {
      statusMsg.style.color = 'red';
      statusMsg.innerText = result.error || 'Submission failed. Please try again.';
    }
  } catch (error) {
    statusMsg.style.color = 'red';
    statusMsg.innerText = 'Network error. Please check your connection or Worker URL.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = 'Submit Deposit for Approval';
  }
});
</script>

</body>
</html>
