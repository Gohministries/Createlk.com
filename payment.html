<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment | CreateLK Academy</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f8ff;
  color:#172033
}
header{
  background:#174ea6;
  color:white;
  padding:16px;
  text-align:center;
  font-weight:800
}
.card{
  max-width:520px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 25px #0001
}
h1{margin-top:0;color:#174ea6}
.email{
  background:#eef4ff;
  padding:12px;
  border-radius:10px;
  margin:15px 0;
  word-break:break-word
}
.price{
  font-size:25px;
  font-weight:800;
  margin:15px 0
}
.bank{
  background:#f8fafc;
  padding:15px;
  border-radius:12px;
  line-height:1.8
}
input[type=file]{
  width:100%;
  margin:15px 0
}
button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:#174ea6;
  color:white
}
button:disabled{opacity:.5}
.status{
  padding:15px;
  border-radius:12px;
  margin:15px 0;
  font-weight:700
}
.pending{background:#fff4d6;color:#946200}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.hidden{display:none}
a{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#174ea6;
  font-weight:700;
  text-decoration:none
}
</style>
</head>

<body>

<header>📚 CreateLK Academy — Payment</header>

<div class="card">

<h1>⭐ Premium Membership</h1>

<div class="price">LKR 1,500 • 30 Days</div>

<div class="email">
👤 Student Email<br>
<b id="email">Loading...</b>
</div>

<div id="status"></div>

<div id="paymentArea">

<h3>🏦 Manual Bank Transfer</h3>

<div class="bank">
<b>Bank:</b> People's Bank<br>
<b>Branch:</b> Udapussellawa<br>
<b>Account Name:</b> Thinarathnam Sathiyanathan<br>
<b>Account Number:</b> 292200280023178<br>
<b>Amount:</b> LKR 1,500
</div>

<h3>📎 Upload Payment Slip</h3>

<input
  type="file"
  id="slip"
  accept="image/*,.pdf">

<button id="submit" onclick="submitPayment()">
📤 Submit Payment Slip
</button>

</div>

<a href="index.html">🏠 Back to Home</a>

</div>

<script>

const API =
"https://gateofheavensl1.workers.dev";

const email =
(
  new URLSearchParams(location.search)
  .get("email")
  ||
  localStorage.getItem("studentEmail")
  ||
  ""
).trim().toLowerCase();

const emailBox =
document.getElementById("email");

const statusBox =
document.getElementById("status");

const paymentArea =
document.getElementById("paymentArea");

emailBox.textContent =
email || "No email found";


if(!email){

  showStatus(
    "rejected",
    "❌ Student email not found. Please login first."
  );

  paymentArea.classList.add("hidden");

}else{

  checkStatus();

}


async function checkStatus(){

  try{

    const r =
    await fetch(
      API +
      "/payment-status?email=" +
      encodeURIComponent(email)
    );

    const d =
    await r.json();

    if(!d.success){
      return;
    }

    if(d.status === "approved"){

      showStatus(
        "approved",
        "✅ Premium is ACTIVE until " +
        new Date(d.expires_at)
        .toLocaleDateString()
      );

      paymentArea.classList.add("hidden");

      return;
    }

    if(d.status === "pending"){

      showStatus(
        "pending",
        "⏳ Payment Pending<br>" +
        "Your payment slip has been submitted and is waiting for administrator verification."
      );

      paymentArea.classList.add("hidden");

      return;
    }

    if(d.status === "rejected"){

      showStatus(
        "rejected",
        "❌ Payment was rejected.<br>You may upload a new payment slip."
      );

      paymentArea.classList.remove("hidden");

    }

  }catch(e){

    console.error(e);

  }

}


async function submitPayment(){

  const file =
  document.getElementById("slip").files[0];

  const button =
  document.getElementById("submit");

  if(!file){

    alert("Please select your payment slip.");

    return;
  }

  if(file.size > 5 * 1024 * 1024){

    alert("Maximum file size is 5 MB.");

    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Uploading...";

  try{

    const base64 =
    await toBase64(file);

    const r =
    await fetch(
      API + "/submit-payment",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({

          email:email,

          amount:1500,

          file_name:file.name,

          file_type:file.type,

          file_data:base64

        })
      }
    );

    const d =
    await r.json();

    if(!r.ok || !d.success){

      throw new Error(
        d.message ||
        "Payment submission failed."
      );

    }

    showStatus(
      "pending",
      "⏳ Payment Pending<br>" +
      "Your payment slip was submitted successfully. Please wait for administrator verification."
    );

    paymentArea.classList.add("hidden");

  }catch(e){

    alert(
      "❌ " + e.message
    );

    button.disabled = false;
    button.textContent =
      "📤 Submit Payment Slip";

  }

}


function toBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
      new FileReader();

      reader.onload = () => {

        const result =
        reader.result;

        resolve(
          result.split(",")[1]
        );

      };

      reader.onerror =
      reject;

      reader.readAsDataURL(file);

    }
  );

}


function showStatus(type,text){

  statusBox.className =
    "status " + type;

  statusBox.innerHTML =
    text;

}

</script>

</body>
</html>
