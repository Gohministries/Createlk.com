<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CreateLK Academy | Premium Membership</title>

<meta name="description"
      content="CreateLK Academy Premium Membership - LKR 1,500 for 30 days.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 45px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    color:#1769ff;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.plan{
    background:#f1f6ff;
    border:1px solid #dce8ff;
    border-radius:16px;
    padding:20px;
    text-align:center;
    margin-bottom:25px;
}

.plan h2{
    color:#1769ff;
    margin-bottom:8px;
}

.price{
    font-size:32px;
    font-weight:800;
    color:#111;
}

.duration{
    color:#666;
    margin-top:5px;
}

.input-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
    color:#333;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d5dbe5;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#1769ff;
    box-shadow:0 0 0 3px rgba(23,105,255,.10);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#1769ff;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#0d55d9;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:18px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#c62828;
    border:1px solid #ffcaca;
}

.success{
    background:#effaf2;
    color:#218838;
    border:1px solid #c8efd0;
}

.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    color:#1769ff;
    font-weight:600;
}

.secure{
    text-align:center;
    margin-top:16px;
    color:#777;
    font-size:13px;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:#888;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

    <div class="logo">
        📚 CreateLK Academy
    </div>

    <div class="subtitle">
        ⭐ Premium Membership
    </div>


    <div class="plan">

        <h2>
            CreateLK Academy Premium
        </h2>

        <div class="price">
            LKR 1,500
        </div>

        <div class="duration">
            30 days of premium access
        </div>

    </div>


    <div id="message"
         class="message">
    </div>


    <form id="paymentForm">


        <div class="input-group">

            <label for="first_name">
                First Name
            </label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter your first name"
                required
            >

        </div>


        <div class="input-group">

            <label for="last_name">
                Last Name
            </label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter your last name"
                required
            >

        </div>


        <div class="input-group">

            <label for="email">
                Registered Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

        </div>


        <div class="input-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="07XXXXXXXX"
                required
            >

        </div>


        <button
            type="submit"
            id="payButton">

            Continue to PayHere

        </button>

    </form>


    <div id="loading"
         class="loading">

        Connecting to secure payment...

    </div>


    <div class="secure">

        🔒 Secure payment powered by PayHere

    </div>


    <div class="footer">

        © 2026 CreateLK Academy

    </div>

</div>

</div>


<script>

/* ==========================================
   YOUR CURRENT CLOUDFLARE WORKER
========================================== */

const API_URL =
"https://polished-wood-2146.gateofheavensl1.workers.dev";


/* ==========================================
   ELEMENTS
========================================== */

const form =
document.getElementById("paymentForm");

const button =
document.getElementById("payButton");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");


/* ==========================================
   SHOW ERROR
========================================== */

function showError(text){

    message.textContent =
        text;

    message.className =
        "message error";

    message.style.display =
        "block";
}


/* ==========================================
   FORM SUBMIT
========================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        message.style.display =
            "none";

        button.disabled =
            true;

        button.textContent =
            "Connecting...";

        loading.style.display =
            "block";


        /* ==============================
           GET FORM DATA
        ============================== */

        const firstName =
            document
            .getElementById("first_name")
            .value
            .trim();

        const lastName =
            document
            .getElementById("last_name")
            .value
            .trim();

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        try{

            /* ==============================
               SEND REQUEST TO WORKER
            ============================== */

            const response =
                await fetch(
                    API_URL +
                    "/create-payment",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            first_name:
                                firstName,

                            last_name:
                                lastName,

                            email:
                                email,

                            phone:
                                phone

                        })
                    }
                );


            /* ==============================
               READ RESPONSE
            ============================== */

            const data =
                await response.json();


            /* ==============================
               WORKER ERROR
            ============================== */

            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Payment request failed."
                );

            }


            /* ==============================
               CHECK PAYMENT DATA
            ============================== */

            if(
                !data.gateway ||
                !data.payment
            ){

                throw new Error(
                    "Payment information was not returned by the server."
                );

            }


            /* ==============================
               CREATE PAYHERE FORM
            ============================== */

            const payhereForm =
                document.createElement("form");

            payhereForm.method =
                "POST";

            payhereForm.action =
                data.gateway;

            payhereForm.style.display =
                "none";


            /* ==============================
               ADD PAYHERE PARAMETERS
            ============================== */

            Object.keys(
                data.payment
            ).forEach(function(key){

                const input =
                    document.createElement("input");

                input.type =
                    "hidden";

                input.name =
                    key;

                input.value =
                    data.payment[key];

                payhereForm.appendChild(
                    input
                );

            });


            document.body.appendChild(
                payhereForm
            );


            /* ==============================
               REDIRECT TO PAYHERE
            ============================== */

            loading.textContent =
                "Redirecting to PayHere...";

            payhereForm.submit();

        }

        catch(error){

            console.error(
                "PAYMENT ERROR:",
                error
            );


            loading.style.display =
                "none";


            button.disabled =
                false;

            button.textContent =
                "Continue to PayHere";


            showError(
                error.message ||
                "Failed to connect to payment server."
            );

        }

    }
);

</script>

</body>

</html>
