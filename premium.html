<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium AI MCQ | CreateLK Academy</title>

<meta name="description"
content="CreateLK Academy Premium AI English MCQ practice with explanations.">

<meta name="theme-color" content="#174ea6">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#174ea6,#0b57d0);
    color:white;
    padding:22px 18px;
    text-align:center;
}

.header h1{
    font-size:25px;
    margin-bottom:6px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:720px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.badge{
    display:inline-block;
    background:#fff3cd;
    color:#856404;
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

h2{
    font-size:21px;
    margin-bottom:15px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #d5dbe5;
    border-radius:10px;
    font-size:15px;
    margin-bottom:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#174ea6;
}

button{
    width:100%;
    border:none;
    border-radius:11px;
    padding:14px;
    background:#174ea6;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0b57d0;
}

button:disabled{
    background:#9aa4b2;
    cursor:not-allowed;
}

.question{
    font-size:19px;
    line-height:1.5;
    font-weight:bold;
    margin-bottom:18px;
}

.option{
    display:block;
    background:#f7f9fc;
    border:1px solid #dce2ea;
    border-radius:11px;
    padding:13px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    background:#eef4ff;
    border-color:#174ea6;
}

.option input{
    width:auto;
    margin:0 8px 0 0;
}

.answer-box{
    margin-top:18px;
    padding:16px;
    background:#eef8f0;
    border-left:4px solid #198754;
    border-radius:8px;
    line-height:1.6;
}

.explanation{
    margin-top:10px;
}

.error{
    background:#fff0f0;
    color:#b42318;
    padding:13px;
    border-radius:9px;
    margin-top:15px;
    display:none;
}

.success{
    background:#eef8f0;
    color:#137333;
    padding:13px;
    border-radius:9px;
    margin-top:15px;
    display:none;
}

.usage{
    text-align:center;
    color:#667085;
    font-size:13px;
    margin-top:12px;
}

.loading{
    display:none;
    text-align:center;
    padding:18px;
}

.spinner{
    width:28px;
    height:28px;
    border:4px solid #dbe5f5;
    border-top-color:#174ea6;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto auto 10px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.footer{
    text-align:center;
    padding:25px;
    color:#667085;
    font-size:13px;
}

.hidden{
    display:none;
}

@media(max-width:500px){
    .card{
        padding:17px;
    }

    .question{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>🤖 Premium AI MCQ</h1>
    <p>CreateLK Academy</p>
</header>

<main class="container">

    <section class="card">

        <span class="badge">⭐ PREMIUM</span>

        <h2>AI English Practice</h2>

        <label for="userKey">Student Email</label>

        <input
            type="email"
            id="userKey"
            placeholder="Enter your registered email"
            autocomplete="email"
        >

        <label for="level">English Level</label>

        <select id="level">
            <option value="Beginner">Beginner</option>
            <option value="Elementary">Elementary</option>
            <option value="Intermediate" selected>Intermediate</option>
            <option value="Upper Intermediate">Upper Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>

        <label for="topic">Topic</label>

        <select id="topic">
            <option value="Grammar">Grammar</option>
            <option value="Vocabulary">Vocabulary</option>
            <option value="Tenses">Tenses</option>
            <option value="Prepositions">Prepositions</option>
            <option value="Articles">Articles</option>
            <option value="Mixed English">Mixed English</option>
        </select>

        <button id="generateBtn" onclick="generateMCQ()">
            Generate AI MCQ
        </button>

        <div class="usage" id="usage">
            Premium AI practice — maximum 100 questions per day
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI is creating your question...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="success" id="success"></div>

    </section>


    <section class="card hidden" id="questionCard">

        <h2>📝 Your Question</h2>

        <div class="question" id="questionText"></div>

        <div id="options"></div>

        <button onclick="checkAnswer()" id="answerBtn">
            Check Answer
        </button>

        <div class="answer-box hidden" id="answerBox">

            <strong>Correct Answer:</strong>
            <span id="correctAnswer"></span>

            <div class="explanation">
                <strong>Explanation:</strong>
                <p id="explanationText"></p>
            </div>

        </div>

    </section>

</main>

<footer class="footer">
    © 2026 CreateLK Academy
</footer>


<script>

const WORKER_URL =
    "https://premium.gateofheavensl1.workers.dev";

let currentQuestion = null;


/*
|--------------------------------------------------------------------------
| Generate AI MCQ
|--------------------------------------------------------------------------
*/

async function generateMCQ(){

    const userKey =
        document.getElementById("userKey").value.trim();

    const level =
        document.getElementById("level").value;

    const topic =
        document.getElementById("topic").value;

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    const loading =
        document.getElementById("loading");

    const button =
        document.getElementById("generateBtn");

    error.style.display = "none";
    success.style.display = "none";

    if(!userKey){

        error.textContent =
            "Please enter your registered Premium email.";

        error.style.display = "block";

        return;
    }

    if(!userKey.includes("@")){

        error.textContent =
            "Please enter a valid email address.";

        error.style.display = "block";

        return;
    }

    button.disabled = true;
    loading.style.display = "block";

    document.getElementById("questionCard")
        .classList.add("hidden");

    try{

        const response = await fetch(
            WORKER_URL + "/api/ai-mcq",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    user_key:userKey,

                    level:level,

                    topic:topic

                })
            }
        );


        const data = await response.json();


        if(!response.ok || data.success === false){

            throw new Error(
                data.message ||
                data.error ||
                "Unable to generate MCQ."
            );
        }


        /*
        --------------------------------------------------------------
        Accept several possible response formats
        --------------------------------------------------------------
        */

        currentQuestion =
            data.question_data ||
            data.question ||
            data.mcq ||
            data;


        displayQuestion(currentQuestion);


        if(data.used !== undefined &&
           data.limit !== undefined){

            document.getElementById("usage").textContent =
                "Today's usage: " +
                data.used +
                " / " +
                data.limit;
        }

    }
    catch(err){

        console.error(err);

        error.textContent =
            err.message ||
            "Connection error. Please try again.";

        error.style.display = "block";

    }
    finally{

        button.disabled = false;
        loading.style.display = "none";

    }
}


/*
|--------------------------------------------------------------------------
| Display Question
|--------------------------------------------------------------------------
*/

function displayQuestion(q){

    document
        .getElementById("questionCard")
        .classList.remove("hidden");


    const questionText =
        q.question ||
        q.question_text ||
        q.text ||
        "";


    document
        .getElementById("questionText")
        .textContent = questionText;


    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";


    let options =
        q.options ||
        q.choices ||
        [];


    /*
    If Worker returns:
    {
        A:"...",
        B:"...",
        C:"...",
        D:"..."
    }
    */

    if(!Array.isArray(options)){

        options = [
            q.A,
            q.B,
            q.C,
            q.D
        ].filter(Boolean);

    }


    options.forEach((option,index)=>{

        const letter =
            String.fromCharCode(65 + index);

        const label =
            document.createElement("label");

        label.className = "option";

        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${escapeHtml(option)}"
            >
            <strong>${letter}.</strong>
            ${escapeHtml(option)}
        `;

        optionsContainer.appendChild(label);

    });


    document
        .getElementById("answerBox")
        .classList.add("hidden");

}


/*
|--------------------------------------------------------------------------
| Check Answer
|--------------------------------------------------------------------------
*/

function checkAnswer(){

    if(!currentQuestion){

        return;
    }


    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );


    if(!selected){

        alert("Please select an answer.");

        return;
    }


    const userAnswer =
        selected.value;


    const correct =
        currentQuestion.correct_answer ||
        currentQuestion.correctAnswer ||
        currentQuestion.answer ||
        currentQuestion.correct ||
        "";


    document
        .getElementById("correctAnswer")
        .textContent = correct;


    document
        .getElementById("explanationText")
        .textContent =
            currentQuestion.explanation ||
            currentQuestion.answer_explanation ||
            "No explanation was provided.";


    document
        .getElementById("answerBox")
        .classList.remove("hidden");


    /*
    Highlight the selected answer
    */

    const selectedLabel =
        selected.closest(".option");


    if(
        normalize(userAnswer) ===
        normalize(correct)
    ){

        selectedLabel.style.borderColor =
            "#198754";

        selectedLabel.style.background =
            "#eef8f0";

    }
    else{

        selectedLabel.style.borderColor =
            "#dc3545";

        selectedLabel.style.background =
            "#fff0f0";

    }

}


/*
|--------------------------------------------------------------------------
| Helpers
|--------------------------------------------------------------------------
*/

function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase();

}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
