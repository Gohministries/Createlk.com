}

}

.generate{

}

}

.message{
margin-top:15px;
padding:13px;
border-radius:10px;
display:none;
font-size:14px;
font-weight:600;
}

.info{
background:#eef4ff;
color:#174ea6;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.success{
background:#dcfce7;
color:#166534;
}

.quiz{
margin-top:20px;
}

.question{
background:#f8fafc;
border:1px solid #e4e9f2;
padding:18px;
border-radius:14px;
margin-bottom:15px;
}

.question-title{
font-size:17px;
font-weight:800;
margin-bottom:14px;
}

.option{
display:block;
width:100%;
text-align:left;
background:#fff;
border:1px solid #d8deea;
padding:12px;
border-radius:9px;
margin-top:8px;
cursor:pointer;
font-size:14px;
}

.option:hover{
background:#f1f5ff;
}

.option.selected{
border:2px solid #174ea6;
background:#eef4ff;
}

.option.correct{
background:#dcfce7;
border-color:#15803d;
color:#166534;
font-weight:700;
}

.option.wrong{
background:#fee2e2;
border-color:#dc2626;
color:#991b1b;
}

.explanation{
margin-top:12px;
padding:10px;
background:#f7f9fc;
border-radius:8px;
font-size:13px;
}

.score{
display:none;
background:#174ea6;
color:#fff;
padding:18px;
border-radius:14px;
text-align:center;
margin-top:20px;
}

.score-number{
font-size:30px;
font-weight:900;
}

.footer-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.btn{
display:block;
padding:13px;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:800;
border:0;
cursor:pointer;
}

.submit{
background:#15803d;
color:#fff;
}

.home-btn{
background:#eef4ff;
color:#174ea6;
}

footer{
text-align:center;
padding:25px;
font-size:13px;
color:#667085;
}

@media(max-width:600px){

.controls{
grid-template-columns:1fr;
}

.card{
padding:17px;
}

.logo{
font-size:15px;
}

.question-title{
font-size:16px;
}

.footer-buttons{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
📚 CreateLK Academy
</div>

<div class="nav-right">

<a
href="index.html"
class="home">

🏠 Home

</a>

<button
id="logout"
class="logout">

🚪 Logout

</button>

</div>

</div>

</header>



<main>


<section class="hero">

<div class="icon">
⭐
</div>

<h1>
Premium AI English MCQs
</h1>

<p>
Practise English with AI-generated questions.
</p>

</section>



<div
id="membership"
class="membership">

⏳ Checking Premium membership...

</div>



<section
id="app"
class="card"
style="display:none;">


<div class="controls">

<select id="level">

<option value="beginner">
Beginner

<option value="elementary">

selected>

</option>

</option>

</select>


<select id="count">

<option value="5">

</option>

selected>

</option>

</option>

</div>



<button
id="generate"
class="generate">

🤖 Generate AI MCQs

</button>



<div
id="message"
class="message">

id="quiz"

</div>



<div
id="score"

<div>
🎓 Your Score
</div>

</div>

</div>

id="footerButtons"

style="display:none;">

id="submit"

href="index.html"

🏠 Home

</a>

</div>


</section>


</main>



<footer>

📚 <b>CreateLK Academy</b>

<br>

Learn English. Build Your Future.

<br><br>

© 2026 CreateLK Academy. All Rights Reserved.

</footer>



<script>

"use strict";


/* =========================================
   WORKERS
========================================= */

const MEMBERSHIP_API =
"https://createlk-membership.gateofheavensl1.workers.dev";


/*
   IMPORTANT:
   Change ONLY this URL if your AI Worker
   has a different workers.dev address.
*/

const AI_API =
"https://createlk-academy.gateofheavensl1.workers.dev";


/* =========================================
   ELEMENTS
========================================= */

const membershipBox =
document.getElementById("membership");

const app =
document.getElementById("app");

const generateButton =
document.getElementById("generate");

const message =
document.getElementById("message");

const quiz =
document.getElementById("quiz");

const submitButton =
document.getElementById("submit");

const scoreBox =
document.getElementById("score");

const scoreNumber =
document.getElementById("scoreNumber");

const scoreText =
document.getElementById("scoreText");

const footerButtons =
document.getElementById("footerButtons");

const logoutButton =
document.getElementById("logout");

let questions = [];

let countdownTimer = null;


/* =========================================
   GET EMAIL
========================================= */

function getEmail(){

const keys = [

"createlk_student_email",
"studentEmail",
"email",
"userEmail",
"loggedInEmail"

];

for(const key of keys){

const value =
localStorage.getItem(key);

if(
value &&
value.trim() &&
value.includes("@")
){

return value
.trim()
.toLowerCase();

}

}


const objectKeys = [

"createlk_user",
"createlk_student",
"currentUser",
"user",
"student"

];

for(const key of objectKeys){

try{

const raw =
localStorage.getItem(key);

if(!raw){
continue;
}

const user =
JSON.parse(raw);

if(
user &&
typeof user.email === "string" &&
user.email.includes("@")
){

return user.email
.trim()
.toLowerCase();

}

}catch(e){}

}

return "";

}


/* =========================================
   LOGOUT
========================================= */

logoutButton.onclick =
function(){

if(
!confirm(
"Are you sure you want to logout?"
)
){

return;

}


const keys = [

"createlk_student_email",
"studentEmail",
"email",
"userEmail",
"loggedInEmail",
"createlk_user",
"createlk_student",
"currentUser",
"user",
"student"

];

keys.forEach(
key =>
localStorage.removeItem(key)
);

sessionStorage.clear();

clearInterval(
countdownTimer
);

location.href =
"index.html";

};


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
text,
type="info"
){

message.style.display =
"block";

message.className =
"message " + type;

message.textContent =
text;

}


/* =========================================
   HIDE MESSAGE
========================================= */

function hideMessage(){

message.style.display =
"none";

}


/* =========================================
   MEMBERSHIP ACTIVE
========================================= */

function isActive(data){

if(!data){
return false;
}

if(
data.active === true
){
return true;
}

if(
String(data.active)
.toLowerCase()
===
"true"
){
return true;
}

if(
String(data.status || "")
.toLowerCase()
===
"active"
){
return true;
}

if(data.membership){

if(
data.membership.active === true
){
return true;
}

if(
String(
data.membership.status || ""
)
.toLowerCase()
===
"active"
){
return true;
}

}

if(data.subscription){

if(
data.subscription.active === true
){
return true;
}

if(
String(
data.subscription.status || ""
)
.toLowerCase()
===
"active"
){
return true;
}

}

return false;

}


/* =========================================
   GET EXPIRY
========================================= */

function getExpiry(data){

if(!data){
return null;
}

return (

data.expires_at ||

data.expiresAt ||

data.expiry ||

data.expiry_date ||

(
data.membership &&
(
data.membership.expires_at ||
data.membership.expiresAt ||
data.membership.expiry
)
) ||

(
data.subscription &&
(
data.subscription.expires_at ||
data.subscription.expiresAt ||
data.subscription.expiry
)
) ||

null

);

}


/* =========================================
   COUNTDOWN
========================================= */

function startCountdown(expiry){

clearInterval(
countdownTimer
);


const end =
new Date(
String(expiry)
.replace(" ","T")
).getTime();


if(
isNaN(end)
){
return;
}


function update(){

let seconds =
Math.floor(
(end - Date.now()) / 1000
);


if(seconds <= 0){

clearInterval(
countdownTimer
);

membershipBox.className =
"membership";

membershipBox.textContent =
"🔒 Premium membership expired.";

app.style.display =
"none";

return;

}


const days =
Math.floor(
seconds / 86400
);

seconds %= 86400;


const hours =
Math.floor(
seconds / 3600
);

seconds %= 3600;


const minutes =
Math.floor(
seconds / 60
);

seconds %= 60;


membershipBox.innerHTML = `

⭐ Premium Membership Active

<div class="countdown">

⏳ Expires in:
${days}d
${hours}h
${minutes}m
${seconds}s

</div>

`;

}


update();


countdownTimer =
setInterval(
update,
1000
);

}


/* =========================================
   CHECK MEMBERSHIP
========================================= */

async function checkMembership(){

const email =
getEmail();


if(!email){

membershipBox.className =
"membership";

membershipBox.textContent =
"🔐 Please login first.";

return;

}


try{

const url =
MEMBERSHIP_API +
"/status?email=" +
encodeURIComponent(email) +
"&t=" +
Date.now();


const response =
await fetch(
url,
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);


const text =
await response.text();


if(
!response.ok
){

throw new Error(
"Membership HTTP " +
response.status
);

}


const data =
JSON.parse(text);


console.log(
"Membership:",
data
);


if(
!isActive(data)
){

membershipBox.className =
"membership";

membershipBox.innerHTML =
"🔒 Premium membership not active.";

app.style.display =
"none";

return;

}


/* ACTIVE */

app.style.display =
"block";


membershipBox.className =
"membership";


const expiry =
getExpiry(data);


if(expiry){

startCountdown(
expiry
);

}else{

membershipBox.innerHTML =
"⭐ Premium Membership Active";

}

}catch(error){

console.error(error);

membershipBox.className =
"membership";

membershipBox.textContent =
"❌ Unable to verify Premium membership.";

}

}


/* =========================================
   NORMALIZE AI RESPONSE
========================================= */

function normalizeQuestions(data){

/*
   Supports several common Worker responses.
*/

if(
Array.isArray(data)
){

return data;

}


if(
Array.isArray(data.questions)
){

return data.questions;

}


if(
Array.isArray(data.mcqs)
){

return data.mcqs;

}


if(
data.data &&
Array.isArray(data.data.questions)
){

return data.data.questions;

}


if(
data.result &&
Array.isArray(data.result)
){

return data.result;

}


return [];

}


/* =========================================
   NORMALIZE QUESTION
========================================= */

function normalizeQuestion(q){

if(!q){
return null;
}


const question =
q.question ||
q.question_text ||
q.text ||
q.prompt ||
"";


let options =
q.options ||
q.choices ||
q.answers ||
[];


if(
!Array.isArray(options)
){

if(
typeof options === "object"
){

options =
Object.values(options);

}else{

options = [];

}

}


let answer =
q.answer ??
q.correct_answer ??
q.correctAnswer ??
q.correct ??
q.answer_index ??
q.correct_index;


return {

question:String(question),

options:options.map(
x => String(x)
),

answer:answer,

explanation:
String(
q.explanation ||
q.explain ||
""
)

};

}


/* =========================================
   GENERATE MCQS
========================================= */

generateButton.onclick =
async function(){

const email =
getEmail();


if(!email){

showMessage(
"Please login first.",
"error"
);

return;

}


const level =
document.getElementById(
"level"
).value;


const count =
Number(
document.getElementById(
"count"
).value
);


generateButton.disabled =
true;

generateButton.textContent =
"⏳ Generating...";

quiz.innerHTML =
"";

scoreBox.style.display =
"none";

footerButtons.style.display =
"none";

hideMessage();


showMessage(
"🤖 AI is generating your English MCQs...",
"info"
);


try{


/* =====================================
   REQUEST
===================================== */

const response =
await fetch(
AI_API + "/api/ai-mcq",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:JSON.stringify({

email:email,

student_email:email,

level:level,

difficulty:level,

count:count,

number_of_questions:count,

topic:"English Grammar and Vocabulary"

})

}
);


const text =
await response.text();


console.log(
"AI Worker status:",
response.status
);

console.log(
"AI Worker response:",
text
);


if(
!response.ok
){

throw new Error(
"AI Worker HTTP " +
response.status +
": " +
text.substring(0,200)
);

}


let data;


try{

data =
JSON.parse(text);

}catch(error){

throw new Error(
"AI Worker returned invalid JSON."
);

}


console.log(
"AI data:",
data
);


if(
data.success === false
){

throw new Error(
data.message ||
"AI generation failed."
);

}


const rawQuestions =
normalizeQuestions(data);


questions =
rawQuestions
.map(normalizeQuestion)
.filter(
q =>
q &&
q.question &&
q.options.length >= 2
);


if(
questions.length === 0
){

throw new Error(
"No MCQs were returned by the AI Worker."
);

}


/* =====================================
   DISPLAY
===================================== */

renderQuestions();


showMessage(
`✅ ${questions.length} MCQs generated successfully.`,
"success"
);


}catch(error){

console.error(
"Generation error:",
error
);


showMessage(
"❌ " +
(
error.message ||
"Unable to generate MCQs."
),
"error"
);


}finally{

generateButton.disabled =
false;

generateButton.textContent =
"🤖 Generate AI MCQs";

}

};


/* =========================================
   RENDER QUESTIONS
========================================= */

function renderQuestions(){

quiz.innerHTML =
"";


questions.forEach(
(q,index) => {

const box =
document.createElement(
"div"
);

box.className =
"question";


const title =
document.createElement(
"div"
);

title.className =
"question-title";

title.textContent =
`${index + 1}. ${q.question}`;


box.appendChild(
title
);


q.options.forEach(
(option,optIndex) => {

const button =
document.createElement(
"button"
);

button.type =
"button";

button.className =
"option";

button.textContent =
option;


button.onclick =
function(){

const all =
box.querySelectorAll(
".option"
);

all.forEach(
x =>
x.classList.remove(
"selected"
)
);

button.classList.add(
"selected"
);

button.dataset.selected =
"true";

button.dataset.index =
optIndex;

};


box.appendChild(
button
);

});


quiz.appendChild(
box
);

});


footerButtons.style.display =
"grid";

}


/* =========================================
   CHECK ANSWERS
========================================= */

submitButton.onclick =
function(){

if(
questions.length === 0
){
return;
}


let score = 0;


const boxes =
quiz.querySelectorAll(
".question"
);


boxes.forEach(
(box,qIndex) => {

const options =
box.querySelectorAll(
".option"
);


let selected =
null;


options.forEach(
(option,index) => {

if(
option.dataset.selected ===
"true"
){

selected =
index;

}

});


const question =
questions[qIndex];


let correct =
question.answer;


/*
   Convert answer to index
*/

if(
typeof correct ===
"string"
){

const letter =
correct
.trim()
.toUpperCase();


if(
["A","B","C","D"].includes(
letter
)
){

correct =
["A","B","C","D"]
.indexOf(letter);

}else{

const found =
question.options
.findIndex(
x =>
x.trim()
.toLowerCase()
===
correct
.trim()
.toLowerCase()
);

if(found >= 0){
correct = found;
}

}

}


correct =
Number(correct);


/* =====================================
   MARK ANSWERS
===================================== */

options.forEach(
(option,index) => {

if(
index === correct
){

option.classList.add(
"correct"
);

}

if(
index === selected &&
selected !== correct
){

option.classList.add(
"wrong"
);

}

});


if(
selected !== null &&
selected === correct
){

score++;

}


/* =====================================
   EXPLANATION
===================================== */

if(
question.explanation
){

const explanation =
document.createElement(
"div"
);

explanation.className =
"explanation";

explanation.innerHTML =
"💡 <b>Explanation:</b> " +
question.explanation;

box.appendChild(
explanation
);

}

});


scoreNumber.textContent =
`${score} / ${questions.length}`;


const percentage =
Math.round(
(score / questions.length) * 100
);


if(
percentage >= 80
){

scoreText.textContent =
"🌟 Excellent work!";

}else if(
percentage >= 60
){

scoreText.textContent =
"👍 Good job! Keep practising.";

}else{

scoreText.textContent =
"📚 Keep practising. You can improve!";

}


scoreBox.style.display =
"block";


window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

};


/* =========================================
   START
========================================= */

checkMembership();


/* =========================================
   RECHECK
========================================= */

document.addEventListener(
"visibilitychange",
function(){

if(
document.visibilityState ===
"visible"
){

checkMembership();

}

});

</script>

</body>
</html>
